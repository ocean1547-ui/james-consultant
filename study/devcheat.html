줍니다.","tags":["diff","word-diff","가독성"],"outputExample":"[-oldValue-]{+newValue+}","level":"고급"},{"id":"git-091","category":"git","title":"git diff --check 불필요한 줄 끝 공백 사전 검사","subtitle":"커밋 전 줄 끝 공백(Trailing Whitespace) 및 충돌 마커 감지","code":"# 변경된 파일들 중 줄 끝 공백이나 쓸데없는 줄바꿈 에러 점검\ngit diff --check\n\n# 에러가 있다면 파일명과 줄 번호, 빨간색 경고 표시 출력","description":"PR 리뷰에서 \"줄 끝 공백 지워주세요\" 같은 사소한 지적을 사전에 방지하는 깔끔한 검사 명령어입니다.","tags":["diff","check","공백검사","코드품질"],"outputExample":"src/App.tsx:42: trailing whitespace.","level":"고급"},{"id":"git-092","category":"git","title":"gh run watch & view (GitHub Actions 실시간 터미널 로그)","subtitle":"웹 브라우저를 열지 않고 터미널에서 CI/CD 워크플로우 진행 상황 실시간 확인","code":"# 1. 최근 실행된 GitHub Actions 목록 조회\ngh run list\n\n# 2. 현재 실행 중인 워크플로우가 끝날 때까지 실시간 터미널 스트리밍 감시\ngh run watch\n\n# 3. 실패한 실행의 에러 로그만 터미널에 출력\ngh run view --log-failed","description":"푸시 후 GitHub 웹사이트를 계속 새로고침할 필요 없이 CLI에서 즉시 빌드 실패 원인을 파악합니다.","tags":["gh","actions","CI/CD","실시간로그"],"outputExample":"✓ Build and Test in 45s (ID 12345678)","level":"고급"},{"id":"git-093","category":"git","title":"gh secret set (GitHub Actions 시크릿 터미널 즉시 등록)","subtitle":"웹 UI 클릭 없이 터미널 명령어로 API 키 및 환경 변수 안전 주입","code":"# 1. 대화형으로 비밀 키 입력하여 GitHub Actions Secret 등록\ngh secret set PROD_API_KEY\n\n# 2. .env 파일의 내용을 한 번에 저장소 시크릿으로 일괄 등록\ngh secret set -f .env.production\n\n# 3. 현재 등록된 시크릿 이름 목록 확인\ngh secret list","description":"서버 배포 자동화 스크립트에서 새로운 시크릿 환경 변수를 안전하게 프로비저닝할 때 필수적입니다.","tags":["gh","secret","보안","환경변수"],"outputExample":"✓ Set secret PROD_API_KEY for owner/repo","level":"고급"},{"id":"git-094","category":"git","title":"gh release create (릴리즈 태그, 변경 로그, 바이너리 배포)","subtitle":"버전 태그 생성, PR 기반 릴리즈 노트 자동 생성, 빌드 산출물 첨부","code":"# v1.2.0 릴리즈 생성 + 변경 로그 자동 생성 + 빌드 결과 ZIP 업로드\ngh release create v1.2.0 dist/app.zip \\\n  --title \"DevCheat v1.2.0 배포\" \\\n  --generate-notes","description":"GitHub 릴리즈 페이지를 터미널 한 줄로 완벽히 자동화하여 오픈소스 배포 시간을 단축합니다.","tags":["gh","release","배포","릴리즈노트"],"outputExample":"https://github.com/owner/repo/releases/tag/v1.2.0","level":"고급"},{"id":"git-095","category":"git","title":"GitHub Actions Matrix 전략 (다중 OS · 다중 Python 병렬 테스트)","subtitle":"하나의 워크플로우로 Ubuntu, Windows, macOS 및 여러 파이썬 버전 동시 검증","code":"# .github/workflows/test.yml 예시\njobs:\n  test:\n    runs-on: ${{ matrix.os }}\n    strategy:\n      matrix:\n        os: [ubuntu-latest, windows-latest, macos-latest]\n        python-version: [\"3.10\", \"3.11\", \"3.12\"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n      - run: pytest","description":"3개 OS * 3개 버전 = 총 9개의 조합을 병렬로 동시 실행하여 크로스 플랫폼 호환성을 입증합니다.","tags":["actions","matrix","병렬테스트","크로스플랫폼"],"outputExample":"Matrix: 9 jobs executed in parallel","level":"고급"},{"id":"git-096","category":"git","title":"GitHub Actions Composite Action 커스텀 액션 재사용 모듈 제작","subtitle":"중복되는 여러 워크플로우 step들을 단일 재사용 액션으로 패키징","code":"# .github/actions/setup-dev/action.yml 예시\nname: 'Setup Dev Environment'\ndescription: 'Node와 Python 캐시 일괄 세팅'\nruns:\n  using: 'composite'\n  steps:\n    - uses: actions/setup-node@v4\n      with:\n        node-version: '20'\n        cache: 'npm'\n    - run: npm ci\n      shell: bash","description":"저장소 내 여러 워크플로우 파일들 간에 복사-붙여넣기 되던 수십 줄의 셋업 단계를 깔끔하게 단일 모듈로 추상화합니다.","tags":["actions","composite","재사용","전문가"],"outputExample":"Composite action executed","level":"전문가"},{"id":"git-097","category":"git","title":"~/.ssh/config 다중 GitHub 계정(개인/회사) 완벽 분리","subtitle":"동일 PC에서 회사용 SSH 키와 개인 오픈소스용 SSH 키 충돌 없이 자동 분기","code":"# ~/.ssh/config 파일 내용:\nHost github.com-work\n    HostName github.com\n    User git\n    IdentityFile ~/.ssh/id_rsa_work\n\nHost github.com-personal\n    HostName github.com\n    User git\n    IdentityFile ~/.ssh/id_ed25519_personal\n\n# 원격 저장소 URL 연결 시:\n# git remote add origin git@github.com-work:company/repo.git","description":"회사 레포에 실수로 개인 계정 키로 접근하거나 커밋 이메일이 꼬이는 문제를 호스트 별칭으로 영구 해결합니다.","tags":["SSH","다중계정","config","보안"],"outputExample":"Authenticated to company repo as work user","level":"고급"},{"id":"git-098","category":"git","title":"git config core.autocrlf 줄바꿈(CRLF vs LF) 방지 및 .gitattributes","subtitle":"Windows와 Mac/Linux 간 줄바꿈 차이로 파일 전체가 변경된 것처럼 뜨는 현상 방지","code":"# Windows 환경 (체크아웃 시 CRLF, 커밋 시 LF 변환)\ngit config --global core.autocrlf true\n\n# Mac / Linux 환경 (커밋 시 LF 유지)\ngit config --global core.autocrlf input\n\n# 프로젝트 루트 .gitattributes 파일 권장 설정:\n# * text=auto eol=lf","description":"팀원 간 OS가 다를 때 발생하는 무의미한 whitespace diff와 셸 스크립트 ^M 실행 오류를 방지합니다.","tags":["autocrlf","LF","CRLF","gitattributes"],"outputExample":"core.autocrlf configured","level":"고급"},{"id":"git-099","category":"git","title":"git pack-redundant & prune-packed 중복 팩 파일 정리","subtitle":"오래된 저장소에서 다른 팩 파일에 이미 포함된 중복 .pack 파일 제거","code":"# 1. 중복된 팩 파일 목록 탐색 및 삭제\ngit pack-redundant --all | xargs -r rm\n\n# 2. 이미 팩 파일로 묶인 느슨한(loose) 단일 객체 디스크에서 제거\ngit prune-packed","description":".git 디렉토리의 용량을 극도로 다이어트하고 가비지 컬렉션 전 중복 저장 공간을 회수합니다.","tags":["pack-redundant","용량절약","내부구조","전문가"],"outputExample":"Redundant packs removed","level":"전문가"},{"id":"git-100","category":"git","title":"git stash branch 충돌 없이 임시 저장 코드로 새 브랜치 생성","subtitle":"현재 브랜치와 충돌 나는 스태시 내용을 스태시가 생성된 당시 커밋 기반 새 브랜치로 분기","code":"# 스태시를 만든 원래 커밋 시점으로 되돌아가 새 브랜치를 파고 스태시를 적용한 뒤 자동 삭제\ngit stash branch feature-experiment stash@{0}","description":"작업 중 현재 브랜치가 너무 많이 바뀌어 git stash pop 시 충돌이 두려울 때 안전하게 독립 브랜치로 격리 복원합니다.","tags":["stash","branch","충돌방지"],"outputExample":"Switched to a new branch 'feature-experiment'","level":"고급"},{"id":"git-101","category":"git","title":"git log --cherry-pick 두 브랜치 간 누락된 커밋만 선별 비교","subtitle":"cherry-pick 되었거나 머지되지 않은 순수 차이점 커밋만 색출","code":"# feature 브랜치와 main 브랜치를 비교하여 양쪽에 동일하게 반영되지 않은 커밋만 좌우 표시\ngit log --cherry-pick --left-right --oneline feature...main","description":"패치나 핫픽스를 체리픽으로 가져왔을 때 어떤 커밋이 아직 덜 넘어왔는지 확실하게 식별합니다.","tags":["log","cherry-pick","브랜치비교"],"outputExample":"< 1a2b3c (feature에만 존재) / > 4d5e6f (main에만 존재)","level":"고급"},{"id":"git-102","category":"git","title":"git commit --no-verify 훅 검사 긴급 바이패스","subtitle":"pre-commit이나 pre-push 훅 검사를 건너뛰고 긴급 커밋/푸시","code":"# 긴급 프로덕션 장애 핫픽스 시 린트/테스트 훅 실행 생략\ngit commit --no-verify -m \"hotfix: 장애 복구 패치\"\ngit push --no-verify origin hotfix-branch","description":"로컬 훅 스크립트에 버그가 있거나 긴급 장애 상황에서 임시로 유효성 검사를 우회합니다.","tags":["no-verify","긴급","핫픽스","전문가"],"outputExample":"Committed without running pre-commit hook","level":"전문가"},{"id":"git-103","category":"git","title":"git checkout -p / restore -p 특정 코드 조각만 부분 취소","subtitle":"파일 전체를 되돌리지 않고 특정 줄(Hunk)만 골라서 원래대로 복원","code":"# 대화형(Interactive)으로 파일 내 변경 블록들을 하나씩 보며 되돌릴지 선택\ngit restore -p src/App.tsx\n# 프롬프트: Discard this hunk from worktree [y,n,q,a,d,s,e,?]?\n# y: 이 부분만 취소, n: 유지, s: 더 작게 쪼개기","description":"테스트용 콘솔 로그나 불필요한 수정 줄만 핀포인트로 취소하고 진짜 필요한 코드만 남길 때 매우 유용합니다.","tags":["restore","checkout","-p","부분취소"],"outputExample":"Discard this hunk [y,n]?","level":"고급"},{"id":"git-104","category":"git","title":"git commit --allow-empty CI/CD 트리거용 빈 커밋 생성","subtitle":"코드 변경 없이 커밋만 찍어 GitHub Actions 재실행 트리거","code":"# 변경된 파일 없이 빈 커밋 생성 후 푸시\ngit commit --allow-empty -m \"chore: CI 파이프라인 재실행 트리거\"\ngit push origin feature-branch","description":"빌드 환경 일시 장애나 외부 네트워크 에러로 CI가 실패했을 때 코드 수정 없이 파이프라인을 재가동합니다.","tags":["commit","allow-empty","CI/CD"],"outputExample":"[main 9c8b] chore: CI 파이프라인 재실행 트리거","level":"실무필수"},{"id":"git-105","category":"git","title":"gh pr review (GitHub CLI 터미널 코드 리뷰 및 승인)","subtitle":"웹 브라우저 없이 터미널에서 동료 PR을 승인하거나 수정 요청","code":"# 1. PR 승인(Approve)\ngh pr review 42 --approve -b \"LGTM! 완벽하게 동작합니다.\"\n\n# 2. 수정 요청(Request Changes)\ngh pr review 42 --request-changes -b \"에러 핸들링 추가가 필요합니다.\"\n\n# 3. 단순 코멘트 남기기\ngh pr review 42 --comment -b \"이 부분 확인 부탁드립니다.\"","description":"터미널 위주의 개발 워크플로우에서 컨텍스트 전환 없이 빠르게 동료의 PR을 검토하고 승인합니다.","tags":["gh","review","코드리뷰","협업"],"outputExample":"✓ Approved pull request #42","level":"고급"},{"id":"git-106","category":"git","title":"git rebase -i --exec 각 커밋마다 테스트 자동 실행 및 검증","subtitle":"리베이스 도중 모든 개별 커밋에서 테스트가 통과하는지 순차 검증","code":"# 최근 5개 커밋을 리베이스하면서 매 커밋마다 npm test 자동 실행\ngit rebase -i HEAD~5 --exec \"npm test\"\n# 중간에 테스트가 실패하면 리베이스가 즉시 일시 정지되어 해당 시점 수정 가능","description":"여러 커밋 중 어느 커밋에서 테스트가 깨졌는지 확실히 짚어내어 히스토리 전체의 빌드 안정성을 보장합니다.","tags":["rebase","exec","테스트자동화","고급"],"outputExample":"Executing: npm test ... SUCCESS","level":"고급"},{"id":"git-107","category":"git","title":"git rev-list 커밋 개수 및 도달 가능 객체 파이프라인 분석","subtitle":"스크립트에서 커밋 수 카운팅 및 커밋 범위 역추적","code":"# 1. main 브랜치의 총 커밋 개수 카운트\ngit rev-list --count HEAD\n\n# 2. main에는 없고 feature 브랜치에만 있는 커밋 개수\ngit rev-list --count main..feature\n\n# 3. 도달 가능한 모든 고유 커밋 해시 목록 출력\ngit rev-list HEAD","description":"배포 자동화 스크립트나 CI 도구가 버전 번호(빌드 번호)를 자동 산정할 때 기초가 되는 명령어입니다.","tags":["rev-list","커밋개수","스크립트","전문가"],"outputExample":"142","level":"전문가"},{"id":"git-108","category":"git","title":"git log --left-right 양방향 커밋 분기 및 차이 비교 (A...B)","subtitle":"두 브랜치 간 어느 브랜치에 어떤 커밋이 있는지 화살표(<, >)로 한눈에 파악","code":"# 삼중 점(...)과 --left-right 옵션 결합\ngit log --left-right --oneline origin/main...main\n# < : origin/main에만 있는 커밋 (당겨와야 할 변경)\n# > : 로컬 main에만 있는 커밋 (푸시해야 할 변경)","description":"pull이나 push 전 원격과 로컬 브랜치 사이의 상호 불일치 커밋들을 명확하게 시각화합니다.","tags":["log","left-right","브랜치차이"],"outputExample":"< a1b2c3 (원격 전용) / > d4e5f6 (로컬 전용)","level":"고급"},{"id":"git-109","category":"git","title":"git diff --staged --stat 스테이징 변경 통계 요약","subtitle":"커밋하기 전 스테이징된 파일 목록과 수정 줄 수 요약 출력","code":"# git add 된 내용에 대해 파일별 변경 줄 수 통계 확인\ngit diff --staged --stat","description":"수십 개 파일을 add했을 때 실수로 올리지 말아야 할 파일이 포함되었는지 최종 점검하는 필수 루틴입니다.","tags":["diff","staged","stat","사전검토"],"outputExample":"src/App.tsx | 15 +++--- 1 file changed, 8 insertions(+)","level":"고급"},{"id":"git-110","category":"git","title":"git checkout -B / switch -C 강제 브랜치 생성 및 리셋","subtitle":"브랜치가 이미 존재해도 현재 커밋 시점으로 강제 리셋하며 전환","code":"# 브랜치가 없으면 새로 만들고, 이미 존재하면 현재 위치로 강제 이동\ngit switch -C experiment-branch","description":"기존 브랜치 삭제 후 다시 만드는 번거로움 없이 현재 시점에서 깔끔하게 브랜치를 재설정합니다.","tags":["switch","checkout","브랜치리셋"],"outputExample":"Reset branch 'experiment-branch'","level":"고급"},{"id":"git-111","category":"git","title":"git merge --squash 커밋 히스토리를 단 하나로 압축 병합","subtitle":"수십 개의 지저분한 작업 커밋들을 깔끔한 단일 커밋으로 스테이징","code":"# 1. feature 브랜치의 모든 변경사항을 하나의 스테이징 상태로 가져옴\ngit merge --squash feature-branch\n\n# 2. 압축된 단일 커밋 생성\ngit commit -m \"feat: 결제 기능 완성 (Squash merge)\"","description":"로컬 작업 시 남발했던 사소한 오타 수정이나 커밋 히스토리를 메인 브랜치에 깔끔하게 단일 커밋으로 정돈합니다.","tags":["merge","squash","히스토리정리"],"outputExample":"Squash commit -- not updating HEAD","level":"고급"},{"id":"git-112","category":"git","title":"git merge --no-ff Fast-Forward 방지 머지 커밋 강제 생성","subtitle":"단순 포인터 이동 대신 명시적인 병합 커밋을 남겨 기능 브랜치 기록 보존","code":"# Fast-Forward가 가능하더라도 머지 커밋을 강제로 남김\ngit merge --no-ff feature-auth -m \"merge: 사용자 인증 모듈 병합\"","description":"Git-Flow 전략에서 기능 개발 단위의 시작과 끝을 히스토리 그래프에 명확하게 남길 때 사용합니다.","tags":["merge","no-ff","Git-Flow"],"outputExample":"Merge made by the ort strategy.","level":"고급"},{"id":"git-113","category":"git","title":"git remote prune origin 원격 삭제 브랜치 레퍼런스 일괄 정리","subtitle":"GitHub에서 PR 머지 후 삭제된 원격 브랜치 로컬 잔재 제거","code":"# 1. 원격에서 삭제된 브랜치 캐시 일괄 청소\ngit remote prune origin\n\n# 2. 또는 fetch와 동시에 자동 정리\ngit fetch --prune","description":"git branch -a 조회 시 이미 원격에서 사라진 옛날 브랜치 이름들이 수백 개씩 쌓여 혼란을 주는 것을 막습니다.","tags":["remote","prune","정리"],"outputExample":"pruning origin / [pruned] origin/feature-old","level":"고급"},{"id":"git-114","category":"git","title":"git cherry-pick -m 1 머지 커밋(Merge Commit)의 체리픽","subtitle":"부모가 2개인 머지 커밋을 가져올 때 메인라인 부모 방향 지정","code":"# 머지 커밋(abc1234)의 첫 번째 부모(메인 브랜치 방향)를 기준으로 변경사항 채택\ngit cherry-pick -m 1 abc1234","description":"일반 cherry-pick은 머지 커밋을 만났을 때 어느 부모를 기준으로 diff를 떠야 할지 몰라 에러를 내므로 -m 1이 필수입니다.","tags":["cherry-pick","-m","머지커밋"],"outputExample":"[main 5e6f] cherry-picked merge commit","level":"고급"},{"id":"git-115","category":"git","title":"git rebase -i 중 break 키워드를 통한 일시 중단 및 디버깅","subtitle":"대화형 리베이스 목록에 break 명령을 넣어 특정 커밋 시점에서 셸 정지","code":"# todo 리스트 편집 중:\n# pick 1a2b3c 첫 번째 작업\n# break  <- 이 지점에서 리베이스 일시 정지!\n# pick 4d5e6f 두 번째 작업\n# -> 정지된 상태에서 코드 컴파일이나 브라우저 테스트 후 git rebase --continue","description":"과거 특정 시점의 실제 빌드 상태를 확인하거나 수동으로 임시 조사를 하고 싶을 때 가장 편리한 일시 정지 지점입니다.","tags":["rebase","break","디버깅","전문가"],"outputExample":"Stopped at break","level":"전문가"},{"id":"git-116","category":"git","title":"git submodule update --init --recursive 중첩 서브모듈 일괄 초기화","subtitle":"서브모듈 안에 또 다른 서브모듈이 있는 깊은 구조까지 전부 다운로드","code":"# 클론 시 한 번에:\ngit clone --recurse-submodules https://github.com/org/project.git\n\n# 이미 클론된 저장소에서 모든 서브모듈 재귀적 초기화 및 풀\ngit submodule update --init --recursive","description":"C/C++ 프로젝트나 대형 프레임워크처럼 서브모듈이 트리 구조로 얽혀 있을 때 빈 폴더 현상을 방지합니다.","tags":["submodule","recursive","초기화"],"outputExample":"Submodule path registered and fetched recursively","level":"고급"},{"id":"git-117","category":"git","title":"git submodule deinit 서브모듈 등록 해제 및 로컬 캐시 삭제","subtitle":"더 이상 쓰지 않는 서브모듈을 저장소 설정과 디스크에서 안전 제거","code":"# 1. 서브모듈 설정 등록 해제\ngit submodule deinit -f path/to/submodule\n\n# 2. 깃 인덱스에서 제거\ngit rm -f path/to/submodule\n\n# 3. .git/modules 캐시 디렉토리 정리\nrm -rf .git/modules/path/to/submodule","description":"서브모듈 제거는 단순 rm으로 끝나지 않으며 .gitmodules 파일과 캐시까지 일관되게 제거해야 오류가 안 납니다.","tags":["submodule","deinit","삭제"],"outputExample":"Cleared directory for submodule","level":"고급"},{"id":"git-118","category":"git","title":"git worktree list 활성 작업 트리 목록 및 경로 조회","subtitle":"현재 로컬 PC에 열려 있는 모든 독립 작업 폴더와 브랜치 현황 확인","code":"# 활성화된 워크트리 경로, 커밋 해시, 브랜치명 출력\ngit worktree list --porcelain","description":"여러 기능을 동시에 병렬 개발할 때 어느 폴더에 어느 브랜치가 체크아웃되어 있는지 파악합니다.","tags":["worktree","list","병렬개발"],"outputExample":"/workspace/app [main] / /workspace/hotfix [v1-fix]","level":"고급"},{"id":"git-119","category":"git","title":"git branch -vv 로컬 브랜치와 원격 추적 브랜치 상세 비교","subtitle":"각 브랜치가 원격 대비 몇 개 앞서고(ahead) 뒤처졌는지(behind) 한눈에 확인","code":"# 브랜치별 추적 원격지 및 ahead/behind 상태 출력\ngit branch -vv","description":"내가 작업한 커밋을 푸시했는지, 원격에 새 커밋이 있어서 pull해야 하는지 전체 브랜치 현황을 진단합니다.","tags":["branch","-vv","ahead","behind"],"outputExample":"main [origin/main: ahead 2, behind 1] feat: 로그인 구현","level":"고급"},{"id":"git-120","category":"git","title":"git tag -v GPG/SSH 서명된 릴리즈 태그 진위 검증","subtitle":"공식 배포 태그가 실제 신뢰할 수 있는 개발자가 서명했는지 확인","code":"# 태그 서명 검증\ngit tag -v v2.0.0","description":"오픈소스 라이브러리나 배포 바이너리를 내려받을 때 공급망 공격(Supply Chain Attack) 위변조를 판별합니다.","tags":["tag","-v","서명검증","보안"],"outputExample":"Good signature from Alex <alex@dev.com>","level":"고급"},{"id":"git-121","category":"git","title":"git log --graph --oneline --decorate 터미널 단축 그래프","subtitle":"GUI 툴 없이 터미널에서 브랜치 분기/병합 아스키 트리 조회","code":"git log --graph --oneline --decorate --all -n 15","description":"복잡하게 얽힌 커밋 히스토리를 터미널에서 즉시 파악하는 개발자 필수 log 단축키입니다.","tags":["log","graph","히스토리"],"outputExample":"* 1a2b3c (HEAD -> main) merge\n|\\ \n| * 4d5e6f feat: login","level":"고급"},{"id":"git-122","category":"git","title":"git clean -fdx 무시된 파일(.gitignore)까지 포함 완전 초기화","subtitle":"node_modules, 빌드 dist, 캐시까지 싹 날리고 순수 저장소 상태로 복귀","code":"# 1. 실제로 지워질 파일 목록 먼저 시뮬레이션 (-n: Dry Run)\ngit clean -ndx\n\n# 2. 확인 후 완전 강제 삭제 (-f: 강제, -d: 디렉토리, -x: gitignore 포함)\ngit clean -fdx","description":"원인 모를 빌드 캐시 오염이나 깨진 node_modules를 완전히 밀어버리고 갓 clone 받은 상태로 초기화합니다.","tags":["clean","-fdx","캐시청소","초기화"],"outputExample":"Removing node_modules/ Removing dist/","level":"고급"},{"id":"git-123","category":"git","title":"git stash show -p 스태시된 상세 diff 코드 미리보기","subtitle":"스태시를 복원(apply/pop)하기 전에 어떤 코드가 들어있는지 먼저 확인","code":"# 가장 최근 스태시의 상세 코드 diff 출력\ngit stash show -p\n\n# 특정 번호 스태시 내용 확인\ngit stash show -p stash@{2}","description":"여러 개의 스태시 중 내가 찾던 작업 코드가 맞는지 충돌 위험 없이 안전하게 미리 열어봅니다.","tags":["stash","show","diff미리보기"],"outputExample":"diff --git a/src/App.tsx b/src/App.tsx","level":"고급"},{"id":"git-124","category":"git","title":"git stash apply vs pop (스태시 목록 보존 복원)","subtitle":"pop과 달리 복원 후에도 스태시를 목록에서 지우지 않고 재사용","code":"# 스태시를 적용하되 목록에 그대로 남겨둠 (여러 브랜치에 동일 적용 가능)\ngit stash apply stash@{0}\n\n# 나중에 필요 없을 때 수동 삭제\ngit stash drop stash@{0}","description":"동일한 임시 코드 조각을 여러 브랜치에 번갈아가며 테스트할 때 유실 걱정 없이 안전하게 활용합니다.","tags":["stash","apply","재사용"],"outputExample":"Changes applied, stash preserved","level":"고급"},{"id":"git-125","category":"git","title":"git config pull.rebase true (불필요한 머지 커밋 방지)","subtitle":"git pull 시 자동으로 원격 변경사항 위로 내 로컬 커밋을 리베이스","code":"# 전역 설정으로 git pull 시 rebase 강제\ngit config --global pull.rebase true\n\n# 원격 브랜치가 변경되었을 때 내 커밋을 깔끔하게 최상단에 재배치","description":"단순 git pull로 인해 의미 없는 Merge branch main of... 머지 커밋이 히스토리를 도배하는 것을 원천 방지합니다.","tags":["pull","rebase","히스토리정돈"],"outputExample":"Successfully rebased and updated refs/heads/main","level":"고급"},{"id":"git-126","category":"git","title":"git log --grep 특정 커밋 메시지 패턴 검색","subtitle":"커밋 제목이나 본문에서 키워드 또는 정규식으로 커밋 필터링","code":"# 커밋 메시지에 'feat:' 또는 'fix:'가 포함된 커밋만 검색\ngit log --grep=\"^feat\" --oneline\n\n# 대소문자 무시 검색 (-i)\ngit log -i --grep=\"결제 모듈\"","description":"과거에 특정 작업이나 버그 수정을 언제 커밋했는지 히스토리 텍스트 기반으로 빠르게 찾아냅니다.","tags":["log","grep","커밋검색"],"outputExample":"7a1b2c feat: 실시간 알림 기능 추가","level":"고급"},{"id":"git-127","category":"git","title":"git revert -m 1 잘못 병합된 머지 커밋 안전 롤백","subtitle":"배포 후 치명적 오류가 발견된 PR 머지 커밋을 히스토리 파괴 없이 취소","code":"# 머지 커밋 해시(abc1234)에 대해 메인라인 부모(1)를 기준으로 되돌림 커밋 생성\ngit revert -m 1 abc1234 -m \"revert: 결제 오류로 인한 PR #42 긴급 롤백\"\ngit push origin main","description":"공용 메인 브랜치에서 reset --hard는 절대 금기이므로, revert -m 1로 안전하게 역커밋을 생성하여 롤백합니다.","tags":["revert","-m","긴급롤백","머지취소"],"outputExample":"[main 9f8e] revert: 결제 오류로 인한 PR 긴급 롤백","level":"고급"},{"id":"git-128","category":"git","title":"git diff branchA..branchB 두 브랜치 간 전체 코드 비교","subtitle":"두 브랜치 끝단(Tip) 사이의 직접적인 코드 차이점 비교","code":"# dev 브랜치와 prod 브랜치 최신 상태 간의 순수 코드 diff 비교\ngit diff dev..prod","description":"스테이징이나 현재 체크아웃 상태와 무관하게 임의의 두 원격/로컬 브랜치 간 최종 차이점을 조회합니다.","tags":["diff","브랜치비교","코드검토"],"outputExample":"diff --git a/src/index.ts b/src/index.ts","level":"고급"},{"id":"git-129","category":"git","title":"git diff branchA...branchB 공통 조상 기준 분기 비교","subtitle":"GitHub PR 화면에서 보여주는 방식 그대로 공통 조상 이후의 변경사항만 비교","code":"# main에서 분기된 이후 feature 브랜치에서 발생한 순수 변경사항만 조회 (점 3개 ...)\ngit diff main...feature","description":"main 브랜치에 그동안 다른 커밋들이 추가되었더라도, feature 브랜치 본인이 수정한 내용만 격리해서 볼 수 있습니다.","tags":["diff","PR비교","공통조상"],"outputExample":"feature 브랜치 순수 작성분만 출력","level":"고급"},{"id":"git-130","category":"git","title":"gh repo create (GitHub CLI 원격 저장소 즉시 생성)","subtitle":"브라우저 없이 로컬 폴더에서 GitHub 리포지토리 생성 및 푸시까지 한 줄 완료","code":"# 퍼블릭 저장소 생성 + 로컬 소스 코드 원격 푸시 + origin 연결 한 번에 완료\ngh repo create my-awesome-app --public --source=. --remote=origin --push","description":"프로젝트 시작 시 웹사이트로 가서 저장소를 만들고 URL을 복사해오는 번거로움을 완전히 없애줍니다.","tags":["gh","repo","저장소생성","초기화"],"outputExample":"✓ Created repository owner/my-awesome-app on GitHub","level":"고급"},{"id":"git-131","category":"git","title":"gh repo fork (오픈소스 레포 즉시 포크 및 로컬 클론)","subtitle":"오픈소스 기여 시 포크 생성과 로컬 클론, upstream 원격 설정을 한 방에 구성","code":"# 특정 오픈소스 저장소를 내 계정으로 포크하고 로컬에 클론\ngh repo fork facebook/react --clone=true","description":"포크된 저장소의 origin과 원본 upstream 리모트가 자동으로 세팅되어 오픈소스 기여 준비가 즉시 완료됩니다.","tags":["gh","fork","오픈소스","기여"],"outputExample":"✓ Forked facebook/react to user/react","level":"고급"},{"id":"git-132","category":"git","title":"gh pr merge --auto --squash 조건 충족 시 자동 병합 예약","subtitle":"CI 테스트가 통과하고 승인(Approve)을 받으면 자동으로 Squash 머지되도록 예약","code":"# CI 파이프라인 통과 즉시 머지 및 로컬/원격 브랜치 자동 삭제 예약\ngh pr merge 15 --auto --squash --delete-branch","description":"테스트 완료를 기다릴 필요 없이 머지 예약을 걸어두고 다음 작업으로 즉시 넘어갈 수 있습니다.","tags":["gh","merge","자동머지","생산성"],"outputExample":"✓ Will automatically merge #15 when requirements are met","level":"고급"},{"id":"git-133","category":"git","title":"git config credential.helper store 영구 자격 증명 파일 저장","subtitle":"개인 PC에서 매번 깃허브 토큰을 입력하지 않도록 로컬 파일에 영구 보관","code":"# 자격 증명 헬퍼를 파일 저장 방식으로 지정 (~/.git-credentials)\ngit config --global credential.helper store","description":"보안 격리가 된 단독 개발 PC에서 HTTPS 푸시 시 매번 비밀번호를 묻지 않도록 해줍니다.","tags":["credential","store","자동로그인"],"outputExample":"Credential store configured","level":"고급"},{"id":"git-134","category":"git","title":"git commit -v 커밋 메시지 작성 시 diff 코드 전체 보며 작성","subtitle":"에디터 하단에 변경된 코드 diff가 주석으로 떠서 정확한 커밋 메시지 작성 지원","code":"# 에디터 창에 실제 코드 변경 사항이 함께 열림\ngit commit -v","description":"내가 무엇을 수정했는지 에디터에서 직접 눈으로 대조하며 구체적이고 정확한 커밋 메시지를 작성할 수 있습니다.","tags":["commit","-v","diff참조"],"outputExample":"Opens editor with full diff commented below","level":"고급"},{"id":"git-135","category":"git","title":"git status -s 초간결(Short) 상태 요약 출력","subtitle":"M, A, D, ?? 등 2글자 플래그로 핵심 변경 파일만 군더더기 없이 출력","code":"# 긴 안내 문구 없이 한 줄당 한 파일씩 변경 상태 출력\ngit status -s\n# M : 스테이징된 수정\n#  M: 스테이징 안 된 수정\n# ?? : 신규 추적되지 않은 파일","description":"터미널 공간을 아끼고 스크립트에서 파일 상태를 빠르게 파싱할 때 애용되는 단축 모드입니다.","tags":["status","-s","요약"],"outputExample":"M src/App.tsx\n?? .env.local","level":"고급"},{"id":"git-136","category":"git","title":"git 배관: git update-ref 저수준 브랜치 HEAD 강제 이동","subtitle":"작업 트리를 변경하지 않고 브랜치 포인터만 특정 해시로 원자적 이동","code":"# refs/heads/main 브랜치 포인터를 특정 커밋 해시로 즉시 업데이트\ngit update-ref refs/heads/main 3a4b5c6d","description":"Git 내부에서 브랜치 전환이나 리베이스 완료 시 브랜치 참조를 원자적으로(Atomically) 갱신하는 배관 명령어입니다.","tags":["plumbing","update-ref","참조갱신","전문가"],"outputExample":"Updated refs/heads/main to 3a4b5c6d","level":"전문가"},{"id":"git-137","category":"git","title":"git 배관: git mktag 저수준 어노테이션 태그 객체 직접 생성","subtitle":"태그 메타데이터 문자열로부터 SHA-1 태그 객체 생성","code":"# 태그 명세 입력 후 태그 해시 생성\ncat << EOF | git mktag\nobject $(git rev-parse HEAD)\ntype commit\ntag v3.0.0-custom\ntagger Developer <dev@site.com> 1600000000 +0900\n\n커스텀 저수준 태그 생성\nEOF","description":"Git의 4대 핵심 객체(commit, tree, blob, tag) 중 tag 객체의 내부 구조를 직접 조작합니다.","tags":["plumbing","mktag","태그객체","전문가"],"outputExample":"7f8a9b...","level":"전문가"},{"id":"git-138","category":"git","title":"git 배관: git unpack-objects 팩 파일에서 원시 객체 추출","subtitle":"압축된 .pack 바이너리 아카이브를 풀어 개별 .git/objects 해시로 분해","code":"# 표준 입력으로 전달받은 팩 파일을 개별 오브젝트들로 해제\ngit unpack-objects < .git/objects/pack/pack-1234.pack","description":"git push/fetch 네트워크 전송 시 묶인 팩 데이터를 내부 객체 데이터베이스로 언팩하는 원리입니다.","tags":["plumbing","unpack-objects","팩해제","전문가"],"outputExample":"Unpacking objects: 100% (50/50)","level":"전문가"},{"id":"git-139","category":"git","title":"git log --no-merges 순수 작업 커밋만 필터링","subtitle":"머지 커밋(Merge branch...)을 모두 제외하고 실제 기능/버그 수정 커밋만 조회","code":"# 머지 커밋 노이즈를 제거하고 순수 코드 수정 커밋만 정렬\ngit log --no-merges --oneline -n 20","description":"릴리즈 노트를 작성하거나 특정 기간 동안 실제 개발자들이 어떤 코드를 짰는지 파악할 때 필수적입니다.","tags":["log","no-merges","필터링"],"outputExample":"순수 기능 커밋 목록만 깔끔하게 출력","level":"고급"},{"id":"git-140","category":"git","title":"git branch --no-merged 아직 병합되지 않은 미완료 브랜치 목록","subtitle":"main 브랜치에 아직 머지되지 않아 삭제하면 작업이 유실될 수 있는 브랜치 색출","code":"# 현재 브랜치 기준으로 아직 머지되지 않은 브랜치들만 출력\ngit branch --no-merged","description":"저장소 브랜치 청소 시 실수로 작업 중인 브랜치를 지우지 않도록 안전하게 사전 점검합니다.","tags":["branch","no-merged","안전검사"],"outputExample":"  feature/payment-v2\n  wip/new-design","level":"고급"},{"id":"git-141","category":"git","title":"git remote set-url origin 기존 저장소 원격 주소 변경","subtitle":"HTTPS 주소를 SSH(git@github.com:...) 주소로 변경하거나 저장소 이전 반영","code":"# 원격 저장소 URL을 SSH 방식으로 즉시 변경\ngit remote set-url origin git@github.com:username/repository.git\n\n# 변경 결과 확인\ngit remote -v","description":"기존에 clone 받은 저장소의 인증 방식을 바꾸거나 조직 이전(Org Transfer) 시 로컬 설정을 갱신합니다.","tags":["remote","set-url","SSH","원격변경"],"outputExample":"origin git@github.com:username/repository.git (fetch)","level":"고급"},{"id":"git-142","category":"git","title":"git log --stat --summary 파일 생성/이름변경/삭제 요약","subtitle":"커밋 히스토리에서 파일의 이동(rename) 및 권한 모드 변경(mode change) 파악","code":"# 파일 구조 변경 요약 정보를 포함하여 커밋 조회\ngit log --stat --summary -n 5","description":"파일명이 바뀌었거나 새 파일이 생성된 내역을 직관적인 create mode 100644 요약으로 확인합니다.","tags":["log","summary","파일이동"],"outputExample":"rename old.ts => new.ts (98%)","level":"고급"},{"id":"git-143","category":"git","title":"git diff --color-words 색상 하이라이트 인라인 단어 비교","subtitle":"특수 기호 없이 터미널 색상만으로 추가/삭제된 단어 비교","code":"git diff --color-words","description":"문서나 코드 변경 시 시각적 잡음 없이 터미널에서 부드럽게 단어 차이를 읽을 수 있습니다.","tags":["diff","color-words","가독성"],"outputExample":"Green text for added, red text for removed","level":"고급"},{"id":"git-144","category":"git","title":"git verify-pack 저장소 팩 파일 무결성 및 용량 분석","subtitle":"가장 큰 용량을 차지하는 블롭 객체 해시와 바이트 크기 정렬","code":"# 팩 파일 내에서 가장 큰 객체 상위 10개 정렬 출력\ngit verify-pack -v .git/objects/pack/*.idx | sort -k 3 -n | tail -10","description":".git 용량이 수 GB로 비정상적으로 비대해졌을 때 어떤 바이너리 파일이 주범인지 찾아내는 전문가용 진단법입니다.","tags":["verify-pack","용량분석","대용량객체","전문가"],"outputExample":"3a4b... blob 52428800 45123400 12345 (50MB 파일)","level":"전문가"},{"id":"git-145","category":"git","title":"git switch -c new_branch 즉시 새 브랜치 생성 및 전환","subtitle":"구형 git checkout -b 를 대체하는 현대적인 최신 권장 명령어","code":"# 새 브랜치 생성 및 즉시 이동\ngit switch -c feature/cart-page","description":"파일 복원과 브랜치 전환의 의미가 혼재되었던 checkout 대신 용도가 명확히 분리된 최신 Git 명령어입니다.","tags":["switch","-c","브랜치생성","최신권장"],"outputExample":"Switched to a new branch 'feature/cart-page'","level":"고급"},{"id":"vsc-001","category":"vscode","title":"코드 줄 복사 (Copy Line Up / Down)","subtitle":"현재 커서 위치의 라인을 위 또는 아래로 즉시 복제","code":"// Windows: Shift + Alt + ↓ / ↑\n// macOS:   Shift + Option + ↓ / ↑","description":"블록 지정이나 복사/붙여넣기 없이 커서가 있는 줄 전체를 위나 아래에 즉시 복제합니다.","tags":["줄복사","편집","기본단축키"],"keysWin":["Shift","Alt","↓ / ↑"],"keysMac":["Shift","⌥ Option","↓ / ↑"],"level":"기초"},{"id":"vsc-002","category":"vscode","title":"코드 줄 이동 (Move Line Up / Down)","subtitle":"현재 줄을 위나 아래 라인과 위치 맞바꾸기","code":"// Windows: Alt + ↓ / ↑\n// macOS:   Option + ↓ / ↑","description":"잘라내기/붙여넣기 없이 코드 라인의 순서를 위아래로 자유롭게 변경합니다.","tags":["줄이동","순서변경","편집"],"keysWin":["Alt","↓ / ↑"],"keysMac":["⌥ Option","↓ / ↑"],"level":"기초"},{"id":"vsc-003","category":"vscode","title":"현재 줄 전체 삭제 (Delete Line)","subtitle":"백스페이스 없이 라인 전체를 공백 없이 삭제","code":"// Windows: Ctrl + Shift + K\n// macOS:   Cmd + Shift + K","description":"커서의 위치와 상관없이 해당 줄 전체를 한 번에 지웁니다.","tags":["줄삭제","삭제","편집"],"keysWin":["Ctrl","Shift","K"],"keysMac":["⌘ Cmd","Shift","K"],"level":"기초"},{"id":"vsc-004","category":"vscode","title":"한 줄 주석 토글 (Toggle Line Comment)","subtitle":"현재 줄 또는 선택 영역 주석 처리 및 해제","code":"// Windows: Ctrl + /\n// macOS:   Cmd + /","description":"언어에 맞게 자동으로 //, #, <!-- --> 주석을 적용하거나 해제합니다.","tags":["주석","토글","편집"],"keysWin":["Ctrl","/"],"keysMac":["⌘ Cmd","/"],"level":"기초"},{"id":"vsc-005","category":"vscode","title":"블록 주석 토글 (Toggle Block Comment)","subtitle":"여러 줄을 블록 주석(/* */)으로 감싸기","code":"// Windows: Shift + Alt + A\n// macOS:   Shift + Option + A","description":"여러 줄의 코드를 블록 단위 주석으로 한 번에 묶습니다.","tags":["주석","블록주석","편집"],"keysWin":["Shift","Alt","A"],"keysMac":["Shift","⌥ Option","A"],"level":"기초"},{"id":"vsc-006","category":"vscode","title":"동일 단어 연속 선택 (Select Next Occurrence)","subtitle":"같은 단어를 하나씩 다중 선택하여 일괄 수정","code":"// Windows: Ctrl + D (누를 때마다 다음 단어 추가 선택)\n// macOS:   Cmd + D","description":"변수명이나 클래스명을 일괄 변경할 때 가장 많이 쓰이는 핵심 단축키입니다.","tags":["다중선택","Ctrl+D","일괄수정"],"keysWin":["Ctrl","D"],"keysMac":["⌘ Cmd","D"],"level":"실무필수"},{"id":"vsc-007","category":"vscode","title":"동일 단어 전체 일괄 선택 (Select All Occurrences)","subtitle":"파일 내에 존재하는 동일한 단어를 한 번에 모두 선택","code":"// Windows: Ctrl + Shift + L  (또는 Ctrl + F2)\n// macOS:   Cmd + Shift + L   (또는 Cmd + F2)","description":"현재 선택한 단어와 일치하는 파일 내 모든 단어에 커서를 일괄 생성합니다.","tags":["다중선택","전체선택","일괄수정"],"keysWin":["Ctrl","Shift","L"],"keysMac":["⌘ Cmd","Shift","L"],"level":"실무필수"},{"id":"vsc-008","category":"vscode","title":"다중 커서 마우스 클릭 (Insert Multi-Cursor)","subtitle":"원하는 위치를 클릭하여 여러 개의 커서 동시 생성","code":"// Windows: Alt + 마우스 좌클릭\n// macOS:   Option + 마우스 좌클릭","description":"서로 다른 줄의 임의 위치에 커서를 여러 개 두고 동시에 타이핑합니다.","tags":["다중커서","멀티커서","마우스"],"keysWin":["Alt","+ Click"],"keysMac":["⌥ Option","+ Click"],"level":"실무필수"},{"id":"vsc-009","category":"vscode","title":"열(Column) 블록 박스 선택","subtitle":"세로 방향으로 사각형 블록 영역 지정","code":"// Windows: Shift + Alt + 마우스 드래그\n// macOS:   Shift + Option + 마우스 드래그","description":"데이터 테이블이나 JSON 등의 특정 열(Column)만 세로로 묶어 복사/수정합니다.","tags":["열선택","세로선택","블록"],"keysWin":["Shift","Alt","Drag"],"keysMac":["Shift","⌥ Option","Drag"],"level":"중급"},{"id":"vsc-010","category":"vscode","title":"빠른 파일 열기 (Quick Open File)","subtitle":"파일명 검색으로 프로젝트 내 어떤 파일이든 1초 만에 점프","code":"// Windows: Ctrl + P\n// macOS:   Cmd + P\n// 팁: 파일명 뒤에 ':42'를 붙이면 42번째 줄로 바로 점프!","description":"탐색기 폴더를 일일이 열지 않고 파일명 몇 글자만 쳐서 원하는 파일을 즉시 엽니다.","tags":["빠른열기","탐색","점프"],"keysWin":["Ctrl","P"],"keysMac":["⌘ Cmd","P"],"level":"실무필수"},{"id":"vsc-011","category":"vscode","title":"명령 팔레트 열기 (Command Palette)","subtitle":"VS Code의 모든 명령어와 설정을 검색 및 실행","code":"// Windows: Ctrl + Shift + P  (또는 F1)\n// macOS:   Cmd + Shift + P  (또는 F1)","description":"단축키를 외우지 않아도 테마 변경, 설정, 확장 기능, Git 명령 등을 검색해 실행합니다.","tags":["명령팔레트","F1","설정"],"keysWin":["Ctrl","Shift","P"],"keysMac":["⌘ Cmd","Shift","P"],"level":"기초"},{"id":"vsc-012","category":"vscode","title":"프로젝트 전체 검색 및 바꾸기 (Global Find & Replace)","subtitle":"프로젝트 전체 파일에서 텍스트 찾기 및 치환","code":"// 전체 검색:\n// Windows: Ctrl + Shift + F\n// macOS:   Cmd + Shift + F\n\n// 전체 바꾸기:\n// Windows: Ctrl + Shift + H\n// macOS:   Cmd + Shift + H","description":"특정 변수나 API 엔드포인트가 프로젝트 전역 어디에 쓰였는지 조회하고 바꿉니다.","tags":["전체검색","바꾸기","Find"],"keysWin":["Ctrl","Shift","F / H"],"keysMac":["⌘ Cmd","Shift","F / H"],"level":"실무필수"},{"id":"vsc-013","category":"vscode","title":"내장 터미널 토글 (Toggle Integrated Terminal)","subtitle":"에디터 하단의 내장 CLI 콘솔 창 열기/숨기기","code":"// Windows: Ctrl + ` (백틱 키)\n// macOS:   Ctrl + ` (백틱 키)\n\n// 새 터미널 추가: Ctrl + Shift + `","description":"외부 터미널로 창 전환 없이 에디터 안에서 npm, git, python 명령어를 실행합니다.","tags":["터미널","콘솔","백틱"],"keysWin":["Ctrl","` (백틱)"],"keysMac":["Ctrl","` (백틱)"],"level":"기초"},{"id":"vsc-014","category":"vscode","title":"코드 자동 정렬 (Format Document)","subtitle":"Prettier 규칙에 맞춰 들여쓰기와 줄바꿈 자동 정렬","code":"// Windows: Shift + Alt + F\n// macOS:   Shift + Option + F","description":"어지러워진 코드의 들여쓰기와 공백을 한 ,"tags":["단어이동","단어삭제","편집"],"keysWin":["Ctrl","← / →"],"keysMac":["⌥ Option","← / →"],"level":"기초"},{"id":"vsc-047","category":"vscode","title":"파일 맨 처음 및 맨 끝으로 점프","subtitle":"수천 줄 문서의 1번 줄과 마지막 줄로 즉시 이동","code":"// 문서 맨 처음으로:\n// Windows: Ctrl + Home\n// macOS:   Cmd + ↑\n\n// 문서 맨 끝으로:\n// Windows: Ctrl + End\n// macOS:   Cmd + ↓","description":"마우스 휠 스크롤 없이 문서의 극단으로 즉각 이동합니다.","tags":["Home","End","문서이동"],"keysWin":["Ctrl","Home / End"],"keysMac":["⌘ Cmd","↑ / ↓"],"level":"기초"},{"id":"vsc-048","category":"vscode","title":"사용자 설정(Settings JSON) 열기","subtitle":"VS Code 환경 설정 JSON 파일 직접 편집","code":"// 명령 팔레트(Ctrl+Shift+P) > \"Preferences: Open User Settings (JSON)\"","description":"GUI 설정창 대신 settings.json에서 폰트, 포맷터, 단축키 설정을 코드로 정밀 관리합니다.","tags":["settings","설정","JSON"],"keysWin":["Ctrl+Shift+P","> Settings JSON"],"keysMac":["⌘+Shift+P","> Settings JSON"],"level":"실무필수"},{"id":"vsc-049","category":"vscode","title":"코드 스니펫(Snippet) 관리 및 삽입","subtitle":"반복 입력하는 템플릿 코드를 약어로 자동 생성","code":"// 명령 팔레트(Ctrl+Shift+P) > \"Preferences: Configure User Snippets\"","description":"rfc(React 컴포넌트), def(함수 템플릿) 등 나만의 단축 키워드를 등록합니다.","tags":["스니펫","템플릿","생산성"],"keysWin":["Ctrl+Shift+P","> Snippets"],"keysMac":["⌘+Shift+P","> Snippets"],"level":"중급"},{"id":"vsc-050","category":"vscode","title":"Diff 뷰어 이전/다음 변경사항 이동","subtitle":"Git 변경 코드 간 다이렉트 점프","code":"// 다음 변경점으로 이동: F7\n// 이전 변경점으로 이동: Shift + F7","description":"커밋 전 Git Diff 화면에서 변경된 코드 줄만 건너뛰며 리뷰합니다.","tags":["Diff","F7","코드리뷰"],"keysWin":["F7","/","Shift+F7"],"keysMac":["F7","/","Shift+F7"],"level":"실무필수"},{"id":"vsc-051","category":"vscode","title":"하단 패널(출력/디버그 콘솔) 토글","subtitle":"에디터 하단 종합 패널 열기 및 닫기","code":"// Windows: Ctrl + J\n// macOS:   Cmd + J","description":"터미널, 출력, 디버그 콘솔이 위치한 하단 패널을 간편하게 접었다 폅니다.","tags":["패널","Ctrl+J","화면"],"keysWin":["Ctrl","J"],"keysMac":["⌘ Cmd","J"],"level":"기초"},{"id":"vsc-052","category":"vscode","title":"창 다시 로드 (Reload Window)","subtitle":"확장 프로그램 설치 후 또는 에디터 버벅임 시 클린 리로드","code":"// 명령 팔레트(Ctrl+Shift+P) > \"Developer: Reload Window\"","description":"VS Code 전체를 껐다 켤 필요 없이 1초 만에 캐시를 비우고 세션을 리로드합니다.","tags":["Reload","리로드","캐시"],"keysWin":["Ctrl+Shift+P","> Reload Window"],"keysMac":["⌘+Shift+P","> Reload Window"],"level":"실무필수"},{"id":"vsc-053","category":"vscode","title":"파일 탐색기 포커스 이동 (Show File Explorer)","subtitle":"키보드만으로 좌측 파일 트리로 포커스 전환","code":"// Windows: Ctrl + Shift + E\n// macOS:   Cmd + Shift + E","description":"마우스 없이 탐색기 파일 트리를 방향키로 탐색하고 Enter로 파일을 엽니다.","tags":["탐색기","포커스","키보드"],"keysWin":["Ctrl","Shift","E"],"keysMac":["⌘ Cmd","Shift","E"],"level":"기초"},{"id":"vsc-054","category":"vscode","title":"새 에디터 창 열기 (New Window)","subtitle":"별도의 모니터에 다른 프로젝트 새 창 띄우기","code":"// Windows: Ctrl + Shift + N\n// macOS:   Cmd + Shift + N","description":"다른 리포지토리를 별도 창으로 띄워 듀얼 모니터로 동시에 참조할 때 사용합니다.","tags":["새창","윈도우","창관리"],"keysWin":["Ctrl","Shift","N"],"keysMac":["⌘ Cmd","Shift","N"],"level":"기초"},{"id":"vsc-055","category":"vscode","title":"전체 선택 (Select All)","subtitle":"현재 활성화된 파일의 코드 전체 블록 지정","code":"// Windows: Ctrl + A\n// macOS:   Cmd + A","description":"파일 전체 복사나 일괄 삭제 시 사용되는 기본 단축키입니다.","tags":["전체선택","Ctrl+A"],"keysWin":["Ctrl","A"],"keysMac":["⌘ Cmd","A"],"level":"기초"},{"id":"vsc-056","category":"vscode","title":"줄 복사 건너뛰기 취소 (Undo Last Cursor)","subtitle":"Ctrl+D로 잘못 선택한 단어 선택 취소","code":"// Windows: Ctrl + U\n// macOS:   Cmd + U","description":"Ctrl+D를 연타하다가 의도하지 않은 단어까지 선택되었을 때 이전 커서 위치로 롤백합니다.","tags":["선택취소","커서취소","Ctrl+U"],"keysWin":["Ctrl","U"],"keysMac":["⌘ Cmd","U"],"level":"실무필수"},{"id":"vsc-057","category":"vscode","title":"현재 파일 다른 이름으로 저장 (Save As)","subtitle":"작업 중인 파일 복사본 저장","code":"// Windows: Ctrl + Shift + S\n// macOS:   Cmd + Shift + S","description":"현재 파일의 내용을 새로운 이름의 파일로 복제 저장합니다.","tags":["저장","SaveAs"],"keysWin":["Ctrl","Shift","S"],"keysMac":["⌘ Cmd","Shift","S"],"level":"기초"},{"id":"vsc-058","category":"vscode","title":"에디터 탭 고정 (Pin Editor Tab)","subtitle":"다른 파일을 많이 열어도 닫히지 않도록 탭 핀 고정","code":"// Windows: Ctrl + K 누른 후 Shift + Enter\n// macOS:   Cmd + K 누른 후 Shift + Enter","description":"핵심 메인 파일을 탭 바 왼쪽에 고정시켜 실수로 닫히지 않도록 보호합니다.","tags":["탭고정","Pin","탭관리"],"keysWin":["Ctrl + K","Shift+Enter"],"keysMac":["⌘ Cmd + K","Shift+Enter"],"level":"실무필수"},{"id":"vsc-059","category":"vscode","title":"브레드크럼(Breadcrumbs) 탐색 포커스","subtitle":"파일 상단 경로 네비게이션 바로 키보드 포커스 이동","code":"// Windows: Ctrl + Shift + ; (세미콜론)\n// macOS:   Cmd + Shift + ;","description":"파일의 폴더 경로와 현재 커서가 위치한 클래스/함수 계층을 키보드로 탐색합니다.","tags":["브레드크럼","Breadcrumbs","네비게이션"],"keysWin":["Ctrl","Shift",";"],"keysMac":["⌘ Cmd","Shift",";"],"level":"중급"},{"id":"vsc-060","category":"vscode","title":"단축키 설정 목록 열기 (Keyboard Shortcuts)","subtitle":"모든 단축키 검색 및 나만의 커스텀 단축키 등록","code":"// Windows: Ctrl + K 누른 후 Ctrl + S\n// macOS:   Cmd + K 누른 후 Cmd + S","description":"손에 맞지 않는 기본 단축키를 나만의 키 조합으로 재정의합니다.","tags":["단축키설정","키바인딩","커스텀"],"keysWin":["Ctrl + K","Ctrl + S"],"keysMac":["⌘ Cmd + K","Cmd + S"],"level":"기초"},{"id":"vsc-061","category":"vscode","title":"조건부 중단점 (Conditional Breakpoint)","subtitle":"특정 표현식이 참(True)이 될 때만 실행 멈추기","code":"// 중단점 우클릭 -> [Add Conditional Breakpoint...]\n// 조건 예시: index === 500 || user.id === \"target_user\"","description":"수천 번 반복되는 루프에서 버그가 발생하는 특정 조건에서만 디버거를 일시 중지시킵니다.","tags":["디버깅","조건부중단점","Breakpoint","고급"],"keysWin":["우클릭","Add Conditional Breakpoint"],"keysMac":["우클릭","Add Conditional Breakpoint"],"level":"고급"},{"id":"vsc-062","category":"vscode","title":"로그포인트 (Logpoint) - 무정지 콘솔 로깅","subtitle":"코드에 console.log / print를 추가하지 않고 디버그 콘솔에 값 출력","code":"// 줄 번호 왼쪽 여백 우클릭 -> [Add Logpoint...]\n// 메시지 포맷: \"현재 사용자 ID: {user.id}, 점수: {score}\"","description":"서버나 클라이언트를 재시작할 필요 없이 실행 도중 변수 값을 안전하게 디버그 콘솔에 출력합니다.","tags":["디버깅","Logpoint","로그포인트","고급"],"keysWin":["우클릭","Add Logpoint"],"keysMac":["우클릭","Add Logpoint"],"level":"고급"},{"id":"vsc-063","category":"vscode","title":"히트 카운트 (Hit Count) 중단점","subtitle":"특정 횟수 이상 방문했을 때만 중단 (예: 100번째 루프)","code":"// 중단점 우클릭 -> [Edit Breakpoint] -> Hit Count 선택\n// 표현식: > 50 (50번 초과 통과 후 멈춤) 또는 % 10 == 0","description":"반복문이 수십 번 돌고 난 이후 상태를 관찰하고 싶을 때 매번 F5를 누를 필요 없이 자동 스킵합니다.","tags":["디버깅","HitCount","루프","고급"],"keysWin":["우클릭","Hit Count"],"keysMac":["우클릭","Hit Count"],"level":"고급"},{"id":"vsc-064","category":"vscode","title":"launch.json 커스텀 디버그 프로필 구성","subtitle":"FastAPI, Django, Flask, Node.js 원격 디버깅 및 환경 변수 주입","code":"// .vscode/launch.json 구성 예시\n{\n  \"version\": \"0.2.0\",\n  \"configurations\": [\n    {\n      \"name\": \"Python: FastAPI 서버 디버깅\",\n      \"type\": \"debugpy\",\n      \"request\": \"launch\",\n      \"module\": \"uvicorn\",\n      \"args\": [\"main:app\", \"--reload\", \"--port\", \"8000\"],\n      \"jinja\": true,\n      \"env\": { \"DEBUG\": \"1\", \"DB_HOST\": \"localhost\" }\n    }\n  ]\n}","description":"F5 키를 누르는 즉시 사전에 정의된 인수(args)와 환경 변수(env)를 가지고 모듈 서버를 디버그 모드로 구동합니다.","tags":["launch.json","디버그설정","FastAPI","전문가"],"keysWin":["F5","launch.json"],"keysMac":["F5","launch.json"],"level":"전문가"},{"id":"vsc-065","category":"vscode","title":"tasks.json 커스텀 빌드/린트 태스크 등록","subtitle":"반복 실행하는 셸 명령어(npm build, pytest 등)를 단축키로 바인딩","code":"// .vscode/tasks.json 예시\n{\n  \"version\": \"2.0.0\",\n  \"tasks\": [\n    {\n      \"label\": \"Run Tests\",\n      \"type\": \"shell\",\n      \"command\": \"pytest -v\",\n      \"group\": { \"kind\": \"test\", \"isDefault\": true },\n      \"presentation\": { \"reveal\": \"always\", \"panel\": \"new\" }\n    }\n  ]\n}\n// Windows: Ctrl + Shift + B (기본 빌드 태스크 실행)\n// macOS:   Cmd + Shift + B","description":"단축키 한 번으로 단위 테스트나 빌드 파이프라인을 내장 터미널에서 즉시 백그라운드 구동합니다.","tags":["tasks.json","빌드자동화","태스크","고급"],"keysWin":["Ctrl","Shift","B"],"keysMac":["⌘ Cmd","Shift","B"],"level":"고급"},{"id":"vsc-066","category":"vscode","title":"워크스페이스 전역 심볼 검색 (Symbol in Workspace)","subtitle":"프로젝트 전체 파일에서 함수, 클래스, 인터페이스 이름으로 즉시 점프","code":"// Windows: Ctrl + T (또는 Ctrl + P 누른 후 #)\n// macOS:   Cmd + T (또는 Cmd + P 누른 후 #)\n// 검색창에 #함수명 또는 #클래스명 입력","description":"어느 파일에 정의되어 있는지 몰라도 함수나 클래스 이름만으로 프로젝트 전역에서 1초 만에 찾아냅니다.","tags":["심볼검색","전역탐색","코드네비게이션","고급"],"keysWin":["Ctrl","T"],"keysMac":["⌘ Cmd","T"],"level":"고급"},{"id":"vsc-067","category":"vscode","title":"함수 추출 리팩토링 (Refactor: Extract Method)","subtitle":"선택한 코드 블록을 새로운 독립 함수로 자동 추출 분리","code":"// 1. 함수로 분리할 코드 블록 드래그 선택\n// 2. Windows: Ctrl + Shift + R (빠른 리팩토링 메뉴)\n// 3. macOS:   Ctrl + Shift + R\n// 4. [Extract Function / Method] 선택 후 함수명 입력","description":"매개변수와 반환값까지 VS Code 언어 서버가 자동으로 계산하여 깔끔하게 새 함수로 분리합니다.","tags":["리팩토링","함수추출","ExtractMethod","고급"],"keysWin":["Ctrl","Shift","R"],"keysMac":["⌃ Ctrl","Shift","R"],"level":"고급"},{"id":"vsc-068","category":"vscode","title":"변수 추출 리팩토링 (Extract Variable / Constant)","subtitle":"복잡한 수식이나 하드코딩된 값을 로컬 변수나 전역 상수로 치환","code":"// 1. 수식 또는 문자열 선택\n// 2. 빠른 수정(Ctrl + . / Cmd + .) 누르기\n// 3. [Extract into local variable] 또는 [Extract constant] 선택","description":"중복 수식을 변수 하나로 묶고 코드 내 모든 일치 표현식을 일괄 치환합니다.","tags":["리팩토링","변수추출","클린코드","고급"],"keysWin":["Ctrl","."],"keysMac":["⌘ Cmd","."],"level":"고급"},{"id":"vsc-069","category":"vscode","title":"내장 터미널 좌우 나란히 분할 (Split Terminal)","subtitle":"개발 서버와 테스트 러너/Git 명령어를 나란히 보며 동시 작업","code":"// Windows: Ctrl + Shift + 5 (터미널 포커스 상태)\n// macOS:   Cmd + \\\n// 분할 터미널 간 포커스 이동:\n// Windows: Alt + ← / →\n// macOS:   Option + ⌘ Cmd + ← / →","description":"탭을 전환할 필요 없이 한 화면에서 로그 스트리밍과 셸 명령어 입력을 동시에 진행합니다.","tags":["터미널","분할","멀티태스킹","고급"],"keysWin":["Ctrl","Shift","5"],"keysMac":["⌘ Cmd","\\"],"level":"고급"},{"id":"vsc-070","category":"vscode","title":"터미널 패널 최대화 및 콘솔 지우기","subtitle":"로그를 넓게 보기 위해 전체 화면 확장 및 스크롤백 버퍼 완전 청소","code":"// 터미널 패널 최대화 토글:\n// 명령 팔레트(F1) -> View: Toggle Maximized Panel\n// 터미널 화면 지우기 (Clear):\n// Windows: Ctrl + K (또는 'clear' 입력)\n// macOS:   Cmd + K","description":"수백 줄의 스택 트레이스나 빌드 로그를 넓은 창으로 편안하게 디버깅합니다.","tags":["터미널","최대화","Clear","고급"],"keysWin":["Ctrl","K"],"keysMac":["⌘ Cmd","K"],"level":"고급"},{"id":"vsc-071","category":"vscode","title":"settings.json 언어별 개별 오버라이드 설정","subtitle":"Python, TypeScript, Markdown별로 들여쓰기 크기와 포맷터 개별 지정","code":"// settings.json 설정 예시\n{\n  \"editor.tabSize\": 2, // 기본은 2칸\n  \"[python]\": {\n    \"editor.tabSize\": 4, // 파이썬은 PEP8 4칸 강제\n    \"editor.defaultFormatter\": \"charliermarsh.ruff\",\n    \"editor.formatOnSave\": true\n  },\n  \"[markdown]\": {\n    \"editor.wordWrap\": \"on\",\n    \"editor.quickSuggestions\": false\n  }\n}","description":"서로 다른 언어 컨벤션을 동일 프로젝트 안에서 충돌 없이 완벽하게 자동 분기 처리합니다.","tags":["settings.json","언어설정","포맷터","전문가"],"keysWin":["Ctrl",",","settings.json"],"keysMac":["⌘ Cmd",",","settings.json"],"level":"전문가"},{"id":"vsc-072","category":"vscode","title":"다중 루트 워크스페이스 (.code-workspace)","subtitle":"독립된 여러 저장소(frontend, backend, infra)를 단일 VS Code 창으로 통합","code":"// [File] -> [Add Folder to Workspace...] 로 폴더 추가\n// [Save Workspace As...] 저장 예시 (.code-workspace):\n{\n  \"folders\": [\n    { \"name\": \"Frontend\", \"path\": \"../my-react-client\" },\n    { \"name\": \"Backend API\", \"path\": \"../my-fastapi-server\" }\n  ],\n  \"settings\": {\n    \"search.exclude\": { \"**/node_modules\": true }\n  }\n}","description":"서로 다른 저장소에 있는 프론트엔드와 백엔드를 창 전환 없이 한 번에 검색하고 디버깅합니다.","tags":["워크스페이스","모노레포","멀티루트","고급"],"keysWin":["File","Add Folder to Workspace"],"keysMac":["File","Add Folder to Workspace"],"level":"고급"},{"id":"vsc-073","category":"vscode","title":"Dev Containers (.devcontainer) 격리 도커 개발 환경","subtitle":"PC에 파이썬/Node를 설치하지 않고 컨테이너 내부에서 VS Code 완벽 실행","code":"// .devcontainer/devcontainer.json 예시\n{\n  \"name\": \"Python 3.11 & Node 20 Dev\",\n  \"image\": \"mcr.microsoft.com/devcontainers/python:3.11\",\n  \"features\": {\n    \"ghcr.io/devcontainers/features/node:1\": {}\n  },\n  \"customizations\": {\n    \"vscode\": {\n      \"extensions\": [\"ms-python.python\", \"charliermarsh.ruff\"]\n    }\n  },\n  \"forwardPorts\": [3000, 8000]\n}\n// 명령 팔레트(F1) -> [Dev Containers: Reopen in Container]","description":"\"내 컴퓨터에서는 되는데?\" 문제를 100% 종식시키는 표준 컨테이너화 개발 환경입니다.","tags":["DevContainers","Docker","격리환경","전문가"],"keysWin":["F1","Reopen in Container"],"keysMac":["F1","Reopen in Container"],"level":"전문가"},{"id":"vsc-074","category":"vscode","title":"Remote - SSH 원격 클라우드 서버 직접 접속 개발","subtitle":"AWS EC2, GPU 서버에 접속하여 로컬 파일 편집하듯 원격 코드 개발","code":"// 명령 팔레트(F1) -> [Remote-SSH: Connect to Host...]\n// host: ubuntu@ec2-12-34-56-78.compute-1.amazonaws.com\n// ~/.ssh/config에 호스트 등록 시 자동 완성 지원","description":"서버의 강력한 CPU/GPU 자원을 사용하면서 UI와 단축키는 내 로컬 에디터 그대로 누립니다.","tags":["Remote","SSH","클라우드","고급"],"keysWin":["F1","Remote-SSH"],"keysMac":["F1","Remote-SSH"],"level":"고급"},{"id":"vsc-075","category":"vscode","title":"WSL (Windows Subsystem for Linux) 에디터 네이티브 연동","subtitle":"윈도우 환경에서 리눅스 Ubuntu 커널 속성 그대로 완벽 개발","code":"// 윈도우 WSL 터미널에서 프로젝트 폴더 진입 후:\ncode .\n// 또는 VS Code 좌측 하단 [><] 원격 버튼 클릭 후 [Connect to WSL]","description":"파일 I/O 속도 저하 없이 순수 리눅스 패키지와 셸 스크립트를 윈도우 VS Code로 다룹니다.","tags":["WSL","리눅스","윈도우","고급"],"keysWin":["code .","Connect to WSL"],"keysMac":["- (Windows 전용)","-"],"level":"고급"},{"id":"vsc-076","category":"vscode","title":"Emmet 약어 문법 초고속 HTML/CSS 전개","subtitle":"ul>li.item*5 입력 후 Tab 키로 복잡한 HTML 트리 0.5초 만에 생성","code":"// 에디터에 다음 입력 후 Tab 또는 Enter:\n// div.container>header+main.content>ul>li.nav-item$*3>a{메뉴$}\n// -> \n// <div class=\"container\">\n//   <header></header>\n//   <main class=\"content\">\n//     <ul>\n//       <li class=\"nav-item1\"><a href=\"\">메뉴1</a></li>\n//       <li class=\"nav-item2\"><a href=\"\">메뉴2</a></li>\n//       <li class=\"nav-item3\"><a href=\"\">메뉴3</a></li>\n//     </ul>\n//   </main>\n// </div>","description":"웹 프론트엔드 마크업 속도를 10배 이상 올려주는 내장 Emmet 엔진 문법입니다.","tags":["Emmet","HTML","생산성","고급"],"keysWin":["Tab","Enter"],"keysMac":["Tab","Enter"],"level":"고급"},{"id":"vsc-077","category":"vscode","title":"Emmet: Wrap with Abbreviation (기존 코드 태그로 감싸기)","subtitle":"이미 작성된 여러 줄의 텍스트/코드를 특정 태그로 한 번에 둘러싸기","code":"// 1. 감싸고 싶은 여러 줄 코드 드래그 선택\n// 2. 명령 팔레트(F1) -> [Emmet: Wrap with Abbreviation] 실행\n// 3. 약어 입력: ul>li* (각 줄마다 <li>로 감싸고 부모로 <ul> 생성)","description":"코드를 일일이 잘라내어 열림/닫힘 태그 사이에 끼워 넣는 수작업을 완전히 없애줍니다.","tags":["Emmet","Wrap","마크업","고급"],"keysWin":["F1","Wrap with Abbreviation"],"keysMac":["F1","Wrap with Abbreviation"],"level":"고급"},{"id":"vsc-078","category":"vscode","title":"모든 코드 블록 단계별 일괄 접기 (Fold Level 1, 2, 3...)","subtitle":"최상위 클래스나 함수 시그니처만 남기고 전체 본문 접기","code":"// 레벨 1만 접기 (최상위 블록 접기):\n// Windows: Ctrl + K 누른 후 Ctrl + 1\n// macOS:   Cmd + K 누른 후 Cmd + 1\n// 모든 블록 전체 접기:\n// Windows: Ctrl + K 누른 후 Ctrl + 0\n// 모든 블록 전체 펼치기:\n// Windows: Ctrl + K 누른 후 Ctrl + J","description":"수천 줄에 달하는 거대한 소스 코드의 전체 윤곽을 한눈에 조망할 때 필수적인 접기 단축키입니다.","tags":["코드접기","Fold","가독성","고급"],"keysWin":["Ctrl + K","Ctrl + 1 / 0 / J"],"keysMac":["⌘ Cmd + K","Cmd + 1 / 0 / J"],"level":"고급"},{"id":"vsc-079","category":"vscode","title":"3-Way 병합 에디터 (3-Way Merge Editor) 충돌 해결","subtitle":"Incoming(상대방), Current(내 것), Result(최종본)를 3분할 비교하며 머지","code":"// Git 머지 충돌 발생 시 하단 [Resolve in Merge Editor] 버튼 클릭\n// 좌측: Incoming / 우측: Current / 하단: Result\n// 체크박스 클릭만으로 원하는 라인 채택 및 수동 조합","description":"<<<<<<< HEAD 같은 지저분한 충돌 마커를 직접 지울 필요 없이 시각적으로 안전하게 충돌을 해결합니다.","tags":["Git","머지충돌","MergeEditor","고급"],"keysWin":["클릭","Resolve in Merge Editor"],"keysMac":["클릭","Resolve in Merge Editor"],"level":"고급"},{"id":"vsc-080","category":"vscode","title":"Diff 뷰어에서 선택 줄만 부분 스테이징 (Stage Selected Ranges)","subtitle":"GUI 화면에서 원하는 코드 줄만 드래그하여 git add에 반영","code":"// 1. 소스 제어 탭에서 수정된 파일 클릭하여 Diff 뷰어 열기\n// 2. 커밋에 포함할 코드 줄들을 마우스로 드래그 선택\n// 3. 우클릭 -> [Stage Selected Ranges] (선택한 줄 스테이징)","description":"git add -p 터미널 대화형 명령어보다 직관적으로 원하는 줄만 골라내어 깔끔한 커밋을 만듭니다.","tags":["Git","Diff","부분스테이징","고급"],"keysWin":["드래그 우클릭","Stage Selected Ranges"],"keysMac":["드래그 우클릭","Stage Selected Ranges"],"level":"고급"},{"id":"vsc-081","category":"vscode","title":"keybindings.json when 절을 이용한 조건부 단축키 정의","subtitle":"터미널이 열려 있을 때나 특정 언어 파일일 때만 동작하는 스마트 키바인딩","code":"// keybindings.json 예시\n[\n  {\n    \"key\": \"ctrl+enter\",\n    \"command\": \"workbench.action.terminal.runSelectedText\",\n    \"when\": \"editorHasSelection\" // 텍스트가 선택되었을 때만 터미널로 코드 전송\n  },\n  {\n    \"key\": \"alt+r\",\n    \"command\": \"python.execInTerminal\",\n    \"when\": \"editorLangId == python\" // 파이썬 파일일 때만 실행\n  }\n]","description":"단축키 충돌 없이 상황별 맥락(Context)에 따라 정교하게 나만의 단축키 동작을 바인딩합니다.","tags":["keybindings.json","when절","키매핑","전문가"],"keysWin":["keybindings.json","when"],"keysMac":["keybindings.json","when"],"level":"전문가"},{"id":"vsc-082","category":"vscode","title":"사용자 정의 코드 스니펫 제작 (Tabstops & Regex)","subtitle":"단어 입력 후 Tab으로 복잡한 보일러플레이트 자동 생성 ($1, $2 커서 점프)","code":"// .vscode/python.code-snippets 예시\n{\n  \"API Router Snippet\": {\n    \"prefix\": \"route\",\n    \"body\": [\n      \"@router.${1|get,post,put,delete|}('${2:/path}')\",\n      \"async def ${3:endpoint_name}(${4:request}):\",\n      \"    \\\"\\\"\\\"${5:Endpoint Description}\\\"\\\"\\\"\",\n      \"    return {${6:\\\"status\\\": \\\"success\\\"}}\"\n    ],\n    \"description\": \"FastAPI 라우트 스니펫\"\n  }\n}","description":"선택지 드롭다운, 탭 점프 위치($1, $2), 정규식 변환을 포함하여 반복 코딩 시간을 90% 줄여줍니다.","tags":["스니펫","snippets","자동완성","전문가"],"keysWin":["prefix","Tab"],"keysMac":["prefix","Tab"],"level":"전문가"},{"id":"vsc-083","category":"vscode","title":"스티키 스크롤 (Sticky Scroll) 함수/클래스 상단 고정","subtitle":"긴 함수를 스크롤 다운할 때 현재 내가 위치한 함수명과 클래스명이 에디터 상단에 고정 표시","code":"// 설정(settings.json)에서 활성화:\n// \"editor.stickyScroll.enabled\": true\n// 토글 명령어: View: Toggle Sticky Scroll","description":"수백 줄의 함수 내부를 읽고 있을 때 \"내가 지금 어느 함수/if 블록 안에 있지?\" 헤매지 않도록 상단에 계층 구조를 고정합니다.","tags":["StickyScroll","가독성","생산성","고급"],"keysWin":["View","Toggle Sticky Scroll"],"keysMac":["View","Toggle Sticky Scroll"],"level":"고급"},{"id":"vsc-084","category":"vscode","title":"인라인 힌트 (Inlay Hints) 매개변수/타입 토글","subtitle":"함수 호출 시 인수명과 변수의 추론된 타입을 코드 사이에 가상으로 표시","code":"// 단축키로 일시 표시:\n// Windows: Ctrl + Alt 누르고 있는 동안 표시\n// macOS:   Ctrl + Option 누르고 있는 동안 표시\n// 영구 활성화 설정:\n// \"editor.inlayHints.enabled\": \"on\"","description":"코드 자체를 건드리지 않고도 calculate(rate: 0.1, timeout: 5) 처럼 어떤 파라미터로 넘기는지 직관적으로 확인합니다.","tags":["InlayHints","타입추론","매개변수힌트","고급"],"keysWin":["Ctrl + Alt (Hold)","Inlay Hints"],"keysMac":["⌃ Ctrl + ⌥ Option (Hold)","Inlay Hints"],"level":"고급"},{"id":"vsc-085","category":"vscode","title":"선택 텍스트 대소문자 변환 (Uppercase / Lowercase / Titlecase)","subtitle":"상수화 대문자, 카멜케이스 소문자 일괄 변환","code":"// 명령 팔레트(F1) ->\n// Transform to Uppercase (전체 대문자: CONSTANT_VAL)\n// Transform to Lowercase (전체 소문자)\n// Transform to Title Case (첫 글자만 대문자)","description":"변수명을 대문자 상수로 변경할 때 다시 타이핑할 필요 없이 단축키로 즉시 변환합니다.","tags":["대소문자변환","Uppercase","편집","고급"],"keysWin":["F1","Transform to Uppercase"],"keysMac":["F1","Transform to Uppercase"],"level":"고급"},{"id":"vsc-086","category":"vscode","title":"선택한 줄 가나다순 오름차순/내림차순 정렬","subtitle":"import 목록이나 JSON 키 목록을 알파벳순으로 자동 정렬","code":"// 1. 정렬할 여러 줄 드래그 선택\n// 2. 명령 팔레트(F1) -> Sort Lines Ascending (오름차순)\n// 3. 또는 Sort Lines Descending (내림차순)","description":"수십 줄의 import 문이나 리스트 항목들을 눈으로 찾기 쉽게 알파벳순으로 단번에 정돈합니다.","tags":["정렬","SortLines","가독성","고급"],"keysWin":["F1","Sort Lines Ascending"],"keysMac":["F1","Sort Lines Ascending"],"level":"고급"},{"id":"vsc-087","category":"vscode","title":"중복 줄 일괄 삭제 (Delete Duplicate Lines)","subtitle":"텍스트 목록에서 중복된 라인들을 깨끗이 정리","code":"// 1. 정리할 텍스트 영역 선택\n// 2. 명령 팔레트(F1) -> Delete Duplicate Lines 실행","description":"CSV 데이터나 로그 파일, ID 목록에서 중복 라인을 파이썬 스크립트 작성 없이 에디터 내에서 즉시 고유화합니다.","tags":["중복제거","라인정리","편집","고급"],"keysWin":["F1","Delete Duplicate Lines"],"keysMac":["F1","Delete Duplicate Lines"],"level":"고급"},{"id":"vsc-088","category":"vscode","title":"VS Code 내장 대화형 Git rebase GUI 에디터","subtitle":"vim 터미널 대신 마우스 드래그 앤 드롭으로 커밋 순서 변경 및 Squash","code":"// 터미널에서 git rebase -i 실행 시 VS Code 탭으로 자동 열림\n// 커밋 행을 마우스로 잡고 위아래 드래그하여 순서 재배치\n// [pick / squash / reword / drop] 버튼을 클릭으로 선택","description":"Vim의 복잡한 명령어 없이도 시각적으로 커밋을 합치거나 삭제할 수 있는 강력한 내장 기능입니다.","tags":["Git","rebase","GUI","고급"],"keysWin":["git rebase -i","마우스 드래그"],"keysMac":["git rebase -i","마우스 드래그"],"level":"고급"},{"id":"vsc-089","category":"vscode","title":"보조 사이드바 (Secondary Side Bar) 우측 패널 토글","subtitle":"우측에 문서 아웃라인, GitLens, 디버거를 배치하여 좌우 균형 작업","code":"// Windows: Ctrl + Alt + B\n// macOS:   Cmd + Option + B","description":"좌측에는 파일 탐색기를 띄우고, 우측에는 함수 아웃라인이나 AI 어시스턴트 패널을 나란히 배치합니다.","tags":["사이드바","SecondarySideBar","레이아웃","고급"],"keysWin":["Ctrl","Alt","B"],"keysMac":["⌘ Cmd","⌥ Option","B"],"level":"고급"},{"id":"vsc-090","category":"vscode","title":"Python 인터프리터 및 가상환경(.venv) 즉시 전환","subtitle":"프로젝트에 맞는 특정 가상환경 파이썬 실행 바이너리 지정","code":"// Windows: Ctrl + Shift + P -> [Python: Select Interpreter]\n// macOS:   Cmd + Shift + P -> [Python: Select Interpreter]\n// 추천 목록에서 ('.venv': venv) 선택","description":"패키지를 설치했는데도 unresolved import 경고가 뜰 때 올바른 가상환경 경로를 연결하여 해결합니다.","tags":["Python","인터프리터","venv","가상환경","전문가"],"keysWin":["Ctrl + Shift + P","Select Interpreter"],"keysMac":["⌘ Cmd + Shift + P","Select Interpreter"],"level":"전문가"},{"id":"vsc-091","category":"vscode","title":"Python 테스트 탐색기 UI 통합 실행 및 디버깅","subtitle":"Pytest 케이스들을 GUI 트리에서 원터치 실행 및 실패 테스트 디버깅","code":"// 1. 좌측 [테스팅(비커 모양)] 아이콘 클릭\n// 2. [Configure Python Tests] -> [pytest] 선택\n// 3. 코드 옆 초록색 재생 버튼(▶)으로 개별 테스트 즉시 실행","description":"터미널로 매번 명령어를 칠 필요 없이 실패한 테스트 함수에 중단점을 걸고 바로 디버깅을 시작할 수 있습니다.","tags":["테스트탐색기","pytest","디버깅","전문가"],"keysWin":["Ctrl + ;","T (테스트 실행)"],"keysMac":["Cmd + ;","T"],"level":"전문가"},{"id":"vsc-092","category":"vscode","title":"마크다운 나란히 분할 실시간 미리보기 (Open Preview to the Side)","subtitle":"좌측에는 마크다운 작성, 우측에는 렌더링된 결과를 동기화 스크롤하며 확인","code":"// Windows: Ctrl + K 누른 후 V\n// macOS:   Cmd + K 누른 후 V","description":"README.md 작성 시 코드 블록과 테이블이 올바르게 렌더링되는지 실시간 동기화로 확인합니다.","tags":["마크다운","미리보기","문서작성","고급"],"keysWin":["Ctrl + K","V"],"keysMac":["⌘ Cmd + K","V"],"level":"고급"},{"id":"vsc-093","category":"vscode","title":"파일 내 Git 변경점(Hunk) 간 빠른 순회 이동","subtitle":"에디터 좌측 색상 바(초록/파랑/빨강) 수정 위치로 1초 만에 점프","code":"// 다음 변경점(Next Change)으로 점프:\n// Windows: Alt + F3\n// macOS:   Option + F3\n// 이전 변경점으로 점프:\n// Windows: Shift + Alt + F3\n// macOS:   Shift + Option + F3","description":"내가 오늘 이 파일에서 어디어디를 수정했는지 스크롤할 필요 없이 수정 지점만 쏙쏙 건너뛰며 점검합니다.","tags":["Git","변경점이동","NextChange","고급"],"keysWin":["Alt","F3"],"keysMac":["⌥ Option","F3"],"level":"고급"},{"id":"vsc-094","category":"vscode","title":"Vim 모드 (VSCodeVim) 핵심 모달 단축키","subtitle":"키보드에서 손을 떼지 않는 노멀/인서트/비주얼 모드 탐색","code":"// 노멀 모드 이동: h(좌), j(하), k(상), l(우)\n// 단어 단위 이동: w(앞으로), b(뒤로)\n// 단어 삭제: dw (단어 삭제), dd (한 줄 삭제)\n// 괄호 안 내용만 변경: ci( (Change Inside Parenthesis)\n// 따옴표 안 내용만 변경: ci\" (Change Inside Quotes)","description":"Vim 확장을 활성화하여 마우스에 손을 전혀 대지 않고 번개 같은 속도로 텍스트를 편집합니다.","tags":["Vim","단축키","키보드생산성","전문가"],"keysWin":["ci\"","dd","yy","p"],"keysMac":["ci\"","dd","yy","p"],"level":"전문가"},{"id":"vsc-095","category":"vscode","title":"현재 파일과 클립보드(복사본) 직접 Diff 비교","subtitle":"외부에서 복사해온 코드와 현재 파일의 차이점을 에디터 분할 비교","code":"// 명령 팔레트(F1) -> [File: Compare Active File with Clipboard]","description":"임시 파일을 만들 필요 없이 웹사이트나 메신저에서 복사한 코드 조각과 로컬 파일의 차이점을 즉시 대조합니다.","tags":["Diff","클립보드비교","코드검토","고급"],"keysWin":["F1","Compare with Clipboard"],"keysMac":["F1","Compare with Clipboard"],"level":"고급"},{"id":"vsc-096","category":"vscode","title":"수정 중인 파일 제외하고 저장된 탭 일괄 닫기 (Close Saved)","subtitle":"수십 개 열려 있는 지저분한 탭들 중 저장 완료된 탭만 한 번에 정리","code":"// Windows: Ctrl + K 누른 후 U\n// macOS:   Cmd + K 누른 후 U\n// 다른 모든 에디터 닫기:\n// Windows: Ctrl + K 누른 후 W\n// macOS:   Cmd + K 누른 후 W","description":"아직 저장하지 않은 미완성 코드는 안전하게 열어둔 채 필요 없는 탭들만 0.1초 만에 깔끔히 청소합니다.","tags":["탭닫기","CloseSaved","에디터정리","고급"],"keysWin":["Ctrl + K","U"],"keysMac":["⌘ Cmd + K","U"],"level":"고급"},{"id":"vsc-097","category":"vscode","title":"커서 위치 기록 되돌리기/다시 실행 (Cursor Undo / Redo)","subtitle":"코드 수정 취소가 아닌 마우스/키보드 커서가 거쳐간 과거 위치로 역이동","code":"// 커서 이전 위치로 되돌리기:\n// Windows: Ctrl + U\n// macOS:   Cmd + U","description":"스크롤을 잘못 내려서 방금 작업하던 위치를 놓쳤을 때 Ctrl+U 한 번으로 정확한 이전 커서 자리로 복귀합니다.","tags":["CursorUndo","커서이동","네비게이션","고급"],"keysWin":["Ctrl","U"],"keysMac":["⌘ Cmd","U"],"level":"고급"},{"id":"vsc-098","category":"vscode","title":"로컬 히스토리 타임라인 (Timeline) 커밋 전 코드 복구","subtitle":"Git 커밋을 깜빡하고 덮어쓰거나 삭제한 과거 저장 시점 파일 복원","code":"// 파일 탐색기 하단 [TIMELINE(타임라인)] 패널 확장\n// 파일이 저장될 때마다 자동 생성된 스냅샷들을 클릭하여 과거 시점으로 복구","description":"Git에 아직 커밋하지 않은 상태에서 실수로 코드를 날려버렸을 때 VS Code가 자동 저장해 둔 로컬 스냅샷으로 살려냅니다.","tags":["Timeline","로컬복구","스냅샷","안전장치","고급"],"keysWin":["Timeline 패널","클릭 복구"],"keysMac":["Timeline 패널","클릭 복구"],"level":"고급"},{"id":"vsc-099","category":"vscode","title":"터미널 프로필 커스텀 및 환경 변수 자동 주입","subtitle":"새 터미널 열 때마다 특정 가상환경 활성화 및 셸 스크립트 자동 실행","code":"// settings.json 터미널 프로필 설정 예시\n{\n  \"terminal.integrated.profiles.linux\": {\n    \"my-bash\": {\n      \"path\": \"/bin/bash\",\n      \"args\": [\"--init-file\", \"./dev_env.sh\"]\n    }\n  },\n  \"terminal.integrated.defaultProfile.linux\": \"my-bash\"\n}","description":"매번 터미널을 열 때마다 source .venv/bin/activate를 칠 필요 없이 자동 활성화되도록 구성합니다.","tags":["터미널설정","프로필","자동화","전문가"],"keysWin":["settings.json","terminal.profiles"],"keysMac":["settings.json","terminal.profiles"],"level":"전문가"},{"id":"vsc-100","category":"vscode","title":"파일 절대 경로 및 상대 경로 복사 (Copy Path / Relative Path)","subtitle":"import 문이나 터미널 실행에 필요한 정확한 파일 경로 원터치 복사","code":"// 절대 경로 복사 (Full Path):\n// Windows: Shift + Alt + C\n// macOS:   Shift + Option + C\n// 프로젝트 기준 상대 경로 복사 (Relative Path):\n// Windows: Ctrl + K 누른 후 Ctrl + Shift + C\n// macOS:   Cmd + K 누른 후 Cmd + Shift + C","description":"오타 없이 완벽한 import 상대 경로나 테스트 실행 파일 경로를 클립보드로 복사합니다.","tags":["경로복사","CopyPath","상대경로","고급"],"keysWin":["Shift","Alt","C"],"keysMac":["Shift","⌥ Option","C"],"level":"고급"},{"id":"vsc-101","category":"vscode","title":"열(Column) 선택 모드 토글 (Toggle Column Selection Mode)","subtitle":"Shift + 방향키만으로 직사각형 영역을 블록 지정하여 일괄 수정","code":"// 열 선택 모드 켜기/끄기:\n// Windows: Shift + Alt + I (선택 줄 끝에 커서 생성)\n// 또는 명령 팔레트 -> Toggle Column Selection Mode","description":"수십 줄의 데이터 앞에 따옴표를 일괄 삽입하거나 표 형식 데이터를 한꺼번에 편집합니다.","tags":["열선택","다중커서","블록편집","고급"],"keysWin":["Shift","Alt","I"],"keysMac":["Shift","⌥ Option","I"],"level":"고급"},{"id":"vsc-102","category":"vscode","title":"줄 중간에서 줄바꿈 없이 바로 아래/위에 새 줄 삽입","subtitle":"커서를 줄 끝이나 앞으로 이동시키지 않고 즉시 다음 줄 열기","code":"// 현재 줄 바로 아래에 새 줄 삽입:\n// Windows: Ctrl + Enter\n// macOS:   Cmd + Enter\n// 현재 줄 바로 위에 새 줄 삽입:\n// Windows: Ctrl + Shift + Enter\n// macOS:   Cmd + Shift + Enter","description":"문장 중간에서 엔터를 쳐서 코드가 쪼개지는 실수 없이 깔끔하게 새 라인을 생성합니다.","tags":["새줄삽입","Ctrl+Enter","기본편집","고급"],"keysWin":["Ctrl","Enter"],"keysMac":["⌘ Cmd","Enter"],"level":"고급"},{"id":"vsc-103","category":"vscode","title":"심볼 이름 전역 안전 변경 (Rename Symbol - F2)","subtitle":"단순 텍스트 검색/바꾸기와 달리 언어 AST를 분석하여 스코프 내 변수만 정확히 수정","code":"// 1. 이름을 바꿀 변수/함수 위에 커서 위치\n// 2. F2 누르기\n// 3. 새 이름 입력 후 Enter (프로젝트 전체 참조처 일괄 변경)","description":"문자열이나 주석 속 동음이의어는 건드리지 않고 진짜 해당 변수의 참조처만 안전하게 일괄 변경합니다.","tags":["리네임","F2","심볼변경","리팩토링","고급"],"keysWin":["F2"],"keysMac":["F2"],"level":"고급"},{"id":"vsc-104","category":"vscode","title":"import 문 자동 정리 (Organize Imports - Shift + Alt + O)","subtitle":"사용하지 않는 import 제거 및 알파벳 순 정렬 한 번에 완료","code":"// Windows: Shift + Alt + O\n// macOS:   Shift + Option + O\n// 저장 시 자동 실행 설정:\n// \"editor.codeActionsOnSave\": { \"source.organizeImports\": \"always\" }","description":"파일 상단에 어지럽게 쌓인 불필요한 import들을 1초 만에 깔끔히 청소합니다.","tags":["OrganizeImports","임포트정리","클린코드","고급"],"keysWin":["Shift","Alt","O"],"keysMac":["Shift","⌥ Option","O"],"level":"고급"},{"id":"vsc-105","category":"vscode","title":"브레드크럼 (Breadcrumbs) 키보드 탐색 포커스","subtitle":"상단 폴더/파일/함수 계층 경로를 키보드로 즉시 탐색","code":"// Windows: Ctrl + Shift + .\n// macOS:   Cmd + Shift + .\n// 방향키로 상위 폴더나 형제 함수로 즉시 이동","description":"마우스 없이 상단 경로 바를 열어 같은 파일 내 다른 함수나 같은 폴더의 다른 파일로 점프합니다.","tags":["브레드크럼","Breadcrumbs","네비게이션","고급"],"keysWin":["Ctrl","Shift","."],"keysMac":["⌘ Cmd","Shift","."],"level":"고급"},{"id":"vsc-106","category":"vscode","title":"창 다시 로드 (Developer: Reload Window)","subtitle":"에디터를 완전히 종료하지 않고 확장 프로그램 및 랭귀지 서버 즉시 재시작","code":"// 명령 팔레트(F1) -> [Developer: Reload Window]\n// 또는 단축키 바인딩 권장 (Ctrl + Alt + R)","description":"TypeScript나 Python 언어 서버가 멈추거나 타입 오류가 새로고침되지 않을 때 1초 만에 초기화합니다.","tags":["ReloadWindow","새로고침","디버깅","고급"],"keysWin":["F1","Reload Window"],"keysMac":["F1","Reload Window"],"level":"고급"},{"id":"vsc-107","category":"vscode","title":"대응하는 괄호 쌍으로 즉시 점프 (Go to Bracket)","subtitle":"수백 줄 길이의 중괄호 {}, 소괄호 () 시작점과 끝점으로 워프","code":"// Windows: Ctrl + Shift + \\\n// macOS:   Cmd + Shift + \\","description":"중첩된 if 문이나 거대한 함수 닫는 괄호 위치를 찾을 때 즉각적으로 시작/끝 위치를 왕복합니다.","tags":["괄호점프","Bracket","네비게이션","고급"],"keysWin":["Ctrl","Shift","\\"],"keysMac":["⌘ Cmd","Shift","\\"],"level":"고급"},{"id":"vsc-108","category":"vscode","title":"스마트 선택 영역 확장/축소 (Smart Expand / Shrink Selection)","subtitle":"단어 -> 문자열 내부 -> 괄호 내부 -> 블록 전체로 선택 범위 단계적 확대","code":"// 선택 확장 (Expand):\n// Windows: Shift + Alt + →\n// macOS:   Ctrl + Shift + ⌘ Cmd + →\n// 선택 축소 (Shrink):\n// Windows: Shift + Alt + ←\n// macOS:   Ctrl + Shift + ⌘ Cmd + ←","description":"마우스로 힘들게 따옴표 안이나 괄호 블록을 드래그할 필요 없이 키보드 몇 번으로 문법 단위 선택을 확장합니다.","tags":["선택확장","ExpandSelection","스마트블록","고급"],"keysWin":["Shift","Alt","→ / ←"],"keysMac":["⌃ Ctrl + Shift + ⌘ Cmd","→ / ←"],"level":"고급"},{"id":"vsc-109","category":"vscode","title":"파일 내 심볼/함수 목록 검색 (Go to Symbol in File)","subtitle":"현재 파일의 모든 함수와 클래스 목차를 띄우고 즉시 이동","code":"// Windows: Ctrl + Shift + O (또는 Ctrl + P 누른 후 @)\n// macOS:   Cmd + Shift + O (또는 Cmd + P 누른 후 @)\n// 카테고리별 그룹화 정렬:\n// 검색창에 @: 입력","description":"파일 내에 어떤 메서드들이 정의되어 있는지 목차로 확인하고 원하는 함수로 직행합니다.","tags":["심볼목록","GoToSymbol","목차탐색","고급"],"keysWin":["Ctrl","Shift","O"],"keysMac":["⌘ Cmd","Shift","O"],"level":"고급"},{"id":"vsc-110","category":"vscode","title":"특정 줄 번호로 즉시 점프 (Go to Line)","subtitle":"에러 로그에 적힌 142번째 줄로 단번에 이동","code":"// Windows: Ctrl + G (또는 Ctrl + P 누른 후 :줄번호)\n// macOS:   Ctrl + G (또는 Cmd + P 누른 후 :줄번호)","description":"컴파일 에러나 런타임 스택 트레이스에 급"],"keysWin":["Ctrl + K","Shift + Enter"],"keysMac":["⌘ Cmd + K","Shift + Enter"],"level":"고급"},{"id":"vsc-125","category":"vscode","title":"하단 패널(터미널/디버그 콘솔/출력) 토글","subtitle":"에디터 하단 영역 열기 및 닫기","code":"// Windows: Ctrl + J\n// macOS:   Cmd + J\n// 디버그 콘솔로 직접 이동:\n// Windows: Ctrl + Shift + Y\n// macOS:   Cmd + Shift + Y","description":"코드를 넓게 볼 때는 하단 패널을 닫고, 테스트 결과나 출력을 확인할 때 신속하게 엽니다.","tags":["패널토글","Ctrl+J","디버그콘솔","기초"],"keysWin":["Ctrl","J"],"keysMac":["⌘ Cmd","J"],"level":"기초"}];

    // State
    let currentCategory = 'all';
    let searchQuery = '';
    let selectedTag = null;
    let selectedLevel = 'all';
    let sortOption = 'default';
    let osPreference = 'both';
    let favorites = JSON.parse(localStorage.getItem('devcheat_favs') || '[]');

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');
    const catBtns = document.querySelectorAll('.cat-btn');
    const cardsGrid = document.getElementById('cardsGrid');
    const tagsContainer = document.getElementById('tagsContainer');
    const levelFilter = document.getElementById('levelFilter');
    const sortFilter = document.getElementById('sortFilter');
    const osBtns = document.querySelectorAll('.os-btn');
    const statsCount = document.getElementById('statsCount');
    const toast = document.getElementById('toast');
    const topBtn = document.getElementById('topBtn');

    // Category count badges
    function updateBadges() {
      document.getElementById('badgeAll').textContent = CHEAT_ITEMS.length;
      document.getElementById('badgePy').textContent = CHEAT_ITEMS.filter(i => i.category === 'python').length;
      document.getElementById('badgeGit').textContent = CHEAT_ITEMS.filter(i => i.category === 'git').length;
      document.getElementById('badgeVsc').textContent = CHEAT_ITEMS.filter(i => i.category === 'vscode').length;
      document.getElementById('badgeFav').textContent = favorites.length;
    }

    // Render Quick Tags
    function renderTags() {
      // Tags based on current category
      const targetItems = currentCategory === 'all' 
        ? CHEAT_ITEMS 
        : currentCategory === 'favorites' 
          ? CHEAT_ITEMS.filter(i => favorites.includes(i.id))
          : CHEAT_ITEMS.filter(i => i.category === currentCategory);

      const tagCount = {};
      targetItems.forEach(item => {
        item.tags.forEach(t => {
          tagCount[t] = (tagCount[t] || 0) + 1;
        });
      });

      const sortedTags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]).slice(0, 16);

      let html = '<button class="tag-chip ' + (!selectedTag ? 'active' : '') + '" data-tag="">전체 태그</button>';
      sortedTags.forEach(tag => {
        const isActive = selectedTag === tag ? 'active' : '';
        html += '<button class="tag-chip ' + isActive + '" data-tag="' + tag + '">#' + tag + ' (' + tagCount[tag] + ')</button>';
      });
      tagsContainer.innerHTML = html;

      // Event listeners for tags
      tagsContainer.querySelectorAll('.tag-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.getAttribute('data-tag');
          selectedTag = tag === '' ? null : tag;
          renderTags();
          renderCards();
        });
      });
    }

    // Toast helper
    function showToast(msg) {
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Copy to clipboard helper
    async function copyToClipboard(text, buttonEl) {
      let success = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          success = true;
        }
      } catch (err) {
        // Fallback to execCommand
      }

      if (!success) {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.setAttribute('readonly', '');
          textArea.style.position = 'fixed';
          textArea.style.left = '-9999px';
          textArea.style.top = '0';
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          success = true;
        } catch (e) {
          console.error(e);
        }
      }

      if (success) {
        const originalText = buttonEl.innerHTML;
        buttonEl.innerHTML = '복사 완료! 👍';
        buttonEl.classList.add('copied');
        showToast('클립보드에 복사되었습니다! 👍');

        setTimeout(() => {
          buttonEl.innerHTML = originalText;
          buttonEl.classList.remove('copied');
        }, 1800);
      } else {
        showToast('복사 실패');
      }
    }

    // Render Cards
    function renderCards() {
      const q = searchQuery.toLowerCase().trim();

      let filtered = CHEAT_ITEMS.filter(item => {
        // Category
        if (currentCategory === 'favorites') {
          if (!favorites.includes(item.id)) return false;
        } else if (currentCategory !== 'all') {
          if (item.category !== currentCategory) return false;
        }

        // Tag
        if (selectedTag && !item.tags.includes(selectedTag)) {
          return false;
        }

        // Level
        if (selectedLevel !== 'all' && item.level !== selectedLevel) {
          return false;
        }

        // Search Query
        if (q) {
          const matchTitle = item.title.toLowerCase().includes(q);
          const matchSub = item.subtitle.toLowerCase().includes(q);
          const matchCode = item.code.toLowerCase().includes(q);
          const matchDesc = item.description.toLowerCase().includes(q);
          const matchTags = item.tags.some(t => t.toLowerCase().includes(q));
          const matchWin = item.keysWin?.some(k => k.toLowerCase().includes(q));
          const matchMac = item.keysMac?.some(k => k.toLowerCase().includes(q));
          if (!matchTitle && !matchSub && !matchCode && !matchDesc && !matchTags && !matchWin && !matchMac) {
            return false;
          }
        }

        return true;
      });

      // Sort
      if (sortOption === 'title') {
        filtered.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
      } else if (sortOption === 'level') {
        const order = { '기초': 1, '실무필수': 2, '중급': 3, '고급': 4, '전문가': 5 };
        filtered.sort((a, b) => (order[a.level || '기초'] || 99) - (order[b.level || '기초'] || 99));
      }

      statsCount.textContent = '총 ' + CHEAT_ITEMS.length + '개 중 ' + filtered.length + '개 표시';

      if (filtered.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <h3>검색 결과가 없습니다</h3>
            <p style="margin-bottom: 16px;">다른 검색어나 카테고리 필터를 선택해 보세요.</p>
            <button class="cat-btn" onclick="resetFilters()">모든 필터 초기화</button>
          </div>
        `;
        return;
      }

      cardsGrid.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.id);
        const catName = item.category === 'python' ? 'Python' : item.category === 'git' ? 'Git' : 'VS Code';

        // Shortcut view for VS Code
        let shortcutHtml = '';
        if (item.category === 'vscode') {
          shortcutHtml = '<div style="display:flex; flex-direction:column; gap:6px;">';
          if (osPreference === 'win' || osPreference === 'both') {
            shortcutHtml += `
              <div class="keys-row">
                <span class="os-label">Win:</span>
                ${item.keysWin?.map(k => '<kbd>' + k + '</kbd>').join(' + ')}
              </div>
            `;
          }
          if (osPreference === 'mac' || osPreference === 'both') {
            shortcutHtml += `
              <div class="keys-row">
                <span class="os-label">Mac:</span>
                ${item.keysMac?.map(k => '<kbd>' + k + '</kbd>').join(' + ')}
              </div>
            `;
          }
          shortcutHtml += '</div>';
        }

        return `
          <div class="cheat-card" data-id="${item.id}">
            <div class="card-top">
              <div class="card-badge-row">
                <span class="cat-tag ${item.category}">${catName}</span>
                <span class="level-tag level-${item.level || '기초'}">${item.level || '기초'}</span>
              </div>
              <button class="fav-btn ${isFav ? 'active' : ''}" data-fav-id="${item.id}" title="${isFav ? '즐겨찾기 해제' : '즐겨찾기 등록'}">
                ${isFav ? '★' : '☆'}
              </button>
            </div>

            <div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-subtitle">${item.subtitle}</p>
            </div>

            ${shortcutHtml}

            <div class="code-container">
              <div class="code-header">
                <div class="code-lang-dot">
                  <span class="dot ${item.category}"></span>
                  <span>${item.category === 'python' ? 'python' : item.category === 'git' ? 'bash' : 'shortcut'}</span>
                </div>
                <button class="copy-btn" data-code="${encodeURIComponent(item.code)}">
                  📋 코드 복사
                </button>
              </div>
              <pre><code>${escapeHtml(item.code)}</code></pre>
            </div>

            <p class="card-desc">${item.description}</p>

            ${item.outputExample ? `
              <div class="output-box">
                <strong style="color: #38bdf8;">결과 예시:</strong> ${escapeHtml(item.outputExample)}
              </div>
            ` : ''}

            <div class="card-tags">
              ${item.tags.map(t => '<span class="card-tag">#' + t + '</span>').join('')}
            </div>
          </div>
        `;
      }).join('');

      // Wire up copy buttons
      cardsGrid.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const rawCode = decodeURIComponent(btn.getAttribute('data-code'));
          copyToClipboard(rawCode, btn);
        });
      });

      // Wire up favorite stars
      cardsGrid.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = btn.getAttribute('data-fav-id');
          toggleFavorite(id);
        });
      });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(fId => fId !== id);
        showToast('즐겨찾기에서 제외되었습니다.');
      } else {
        favorites.push(id);
        showToast('⭐ 즐겨찾기에 추가되었습니다!');
      }
      localStorage.setItem('devcheat_favs', JSON.stringify(favorites));
      updateBadges();
      renderCards();
    }

    function resetFilters() {
      currentCategory = 'all';
      searchQuery = '';
      selectedTag = null;
      selectedLevel = 'all';
      sortOption = 'default';
      searchInput.value = '';
      searchClearBtn.style.display = 'none';
      levelFilter.value = 'all';
      sortFilter.value = 'default';
      catBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-cat') === 'all'));
      renderTags();
      renderCards();
    }

    // Category click handler
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-cat');
        selectedTag = null;
        renderTags();
        renderCards();
      });
    });

    // Search input handler
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      searchClearBtn.style.display = searchQuery ? 'flex' : 'none';
      renderCards();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClearBtn.style.display = 'none';
      searchInput.focus();
      renderCards();
    });

    // OS preference toggle
    osBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        osBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        osPreference = btn.getAttribute('data-os');
        renderCards();
      });
    });

    // Level & sort select
    levelFilter.addEventListener('change', (e) => {
      selectedLevel = e.target.value;
      renderCards();
    });

    sortFilter.addEventListener('change', (e) => {
      sortOption = e.target.value;
      renderCards();
    });

    // Scroll to top
    topBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Keyboard shortcut '/' to search
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Init
    updateBadges();
    renderTags();
    renderCards();
  </script>
</body>
</html>

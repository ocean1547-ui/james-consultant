)과 달리 장기 실행 프로세스와 실시간 통신하거나 표준 입출력 스트림을 직접 연결하여 파이프라인을 구축합니다.","tags":["subprocess","Popen","파이프라인","프로세스"],"outputExample":"ERROR: DB 연결 실패!","level":"고급"},{"id":"py-105","category":"python","title":"signal 모듈 POSIX 시그널 핸들링 (Graceful Shutdown)","subtitle":"Ctrl+C(SIGINT)나 종료(SIGTERM) 수신 시 진행 중 작업 안전 저장","code":"import signal\nimport sys\nimport time\n\nis_running = True\n\ndef handle_shutdown(signum, frame):\n    global is_running\n    print(f\"\\n[시그널 {signum}] 종료 요청 감지! 데이터 저장 후 종료합니다...\")\n    is_running = False\n\n# 시그널 핸들러 등록\nsignal.signal(signal.SIGINT, handle_shutdown)\nsignal.signal(signal.SIGTERM, handle_shutdown)\n\nprint(\"서버 가동 중... (Ctrl+C를 눌러 안전 종료 테스트)\")\n# while is_running: time.sleep(0.5)","description":"도커 컨테이너나 쿠버네티스 환경에서 파드가 강제 종료되기 전 DB 연결을 해제하고 캐시를 flush하는 필수 운영 기법입니다.","tags":["signal","SIGINT","GracefulShutdown","전문가"],"outputExample":"[시그널 2] 종료 요청 감지! 데이터 저장 후 종료합니다...","level":"전문가"},{"id":"py-106","category":"python","title":"socket 모듈 저수준 TCP 통신","subtitle":"네이티브 소켓을 이용한 Echo 서버와 클라이언트 연결","code":"import socket\n\n# TCP 소켓 생성 (IPv4, SOCK_STREAM)\nwith socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:\n    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)\n    s.bind(('127.0.0.1', 9999))\n    s.listen(1)\n    print(\"TCP 9999 포트 수신 대기 중...\")\n    # conn, addr = s.accept()\n    # data = conn.recv(1024)","description":"HTTP 라이브러리의 밑바탕이 되는 운영체제 소켓 API로 원시 바이트 패킷을 주고받습니다.","tags":["socket","TCP","네트워크","저수준"],"outputExample":"TCP 9999 포트 수신 대기 중...","level":"고급"},{"id":"py-107","category":"python","title":"socket 모듈 UDP 비연결성 브로드캐스트/패킷 전송","subtitle":"핸드셰이크 없는 초고속 실시간 데이터그램 송수신","code":"import socket\n\n# UDP 소켓 생성 (SOCK_DGRAM)\nsock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\nmessage = b\"PING 12345\"\n\n# 연결 없이 목적지 IP:PORT로 즉시 패킷 발송\nsock.sendto(message, ('127.0.0.1', 8888))\nsock.close()","description":"게임 패킷, DNS 조회, 음성 스트리밍 등 오버헤드가 적고 빠른 전송이 필요한 환경에서 사용합니다.","tags":["socket","UDP","네트워크","데이터그램"],"outputExample":"UDP 패킷 전송 완료","level":"고급"},{"id":"py-108","category":"python","title":"sqlite3 WAL 모드 설정 및 커스텀 집계 함수 등록","subtitle":"동시성 쓰기 성능 대폭 향상 및 파이썬 파이썬 함수를 SQL로 등록","code":"import sqlite3\n\nconn = sqlite3.connect(':memory:')\n# WAL(Write-Ahead Logging) 모드 활성화로 동시 읽기/쓰기 성능 극대화\nconn.execute('PRAGMA journal_mode=WAL;')\n\n# 커스텀 파이썬 함수를 SQLite SQL 함수로 등록\nconn.create_function(\"py_reverse\", 1, lambda s: s[::-1] if s else None)\n\ncursor = conn.cursor()\ncursor.execute(\"SELECT py_reverse('DevCheat')\")\nprint(\"SQL 실행 결과:\", cursor.fetchone()[0])  # taehCveD","description":"내장 SQLite의 병목을 해결하고 복잡한 파이썬 로직을 SQL 쿼리문 안에서 직접 호출할 수 있습니다.","tags":["sqlite3","WAL","SQL","데이터베이스"],"outputExample":"SQL 실행 결과: taehCveD","level":"고급"},{"id":"py-109","category":"python","title":"dataclass frozen=True, slots=True, kw_only=True","subtitle":"불변 객체화, 메모리 절약, 키워드 인자 강제를 한 줄로 적용","code":"from dataclasses import dataclass\n\n@dataclass(frozen=True, slots=True, kw_only=True)\nclass AppConfig:\n    host: str\n    port: int = 8080\n\nconfig = AppConfig(host=\"127.0.0.1\", port=3000)\n# config.port = 9000  # FrozenInstanceError 발생 (불변성 보장)\n# slots=True로 딕셔너리 오버헤드가 제거되어 수백만 개 생성 시 메모리 50% 절감","description":"Python 3.10+ dataclass의 최신 플래그들로 완벽한 불변성(Immutable DTO)과 고성능 메모리 최적화를 달성합니다.","tags":["dataclass","slots","frozen","불변객체"],"outputExample":"FrozenInstanceError","level":"고급"},{"id":"py-110","category":"python","title":"__new__ 메서드를 통한 싱글톤(Singleton) 디자인 패턴","subtitle":"객체 할당 단계를 제어하여 오직 하나의 인스턴스만 유지","code":"class AppManager:\n    _instance = None\n\n    def __new__(cls, *args, **kwargs):\n        if cls._instance is None:\n            # 새로운 인스턴스를 메모리에 실제 생성\n            cls._instance = super().__new__(cls)\n            cls._instance._initialized = False\n        return cls._instance\n\n    def __init__(self, app_id=\"default\"):\n        if not self._initialized:\n            self.app_id = app_id\n            self._initialized = True\n\nm1 = AppManager(\"app-1\")\nm2 = AppManager(\"app-2\")\nprint(m1 is m2)  # True, m2.app_id도 \"app-1\" 유지","description":"__init__이 호출되기 전 인스턴스 메모리 할당을 담당하는 __new__를 오버라이드하여 전역 상태 인스턴스를 엄격히 제어합니다.","tags":["__new__","싱글톤","디자인패턴","전문가"],"outputExample":"True","level":"전문가"},{"id":"py-111","category":"python","title":"팩토리 메서드(Factory Pattern) 클래스 인스턴스 동적 생성","subtitle":"조건이나 설정값에 따라 적합한 서브클래스 객체 생성 분기","code":"class NotificationSender:\n    def send(self, msg: str): raise NotImplementedError\n\nclass EmailSender(NotificationSender):\n    def send(self, msg: str): return f\"이메일 발송: {msg}\"\n\nclass SlackSender(NotificationSender):\n    def send(self, msg: str): return f\"슬랙 알림: {msg}\"\n\nclass NotificationFactory:\n    _registry = {\"email\": EmailSender, \"slack\": SlackSender}\n\n    @classmethod\n    def get_sender(cls, channel_type: str) -> NotificationSender:\n        sender_cls = cls._registry.get(channel_type)\n        if not sender_cls: raise ValueError(f\"지원하지 않는 채널: {channel_type}\")\n        return sender_cls()","description":"객체 생성 책임을 팩토리로 위임하여 결합도를 낮추고 신규 알림 수단 확장이 용이해집니다.","tags":["팩토리","디자인패턴","OOP","객체생성"],"outputExample":"슬랙 알림: 배포 완료","level":"고급"},{"id":"py-112","category":"python","title":"옵저버(Observer) 이벤트 발행-구독(Pub/Sub) 패턴","subtitle":"상태 변경 시 등록된 리스너 콜백들에게 일괄 이벤트 통지","code":"class EventBus:\n    def __init__(self):\n        self._listeners = {}\n\n    def subscribe(self, event_type: str, callback):\n        self._listeners.setdefault(event_type, []).append(callback)\n\n    def publish(self, event_type: str, data):\n        for listener in self._listeners.get(event_type, []):\n            listener(data)\n\nbus = EventBus()\nbus.subscribe(\"user_signup\", lambda u: print(f\"환영 메일 발송 to {u['email']}\"))\nbus.subscribe(\"user_signup\", lambda u: print(f\"회원 가입 통계 +1\"))\nbus.publish(\"user_signup\", {\"email\": \"test@dev.com\"})","description":"모듈 간 직접 참조 없이 이벤트를 매개로 분리(Decoupling)하여 독립적인 확장을 가능하게 합니다.","tags":["옵저버","발행구독","이벤트","디자인패턴"],"outputExample":"환영 메일 발송 / 회원 가입 통계 +1","level":"고급"},{"id":"py-113","category":"python","title":"전략(Strategy) 패턴 함수형 캡슐화","subtitle":"런타임에 동적으로 할인 알고리즘이나 결제 전략 교체","code":"from typing import Callable\n\nDiscountStrategy = Callable[[float], float]\n\ndef vip_discount(price: float) -> float:\n    return price * 0.8  # 20% 할인\n\ndef coupon_discount(price: float) -> float:\n    return max(0.0, price - 5000)\n\nclass Order:\n    def __init__(self, amount: float, discount_strategy: DiscountStrategy):\n        self.amount = amount\n        self.strategy = discount_strategy\n\n    def final_price(self) -> float:\n        return self.strategy(self.amount)\n\norder = Order(50000, vip_discount)\nprint(\"최종 결제 금액:\", order.final_price())  # 40000.0","description":"파이썬의 일급 시민 함수(First-class Function) 특성을 살려 불필요한 클래스 계층 없이 간결하게 전략 패턴을 적용합니다.","tags":["전략패턴","함수형","디자인패턴"],"outputExample":"최종 결제 금액: 40000.0","level":"고급"},{"id":"py-114","category":"python","title":"커스텀 예외 계층과 BaseException vs Exception","subtitle":"도메인 특화 에러를 체계적으로 분류하고 정밀 포착","code":"class AppBaseError(Exception):\n    \"\"\"애플리케이션 최상위 도메인 예외\"\"\"\n    pass\n\nclass DatabaseConnectionError(AppBaseError):\n    def __init__(self, host: str, timeout: int):\n        super().__init__(f\"DB 연결 실패 ({host}, 타임아웃: {timeout}s)\")\n        self.host = host\n\nclass AuthenticationError(AppBaseError):\n    pass\n\n# 상위 예외 AppBaseError로 하위 모든 도메인 에러 일괄 포착 가능\ntry:\n    raise DatabaseConnectionError(\"db.prod.internal\", 5)\nexcept AppBaseError as e:\n    print(\"도메인 에러 포착:\", e)","description":"표준 Exception을 무분별하게 던지지 않고 프로젝트 고유의 예외 트리를 구성하여 에러 핸들링을 명확히 합니다.","tags":["예외처리","커스텀에러","OOP"],"outputExample":"도메인 에러 포착: DB 연결 실패...","level":"고급"},{"id":"py-115","category":"python","title":"예외 체이닝 (raise ... from err) 원인 예외 보존","subtitle":"저수준 에러를 고수준 비즈니스 에러로 감싸면서 원본 역추적 보존","code":"def query_user(user_id: int):\n    try:\n        # 가상의 저수준 소켓 또는 키 에러 발생\n        raise KeyError(\"user_token_expired\")\n    except KeyError as original_err:\n        # 원본 예외(KeyError)를 유지하면서 커스텀 예외로 래핑\n        raise RuntimeError(\"사용자 데이터 조회 실패\") from original_err\n\n# raise ... from None 을 쓰면 원본 추적을 의도적으로 은폐할 수도 있음","description":"PEP 3134 예외 체이닝을 통해 디버깅 시 The above exception was the direct cause of the following exception 로그를 보존합니다.","tags":["예외체이닝","from","디버깅"],"outputExample":"RuntimeError ... from KeyError","level":"고급"},{"id":"py-116","category":"python","title":"typing.Literal 및 Final 상수 불변성 지정","subtitle":"허용되는 문자열/정수 값 제한 및 상수 재할당 방지","code":"from typing import Literal, Final\n\n# 1. 특정 문자열 값만 허용 (Enum보다 경량)\nMode = Literal['read', 'write', 'append']\n\ndef open_file(path: str, mode: Mode):\n    print(f\"모드: {mode}\")\n\n# 2. 재할당 불가능한 상수 명시\nMAX_RETRY_COUNT: Final[int] = 5\n# MAX_RETRY_COUNT = 10  # mypy 에러: Cannot assign to final name","description":"타입 체커가 오타나 허용되지 않은 인자 전달을 컴파일 타임에 즉시 경고하도록 방어합니다.","tags":["Literal","Final","상수","타입힌트"],"outputExample":"mypy 정적 분석 통과","level":"고급"},{"id":"py-117","category":"python","title":"typing.Annotated 메타데이터 주입","subtitle":"타입 정보 외에 추가 검증 제약 조건(길이, 범위) 부착","code":"from typing import Annotated\n\n# 정수이면서 1~100 사이의 범위 메타데이터 첨부\nPositiveInt = Annotated[int, \"Value must be > 0\"]\n\n# FastAPI나 Pydantic에서 Field(...) 제약 조건 부착에 널리 활용\n# UserId = Annotated[int, Path(title=\"사용자 ID\", ge=1)]","description":"타입 자체를 오염시키지 않고 프레임워크나 밸리데이터가 참조할 메타데이터 튜플을 부여합니다.","tags":["Annotated","메타데이터","Pydantic"],"outputExample":"타입 힌트에 부가 정보 보존","level":"고급"},{"id":"py-118","category":"python","title":"Pydantic v2 BaseModel 데이터 유효성 검증","subtitle":"Rust 기반 코어(pydantic-core)의 초고속 데이터 파싱 및 스키마 검증","code":"from pydantic import BaseModel, EmailStr, Field\n\nclass UserSchema(BaseModel):\n    id: int\n    username: str = Field(min_length=3, max_length=20)\n    email: EmailStr\n    is_active: bool = True\n\n# 유효성 검사 및 자동 타입 캐스팅\nuser = UserSchema(id=\"123\", username=\"alex_dev\", email=\"alex@site.com\")\nprint(user.model_dump())  # {'id': 123, 'username': 'alex_dev', ...}","description":"FastAPI의 근간 라이브러리로 잘못된 타입이나 형식의 입력 데이터를 감지하고 안전하게 정제합니다.","tags":["pydantic","FastAPI","유효성검사","데이터모델"],"outputExample":"{'id': 123, 'username': 'alex_dev'}","level":"고급"},{"id":"py-119","category":"python","title":"Pytest fixture scope (session/function) 및 yield teardown","subtitle":"테스트 전후 셋업 및 리소스 자동 정리(Teardown)","code":"import pytest\n\n@pytest.fixture(scope=\"module\")\ndef db_connection():\n    # Setup 단계\n    conn = {\"status\": \"connected\"}\n    print(\"\\n[Setup] DB 커넥션 오픈\")\n    yield conn  # 테스트 함수에 제공\n    # Teardown 단계 (테스트 종료 후 자동 실행)\n    print(\"\\n[Teardown] DB 커넥션 종료\")\n\ndef test_user_query(db_connection):\n    assert db_connection[\"status\"] == \"connected\"","description":"중복 코드를 획기적으로 줄이고 모듈 단위 또는 세션 단위로 고비용 리소스의 생성과 파괴를 제어합니다.","tags":["pytest","fixture","teardown","테스트"],"outputExample":"PASSED [Setup] ... [Teardown]","level":"고급"},{"id":"py-120","category":"python","title":"Pytest parametrize 다중 인자 테스트 자동화","subtitle":"하나의 테스트 함수로 여러 입력값과 기대 결과 일괄 검증","code":"import pytest\n\ndef is_palindrome(text: str) -> bool:\n    cleaned = ''.join(c.lower() for c in text if c.isalnum())\n    return cleaned == cleaned[::-1]\n\n@pytest.mark.parametrize(\"input_str, expected\", [\n    (\"level\", True),\n    (\"Python\", False),\n    (\"A man a plan a canal Panama\", True),\n    (\"\", True),\n])\ndef test_palindrome(input_str, expected):\n    assert is_palindrome(input_str) == expected","description":"경계값(Boundary) 테스트와 다양한 케이스를 반복문 없이 단일 데코레이터로 독립 실행 및 리포팅합니다.","tags":["pytest","parametrize","단위테스트"],"outputExample":"4 passed in 0.02s","level":"고급"},{"id":"py-121","category":"python","title":"unittest.mock.patch 외부 의존성 모의 객체 주입","subtitle":"외부 결제 API나 메일 발송 등의 실제 호출 방지 및 가상 응답","code":"from unittest.mock import patch, MagicMock\n\ndef fetch_external_stock(ticker: str):\n    # 실제 네트워크 요청 발생 가정\n    pass\n\n@patch('__main__.fetch_external_stock')\ndef test_stock_processing(mock_fetch):\n    # 가짜 반환값 설정\n    mock_fetch.return_value = {\"price\": 150000}\n    \n    result = fetch_external_stock(\"005930\")\n    assert result[\"price\"] == 150000\n    mock_fetch.assert_called_once_with(\"005930\")","description":"외부 의존성에 영향받지 않고 순수 비즈니스 로직만을 격리하여 빠르고 안정적인 단위 테스트를 보장합니다.","tags":["mock","patch","테스트","격리"],"outputExample":"mock_fetch.assert_called_once_with() 통과","level":"고급"},{"id":"py-122","category":"python","title":"struct 모듈 바이너리 데이터 pack 및 unpack","subtitle":"C 구조체 형태의 원시 바이트 패킷 조립 및 파싱","code":"import struct\n\n# 정수(i: 4바이트), 실수(f: 4바이트), 4글자 문자열(4s)\n# >: 빅엔디안, <: 리틀엔디안\npacked_data = struct.pack('>i f 4s', 101, 3.1415, b'DEV!')\nprint(\"바이너리 길이:\", len(packed_data))  # 12 바이트\n\n# 바이너리를 원래 튜플 데이터로 복원\nuser_id, score, code = struct.unpack('>i f 4s', packed_data)\nprint(f\"복원 결과: id={user_id}, score={score:.2f}, code={code.decode()}\")","description":"네트워크 프로토콜 개발, 커스텀 바이너리 파일 형식(BMP, WAV 등)을 다룰 때 필수적인 모듈입니다.","tags":["struct","바이너리","C엔디안","패킷"],"outputExample":"복원 결과: id=101, score=3.14, code=DEV!","level":"고급"},{"id":"py-123","category":"python","title":"hmac 모듈을 통한 SHA-256 서명 토큰 검증","subtitle":"웹훅(Webhook) 및 API 메시지의 위변조 방지 인증","code":"import hmac\nimport hashlib\n\nSECRET_KEY = b\"super-secure-secret-key\"\npayload = b'{\"event\": \"payment_complete\", \"amount\": 50000}'\n\n# 1. 서명 생성\nsignature = hmac.new(SECRET_KEY, payload, hashlib.sha256).hexdigest()\n\n# 2. 수신 측 검증 (타이밍 공격 방지 compare_digest 사용)\nincoming_sig = signature\nis_valid = hmac.compare_digest(\n    hmac.new(SECRET_KEY, payload, hashlib.sha256).hexdigest(),\n    incoming_sig\n)\nprint(\"서명 검증 성공 여부:\", is_valid)  # True","description":"GitHub 웹훅이나 결제 게이트웨이(PG사) 통신 시 데이터 위변조를 판별하는 산업 표준 메시지 인증 기법입니다.","tags":["hmac","sha256","보안","웹훅"],"outputExample":"서명 검증 성공 여부: True","level":"고급"},{"id":"py-124","category":"python","title":"secrets 모듈 암호학적 안전 난수 및 토큰 생성","subtitle":"예측 불가능한 난수로 세션 ID, 비밀번호 재설정 토큰 발급","code":"import secrets\n\n# 1. 32바이트 보안 URL-safe 토큰 생성\nsecure_token = secrets.token_urlsafe(32)\nprint(\"보안 세션 토큰:\", secure_token)\n\n# 2. 16진수 암호 키 생성\nhex_key = secrets.token_hex(16)\n\n# 3. 0~99 범위의 안전한 난수 (random 모듈 대신 필수 사용)\nrand_val = secrets.randbelow(100)","description":"random 모듈은 의사 난수(Mersenne Twister)이므로 암호학적으로 취약합니다. 비밀번호, 인증 토큰은 반드시 secrets를 써야 합니다.","tags":["secrets","보안","토큰","난수","전문가"],"outputExample":"보안 세션 토큰: 4eX_9...","level":"전문가"},{"id":"py-125","category":"python","title":"logging RotatingFileHandler 용량 기준 로그 자동 분할","subtitle":"단일 로그 파일이 디스크를 채우지 않도록 롤링 백업","code":"import logging\nfrom logging.handlers import RotatingFileHandler\n\nlogger = logging.getLogger('AppLogger')\nlogger.setLevel(logging.INFO)\n\n# 최대 5MB, 최대 3개 백업 파일 유지 (app.log, app.log.1, app.log.2)\nhandler = RotatingFileHandler('app.log', maxBytes=5*1024*1024, backupCount=3)\nformatter = logging.Formatter('%(asctime)s [%(levelname)s] %(message)s')\nhandler.setFormatter(formatter)\nlogger.addHandler(handler)\n\nlogger.info(\"서버가 기동되었습니다.\")","description":"실무 프로덕션 서버에서 디스크 풀(Disk Full) 장애를 방지하는 필수적인 로그 핸들러 구성입니다.","tags":["logging","RotatingFileHandler","로그분할"],"outputExample":"app.log 파일 자동 로테이션","level":"고급"},{"id":"py-126","category":"python","title":"logging 커스텀 JSON 포맷터 (구조화 로그)","subtitle":"ELK 스택, Datadog, CloudWatch 친화적 로그 포맷","code":"import logging\nimport json\nfrom datetime import datetime, timezone\n\nclass JSONFormatter(logging.Formatter):\n    def format(self, record):\n        log_entry = {\n            \"timestamp\": datetime.now(timezone.utc).isoformat(),\n            \"level\": record.levelname,\n            \"message\": record.getMessage(),\n            \"logger\": record.name,\n            \"module\": record.module,\n            \"line\": record.lineno\n        }\n        return json.dumps(log_entry, ensure_ascii=False)\n\nhandler = logging.StreamHandler()\nhandler.setFormatter(JSONFormatter())\nlogger = logging.getLogger(\"api\")\nlogger.addHandler(handler)\nlogger.setLevel(logging.INFO)\nlogger.info(\"결제 승인 완료\")","description":"클라우드 네이티브 환경에서 로그 수집기가 파싱하기 쉬운 표준화된 JSON 라인으로 로그를 남깁니다.","tags":["logging","JSON","구조화로그","DevOps"],"outputExample":"{\"timestamp\": \"...\", \"level\": \"INFO\", \"message\": \"결제 승인 완료\"}","level":"고급"},{"id":"py-127","category":"python","title":"zlib 스트리밍 메모리 압축 및 해제","subtitle":"디스크 저장 없이 인메모리 원시 바이트 데이터 압축","code":"import zlib\n\nraw_data = b\"Python Advanced Cheatsheet \" * 50\nprint(\"원본 바이트 크기:\", len(raw_data))\n\n# 압축 레벨 9 (최대 압축)\ncompressed = zlib.compress(raw_data, level=9)\nprint(\"압축 후 바이트 크기:\", len(compressed))\n\n# 복원\ndecompressed = zlib.decompress(compressed)\nassert raw_data == decompressed","description":"네트워크 트래픽을 절감하거나 Redis 캐시에 큰 문자열을 저장할 때 메모리를 대폭 절약합니다.","tags":["zlib","압축","메모리절약"],"outputExample":"원본 1350B -> 압축 후 45B","level":"고급"},{"id":"py-128","category":"python","title":"urllib.parse URL 인코딩 및 쿼리 파싱","subtitle":"복잡한 쿼리 스트링 분해와 특수문자 안전 인코딩","code":"from urllib.parse import urlparse, parse_qs, urlencode\n\nurl = \"https://example.com/search?q=파이썬+단축키&page=2&tag=git&tag=vscode\"\nparsed = urlparse(url)\n\n# 쿼리 스트링을 파이썬 딕셔너리로 파싱\nparams = parse_qs(parsed.query)\nprint(\"파싱된 쿼리:\", params)  # {'q': ['파이썬 단축키'], 'tag': ['git', 'vscode']}\n\n# 딕셔너리를 다시 URL 쿼리 스트링으로 인코딩\nnew_query = urlencode({'q': '전문가 코딩', 'sort': 'desc'})\nprint(\"인코딩된 쿼리:\", new_query)","description":"웹 크롤러나 백엔드 라우터에서 복합 쿼리 파라미터를 다룰 때 사용하는 표준 라이브러리입니다.","tags":["urllib","URL파싱","쿼리스트링"],"outputExample":"params['tag'] = ['git', 'vscode']","level":"고급"},{"id":"py-129","category":"python","title":"mmap 대용량 파일 초고속 메모리 맵핑","subtitle":"수 기가바이트(GB) 파일을 메모리에 로드하지 않고 바이트 슬라이싱 검색","code":"import mmap\nimport os\n\n# 더미 1MB 파일 준비\nwith open('huge_data.bin', 'wb') as f:\n    f.write(b'Header' + b'\\x00' * 1000000 + b'TARGET_KEYWORD')\n\nwith open('huge_data.bin', 'r+b') as f:\n    # 파일을 프로세스 가상 메모리 공간에 직접 매핑\n    with mmap.mmap(f.fileno(), 0) as mm:\n        # 파일 전체를 메모리에 올리지 않고 정규식/바이트 즉시 검색\n        idx = mm.find(b'TARGET_KEYWORD')\n        print(\"키워드 위치 바이트 오프셋:\", idx)\n\nos.remove('huge_data.bin')","description":"OS의 페이지 캐시와 가상 메모리 관리자를 직접 활용하여 대용량 로그 분석 시 극도의 속도 향상을 얻습니다.","tags":["mmap","대용량파일","고성능","전문가"],"outputExample":"키워드 위치 바이트 오프셋: 1000006","level":"전문가"},{"id":"py-130","category":"python","title":"functools.wraps 데코레이터 함수 메타데이터 보존","subtitle":"데코레이터 감싸기 시 __name__, __doc__, __annotations__ 손실 방지","code":"from functools import wraps\n\ndef my_decorator(fn):\n    @wraps(fn)  # 필수! 원본 함수의 docstring과 이름을 덮어쓰지 않음\n    def wrapper(*args, **kwargs):\n        \"\"\"래퍼 함수 설명문\"\"\"\n        return fn(*args, **kwargs)\n    return wrapper\n\n@my_decorator\ndef calculate_tax(amount: float) -> float:\n    \"\"\"세금을 계산합니다.\"\"\"\n    return amount * 0.1\n\nprint(calculate_tax.__name__)  # 'calculate_tax' (wrapper가 아님)\nprint(calculate_tax.__doc__)   # '세금을 계산합니다.'","description":"데코레이터 작성 시 @wraps를 생략하면 디버깅, Sphinx 문서화, FastAPI 라우팅 메타데이터가 깨지므로 필수입니다.","tags":["wraps","functools","데코레이터"],"outputExample":"calculate_tax / 세금을 계산합니다.","level":"고급"},{"id":"py-131","category":"python","title":"functools.reduce 누적 집계 계산","subtitle":"시퀀스의 모든 요소를 왼쪽부터 차례대로 단일 값으로 축약","code":"from functools import reduce\nimport operator\n\nnumbers = [1, 2, 3, 4, 5]\n\n# 1. 누적 곱 (1 * 2 * 3 * 4 * 5 = 120)\nfactorial = reduce(operator.mul, numbers)\n\n# 2. 중첩 딕셔너리 안전 탐색\ndata = {\"user\": {\"profile\": {\"address\": {\"city\": \"Seoul\"}}}}\nkeys = [\"user\", \"profile\", \"address\", \"city\"]\nval = reduce(lambda acc, k: acc.get(k, {}) if isinstance(acc, dict) else None, keys, data)\nprint(\"도시명:\", val)  # Seoul","description":"함수형 프로그래밍의 핵심 연산자로, 파이썬 반복문 없이도 깊은 중첩 구조를 우아하게 순회 및 축약합니다.","tags":["reduce","functools","함수형"],"outputExample":"도시명: Seoul","level":"고급"},{"id":"py-132","category":"python","title":"operator 모듈 attrgetter & itemgetter 고속 추출","subtitle":"람다(lambda)보다 빠른 C 레벨 속성 및 딕셔너리 키 추출","code":"from operator import itemgetter, attrgetter\n\nusers = [\n    {\"name\": \"Kim\", \"age\": 28, \"score\": 95},\n    {\"name\": \"Lee\", \"age\": 22, \"score\": 90},\n    {\"name\": \"Park\", \"age\": 28, \"score\": 85},\n]\n\n# 다중 키 정렬 (나이 오름차순, 점수 내림차순)\nsorted_users = sorted(users, key=itemgetter(\"age\", \"score\"))\nprint(\"정렬 결과 첫 번째:\", sorted_users[0][\"name\"])  # Lee","description":"lambda x: x[\"age\"] 대신 itemgetter(\"age\")를 사용하면 C 레벨 최적화로 정렬 속도가 20~30% 빨라집니다.","tags":["operator","itemgetter","attrgetter","정렬최적화"],"outputExample":"Lee","level":"고급"},{"id":"py-133","category":"python","title":"collections.ChainMap 계층적 스코프 탐색","subtitle":"명령행 인자, 환경 변수, 기본값 설정을 하나의 딕셔너리처럼 조회","code":"from collections import ChainMap\n\ndefaults = {'theme': 'dark', 'show_line_numbers': True, 'font_size': 14}\nenvironment = {'theme': 'dracula'}\ncli_args = {'font_size': 16}\n\n# 우선순위: CLI 인자 -> 환경 변수 -> 기본값\nsettings = ChainMap(cli_args, environment, defaults)\n\nprint(settings['font_size'])           # 16 (CLI 인자 적용)\nprint(settings['theme'])               # dracula (환경변수 적용)\nprint(settings['show_line_numbers'])   # True (기본값 유지)","description":"여러 딕셔너리를 메모리에 복사/병합하지 않고 참조 계층을 연결하여 순차적으로 키를 탐색합니다.","tags":["ChainMap","설정관리","자료구조"],"outputExample":"16 / dracula / True","level":"고급"},{"id":"py-134","category":"python","title":"array 모듈 원시 C 타입 숫자 배열 메모리 최적화","subtitle":"파이썬 표준 리스트 대비 80% 이상의 메모리 절약","code":"import array\nimport sys\n\n# 'i': C 서명 있는 정수 (4바이트)\nc_array = array.array('i', range(100_000))\npy_list = list(range(100_000))\n\nprint(\"array 메모리:\", sys.getsizeof(c_array), \"bytes\")  # 약 400KB\nprint(\"list 메모리:\", sys.getsizeof(py_list), \"bytes\")    # 약 800KB + 각 포인터 오버헤드","description":"NumPy를 설치할 수 없는 가벼운 환경에서 순수 파이썬으로 대량의 균일한 숫자 배열을 메모리 효율적으로 보관합니다.","tags":["array","메모리절약","C타입"],"outputExample":"array 메모리 대폭 절감","level":"고급"},{"id":"py-135","category":"python","title":"sys.settrace 커스텀 코드 실행 라인 추적기 제작","subtitle":"CPython 디버거(pdb) 및 코드 커버리지(coverage.py)의 기초 원리","code":"import sys\n\ndef trace_calls(frame, event, arg):\n    if event == 'line':\n        code = frame.f_code\n        print(f\"-> 실행 라인: {code.co_name} ({frame.f_lineno}행)\")\n    return trace_calls\n\ndef sample_demo():\n    x = 10\n    y = 20\n    return x + y\n\nsys.settrace(trace_calls)\nsample_demo()\nsys.settrace(None)  # 추적 해제","description":"CPython 인터프리터가 매 라인을 실행할 때마다 콜백을 발생시켜 인터셉트하는 궁극의 디버깅 및 분석 훅입니다.","tags":["sys","settrace","디버거엔진","전문가"],"outputExample":"-> 실행 라인: sample_demo (13행)","level":"전문가"},{"id":"py-136","category":"python","title":"importlib 모듈 동적 로드 및 런타임 리로딩","subtitle":"문자열 이름으로 모듈을 동적 임포트하고 변경 내용 재반영","code":"import importlib\n\n# 1. 문자열로 동적 모듈 로드\nmath_module = importlib.import_module('math')\nprint(\"동적 호출 pi:\", math_module.pi)\n\n# 2. 실행 중 수정된 파일 핫 리로딩\n# importlib.reload(my_custom_module)","description":"플러그인 아키텍처나 설정 파일에 적힌 클래스를 런타임에 동적으로 인스턴스화할 때 사용합니다.","tags":["importlib","동적임포트","핫리로드","전문가"],"outputExample":"동적 호출 pi: 3.141592653589793","level":"전문가"},{"id":"py-137","category":"python","title":"typing.TypeGuard 사용자 정의 타입 가드 좁히기","subtitle":"함수 판별 로직을 mypy/Pyright 정적 타입 체커에 신뢰성 있게 전달","code":"from typing import TypeGuard, List, Any\n\ndef is_str_list(val: List[Any]) -> TypeGuard[List[str]]:\n    return all(isinstance(x, str) for x in val)\n\ndef process_items(items: List[Any]):\n    if is_str_list(items):\n        # 이 블록 안에서 items는 List[str]로 완벽히 타입 축소됨\n        print(\", \".join(items))","description":"복잡한 런타임 검사 함수의 결과를 정적 분석 도구가 인지하여 안전하게 타입 캐스팅을 인정하도록 만듭니다.","tags":["TypeGuard","타입시스템","정적분석"],"outputExample":"items가 List[str]로 좁혀짐","level":"고급"},{"id":"py-138","category":"python","title":"typing.Self 메서드 체이닝 반환 타입","subtitle":"서브클래스에서 상속받은 빌더 메서드의 정확한 인스턴스 반환 타입 보장","code":"from typing import Self\n\nclass QueryBuilder:\n    def filter(self, condition: str) -> Self:\n        # 필터링 로직\n        return self\n\nclass CustomBuilder(QueryBuilder):\n    def custom_sort(self) -> Self:\n        return self\n\nbuilder = CustomBuilder().filter(\"active=1\").custom_sort()","description":"Python 3.11+에 추가된 typing.Self는 빌더 패턴(Fluent Interface)에서 서브클래스 타입을 정확히 유지합니다.","tags":["Self","빌더패턴","타입힌팅"],"outputExample":"정확한 반환 서브클래스 타입 유지","level":"고급"},{"id":"py-139","category":"python","title":"itertools.accumulate 누적 합계 및 커스텀 누적 연산","subtitle":"배열의 누적 합, 누적 최대값, 복리 계산을 제너레이터로 생성","code":"import itertools\nimport operator\n\nscores = [10, 20, 5, 30, 15]\n\n# 1. 기본 누적 합\nrunning_sum = list(itertools.accumulate(scores))\nprint(\"누적 합:\", running_sum)  # [10, 30, 35, 65, 80]\n\n# 2. 누적 최대값(Running Max) 유지\nrunning_max = list(itertools.accumulate(scores, max))\nprint(\"누적 최대값:\", running_max)  # [10, 20, 20, 30, 30]","description":"중간 합계 상태를 보존하면서 O(N) 단일 패스로 누적 수열을 계산하는 고효율 이터레이터입니다.","tags":["itertools","accumulate","수학","수열"],"outputExample":"누적 합: [10, 30, 35, 65, 80]","level":"고급"},{"id":"py-140","category":"python","title":"itertools.dropwhile & takewhile 조건 제너레이터","subtitle":"조건이 거짓이 될 때까지 건너뛰거나, 참인 동안만 요소 수집","code":"import itertools\n\ndata = [2, 4, 6, 7, 8, 10]\n\n# 짝수인 동안만 수집하다가 최초의 홀수(7)를 만나면 즉시 중단\nevens = list(itertools.takewhile(lambda x: x % 2 == 0, data))\nprint(\"앞쪽 짝수만:\", evens)  # [2, 4, 6]\n\n# 5보다 작은 값들은 모두 건너뛰고 그 이후부터 끝까지 수집\nafter_five = list(itertools.dropwhile(lambda x: x < 5, data))\nprint(\"5 이상부터 끝까지:\", after_five)  # [6, 7, 8, 10]","description":"로그 파일의 헤더를 건너뛰거나 특정 타임스탬프 이후의 데이터만 스트리밍할 때 메모리 낭비 없이 처리합니다.","tags":["itertools","takewhile","dropwhile","제너레이터"],"outputExample":"앞쪽 짝수만: [2, 4, 6]","level":"고급"},{"id":"py-141","category":"python","title":"itertools.islice 메모리 효율적 제너레이터 슬라이싱","subtitle":"거대 파일이나 무한 제너레이터에서 [start:stop:step] 부분 추출","code":"import itertools\n\ndef infinite_fibonacci():\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a + b\n\n# 무한 수열에서 10번째부터 15번째까지 5개만 안전하게 슬라이싱\nfib_slice = list(itertools.islice(infinite_fibonacci(), 10, 15))\nprint(\"피보나치 10~14번째:\", fib_slice)","description":"일반 슬라이싱 [:]은 전체 리스트를 메모리에 생성해야 하지만, islice는 이터레이터를 소비하며 즉시 슬라이싱합니다.","tags":["islice","itertools","슬라이싱"],"outputExample":"피보나치 10~14번째: [55, 89, 144, 233, 377]","level":"고급"},{"id":"py-142","category":"python","title":"math.isclose 부동소수점 오차 정밀 비교","subtitle":"0.1 + 0.2 == 0.3 이 False인 부동소수점 한계를 안전하게 극복","code":"import math\n\n# 부동소수점 2진수 연산 오차\nprint(0.1 + 0.2 == 0.3)  # False (0.30000000000000004)\n\n# math.isclose를 사용한 상대/절대 허용 오차 비교\nprint(math.isclose(0.1 + 0.2, 0.3))  # True\nprint(math.isclose(1.00001, 1.00002, abs_tol=1e-4))  # True","description":"과학 연산, 좌표 계산 등에서 머신 엡실론(Machine Epsilon)으로 인한 등호 비교 오류를 방지합니다.","tags":["math","isclose","부동소수점","정밀도"],"outputExample":"False -> math.isclose: True","level":"고급"},{"id":"py-143","category":"python","title":"decimal.Decimal 금융 및 초정밀 10진수 연산","subtitle":"금융, 결제, 세금 계산에서 1원 단위 오차도 없는 정확한 산술","code":"from decimal import Decimal, ROUND_HALF_UP\n\nprice = Decimal('199.99')\ntax_rate = Decimal('0.0825')\ntax = price * tax_rate\n\n# 반올림 규칙 엄격 적용 (ROUND_HALF_UP)\nrounded_tax = tax.quantize(Decimal('0.01'), rounding=ROUND_HALF_UP)\nprint(\"정확한 부가세:\", rounded_tax)  # 16.50","description":"은행 및 결제 시스템에서 부동소수점 반올림 누적 오차를 차단하기 위해 법적으로 필수 권장되는 자료형입니다.","tags":["decimal","금융연산","초정밀","소수점"],"outputExample":"정확한 부가세: 16.50","level":"고급"},{"id":"py-144","category":"python","title":"fractions.Fraction 분수 유리수 정확 연산","subtitle":"1/3 같은 무한 순환소수를 분수 형태로 무손실 보존","code":"from fractions import Fraction\n\nf1 = Fraction(1, 3)\nf2 = Fraction(1, 6)\n\nresult = f1 + f2\nprint(\"1/3 + 1/6 =\", result)             # 1/2\nprint(\"분자(numerator):\", result.numerator)     # 1\nprint(\"분모(denominator):\", result.denominator) # 2","description":"수학 알고리즘, 비율 계산에서 근사치 오차 없이 정확한 분수 상태로 사칙연산을 유지합니다.","tags":["fractions","분수","수학"],"outputExample":"1/3 + 1/6 = 1/2","level":"고급"},{"id":"py-145","category":"python","title":"shlex 모듈 셸 명령어 안전 분할 및 이스케이프","subtitle":"공백과 따옴표가 포함된 문자열을 CLI 인자 리스트로 안전 파싱","code":"import shlex\n\ncmd = 'curl -X POST \"https://api.com/v1\" -H \"Authorization: Bearer my_token\" -d '{\"id\": 1}''\n\n# 셸 문법 규칙에 맞게 따옴표 내부를 보존하며 split\ntokens = shlex.split(cmd)\nprint(tokens[0])  # 'curl'\nprint(tokens[4])  # 'Authorization: Bearer my_token'\n\n# 안전한 인자 인용 (명령어 삽입 공격 방어)\nsafe_arg = shlex.quote('file; rm -rf /')","description":"subprocess.run(shlex.split(cmd)) 형태로 사용하여 셸 인젝션 보안 취약점을 차단합니다.","tags":["shlex","셸파싱","보안","CLI"],"outputExample":"공백 및 따옴표 안전 파싱","level":"고급"},{"id":"py-146","category":"python","title":"multiprocessing.Manager 프로세스 간 딕셔너리/리스트 공유","subtitle":"서로 다른 프로세스 간에 복합 파이썬 객체를 서버 프로세스로 공유","code":"from multiprocessing import Process, Manager\n\ndef worker(shared_dict, shared_list, pid):\n    shared_dict[f\"worker_{pid}\"] = pid * 10\n    shared_list.append(pid)\n\nif __name__ == '__main__':\n    with Manager() as manager:\n        s_dict = manager.dict()\n        s_list = manager.list()\n        \n        procs = [Process(target=worker, args=(s_dict, s_list, i)) for i in range(3)]\n        for p in procs: p.start()\n        for p in procs: p.join()\n        \n        print(\"공유 딕셔너리:\", dict(s_dict))\n        print(\"공유 리스트:\", list(s_list))","description":"IPC 소켓 통신을 관리해주는 매니저 프로세스를 통해 프로세스 간 파이썬 고수준 컨테이너를 공유합니다.","tags":["multiprocessing","Manager","IPC","전문가"],"outputExample":"공유 딕셔너리: {'worker_0': 0, 'worker_1': 10, ...}","level":"전문가"},{"id":"py-147","category":"python","title":"exec / eval 전역/지역 네임스페이스 샌드박스 제어","subtitle":"__builtins__ 제한으로 동적 파이썬 코드 안전 격리 실행","code":"user_code = \"\"\"\nresult = x * 2 + y\n\"\"\"\n\n# 위험한 내장 함수(os, open, __import__) 완전 차단\nrestricted_globals = {\"__builtins__\": {}}\nlocal_vars = {\"x\": 10, \"y\": 5}\n\nexec(user_code, restricted_globals, local_vars)\nprint(\"안전한 연산 결과:\", local_vars[\"result\"])  # 25","description":"수식 계산기나 룰 엔진에서 동적 코드를 실행할 때 시스템 명령 실행 공격을 차단하는 최소 권한 샌드박스입니다.","tags":["exec","eval","샌드박스","보안","전문가"],"outputExample":"안전한 연산 결과: 25","level":"전문가"},{"id":"py-148","category":"python","title":"concurrent.futures as_completed 완료 순서 처리","subtitle":"작업이 먼저 끝나는 순서대로 즉시 결과 소비","code":"from concurrent.futures import ThreadPoolExecutor, as_completed\nimport time\n\ndef fetch_data(i):\n    time.sleep(0.3 if i == 1 else 0.1)\n    return f\"작업 {i} 완료\"\n\nwith ThreadPoolExecutor(max_workers=3) as executor:\n    futures = [executor.submit(fetch_data, i) for i in range(3)]\n    for future in as_completed(futures):\n        print(\"수신:\", future.result())","description":"모든 스레드가 다 끝날 때까지 기다리지 않고 가장 먼저 완료된 작업부터 파이프라인으로 넘겨 지연 시간을 줄입니다.","tags":["as_completed","ThreadPool","비동기"],"outputExample":"수신: 작업 0 완료 -> 작업 2 완료 -> 작업 1 완료","level":"고급"},{"id":"py-149","category":"python","title":"asyncio.shield 취소 방지 비동기 태스크 보호","subtitle":"부모 태스크나 타임아웃이 취소되더라도 중요 DB 커밋 등 내부 작업 완수 보장","code":"import asyncio\n\nasync def critical_commit():\n    print(\"중요 트랜잭션 커밋 시작\")\n    await asyncio.sleep(0.5)\n    print(\"중요 트랜잭션 커밋 완료!\")\n    return \"SUCCESS\"\n\nasync def main():\n    try:\n        # 0.2초 타임아웃이지만 critical_commit은 취소되지 않음\n        task = asyncio.create_task(critical_commit())\n        await asyncio.wait_for(asyncio.shield(task), timeout=0.2)\n    except asyncio.TimeoutError:\n        print(\"외부 호출은 타임아웃되었으나 태스크는 계속 진행됨\")\n        await task  # 최종 완료 대기","description":"외부 HTTP 요청이 끊겨도 결제 승인, DB 감사 로그 기록 등 반드시 완료되어야 하는 코루틴을 보호합니다.","tags":["asyncio","shield","트랜잭션","예외방어"],"outputExample":"외부 타임아웃 발생 -> 중요 트랜잭션 커밋 완료!","level":"고급"},{"id":"py-150","category":"python","title":"CPython sys._getframe 호출 스택 프레임 직접 탐색","subtitle":"호출자 함수의 로컬 변수 및 스택 트레이스 직접 접근","code":"import sys\n\ndef audit_logger():\n    # 1단계 상위 호출자 프레임\n    caller_frame = sys._getframe(1)\n    caller_name = caller_frame.f_code.co_name\n    caller_locals = caller_frame.f_locals\n    print(f\"호출 함수: {caller_name}, 당시 로컬 변수: {caller_locals}\")\n\ndef process_payment(amount: int, user_id: str):\n    audit_logger()\n\nprocess_payment(50000, \"user_42\")","description":"프레임워크 내부에서 마법 같은 자동 주입이나 로깅을 구현할 때 사용하는 저수준 CPython 내부 API입니다.","tags":["sys","_getframe","스택프레임","CPython","전문가"],"outputExample":"호출 함수: process_payment, 당시 로컬 변수: {'amount': 50000, ...}","level":"전문가"},{"id":"py-151","category":"python","title":"contextvars 비동기 태스크별 컨텍스트 로컬 변수","subtitle":"스레드 로컬(threading.local)의 비동기 코루틴 전용 버전","code":"import contextvars\nimport asyncio\n\n# 비동기 요청별 고유 트레이스 ID 보관\nrequest_id_var = contextvars.ContextVar('request_id', default='anonymous')\n\nasync def log_action(msg: str):\n    print(f\"[{request_id_var.get()}] {msg}\")\n\nasync def handle_request(req_id: str):\n    request_id_var.set(req_id)\n    await asyncio.sleep(0.05)\n    await log_action(\"데이터 처리 중...\")\n\n# 동시 실행되어도 컨텍스트 변수가 서로 섞이지 않음","description":"FastAPI, Sanic 등의 비동기 웹 프레임워크에서 매 HTTP 요청마다 사용자 인증 정보나 Trace ID를 전역적으로 공유합니다.","tags":["contextvars","asyncio","TraceID","고급"],"outputExample":"[req_101] 데이터 처리 중...","level":"고급"},{"id":"py-152","category":"python","title":"types.SimpleNamespace 동적 속성 경량 객체","subtitle":"딕셔너리 대신 점 표기법(obj.attr)으로 접근 가능한 깔끔한 데이터 홀더","code":"from types import SimpleNamespace\n\n# 점 표기법으로 접근 가능한 속성 객체\nuser = SimpleNamespace(name=\"Alice\", role=\"Admin\", is_active=True)\n\nprint(user.name)       # Alice (딕셔너리['name'] 대신 편리하게 접근)\nuser.level = 99        # 동적 속성 자유롭게 추가\nprint(user)            # namespace(is_active=True, level=99, name='Alice', role='Admin')","description":"빈 클래스를 따로 정의하지 않고도 직관적인 속성 접근형 DTO를 손쉽게 만듭니다.","tags":["SimpleNamespace","types","DTO"],"outputExample":"Alice","level":"고급"},{"id":"py-153","category":"python","title":"pickle 객체 직렬화와 __reduce__ 보안 취약점","subtitle":"파이썬 임의 객체 바이너리 저장 및 복원","code":"import pickle\n\ndata = {\"scores\": [90, 85, 100], \"user\": \"admin\"}\n\n# 직렬화 (Pickling)\nserialized = pickle.dumps(data)\n\n# 역직렬화 (Unpickling)\nrestored = pickle.loads(serialized)\nprint(restored[\"scores\"])  # [90, 85, 100]\n\n# 주의: 신뢰할 수 없는 출처의 pickle 역직렬화는 원격 코드 실행(RCE) 위험!","description":"머신러닝 모델 가중치나 복합 클래스 객체를 그대로 파일에 저장하고 읽을 때 사용합니다.","tags":["pickle","직렬화","보안주의"],"outputExample":"[90, 85, 100]","level":"고급"},{"id":"py-154","category":"python","title":"tarfile 모듈 .tar.gz 압축 파일 생성 및 스트리밍 추출","subtitle":"리눅스 표준 아카이브 생성 및 필터 기반 안전 해제","code":"import tarfile\nimport io\n\n# 1. 메모리 상에서 .tar.gz 아카이브 생성\ntar_buffer = io.BytesIO()\nwith tarfile.open(fileobj=tar_buffer, mode='w:gz') as tar:\n    # 텍스트 데이터 직접 압축 파일 내부 엔트리로 추가\n    info = tarfile.TarInfo(name=\"hello.txt\")\n    data = b\"Hello Developer!\"\n    info.size = len(data)\n    tar.addfile(info, io.BytesIO(data))\n\nprint(\"생성된 gzip 바이트 크기:\", len(tar_buffer.getvalue()))","description":"서버 백업, 도커 이미지 레이어 추출 등 리눅스 표준 아카이브 형식을 파이썬으로 직접 조작합니다.","tags":["tarfile","gzip","아카이브","압축"],"outputExample":"gzip 아카이브 정상 생성","level":"고급"},{"id":"py-155","category":"python","title":"CPython __del__ 소멸자와 객체 부활(Resurrection) 주의사항","subtitle":"가비지 컬렉션 시점에 실행되는 소멸자 동작 원리와 위험성","code":"class DangerousResource:\n    def __init__(self, name):\n        self.name = name\n\n    def __del__(self):\n        # 경고: 예외가 무시되며, 다른 객체를 참조 시 이미 소멸되었을 수 있음\n        # 전역 리스트 등에 self를 할당하면 '객체 부활'로 인해 GC 파괴됨\n        print(f\"[{self.name}] 메모리에서 해제됨 (소멸자 호출)\")\n\nres = DangerousResource(\"TempConnection\")\ndel res  # 즉시 해제되며 소멸자 호출","description":"파이썬에서는 리소스 해제 시 __del__ 대신 with 구문(Context Manager)을 사용하는 것이 원칙입니다.","tags":["__del__","소멸자","CPython","GC","전문가"],"outputExample":"[TempConnection] 메모리에서 해제됨","level":"전문가"},{"id":"py-156","category":"python","title":"glob.glob 재귀적 와일드카드 파일 탐색 (**)","subtitle":"하위 모든 폴더를 탐색하며 특정 확장자 파일 일괄 수집","code":"import glob\n\n# src 디렉토리 하위의 모든 .py 파일 재귀 검색 (recursive=True 필수)\npy_files = glob.glob('src/**/*.py', recursive=True)\nprint(f\"발견된 파이썬 파일 수: {len(py_files)}개\")","description":"프로젝트 내의 특정 패턴 파일을 빠르게 수집하여 일괄 배치 작업이나 정적 검사를 수행합니다.","tags":["glob","와일드카드","파일탐색"],"outputExample":"발견된 파이썬 파일 수: 12개","level":"고급"},{"id":"py-157","category":"python","title":"fnmatch 파일명 유닉스 와일드카드 패턴 매칭","subtitle":"정규식 없이도 *.log, test_[0-9].txt 같은 패턴 문자열 판별","code":"import fnmatch\n\nfilenames = [\"config.json\", \"server.log\", \"test_01.py\", \"error.LOG\"]\n\n# .log로 끝나는 파일 필터링 (대소문자 무시: fnmatchcase 또는 fnmatch)\nlog_files = [f for f in filenames if fnmatch.fnmatch(f, '*.log')]\nprint(\"로그 파일 목록:\", log_files)  # ['server.log', 'error.LOG']","description":".gitignore 패턴을 모방하거나 파일 목록에서 특정 확장자/접두사를 빠르게 골라낼 때 유용합니다.","tags":["fnmatch","와일드카드","파일명"],"outputExample":"['server.log', 'error.LOG']","level":"고급"},{"id":"py-158","category":"python","title":"re.VERBOSE 다중 줄 정규표현식 주석 작성","subtitle":"복잡하고 긴 정규식에 공백과 주석(#)을 추가하여 가독성 확보","code":"import re\n\n# 복잡한 이메일 정규식을 여러 줄에 걸쳐 주석과 함께 작성\nemail_pattern = re.compile(r\"\"\"\n    ^([a-zA-Z0-9_.+-]+) # 아이디 부분\n    @                   # 구분자 골뱅이\n    ([a-zA-Z0-9-]+)     # 도메인 이름\n    \\.([a-zA-Z.]{2,6})$ # 최상위 도메인 (.com, .co.kr)\n\"\"\", re.VERBOSE)\n\nmatch = email_pattern.match(\"support@google.com\")\nprint(match.groups())  # ('support', 'google', 'com')","description":"한 줄로 빽빽하게 작성되어 유지보수가 불가능한 정규표현식을 깔끔하게 문서화합니다.","tags":["re","정규표현식","VERBOSE","가독성"],"outputExample":"('support', 'google', 'com')","level":"고급"},{"id":"py-159","category":"python","title":"re.finditer 메모리 절약 정규식 이터레이터","subtitle":"findall()과 달리 대용량 텍스트에서 매치 객체를 스트리밍 순회","code":"import re\n\ntext = \"User1: 100점, User2: 85점, User3: 95점\"\npattern = re.compile(r'(\\w+): (\\d+)점')\n\n# 메모리에 전체 리스트를 만들지 않고 매치 위치와 그룹을 하나씩 추출\nfor match in pattern.finditer(text):\n    user, score = match.groups()\n    start_pos, end_pos = match.span()\n    print(f\"[{start_pos}~{end_pos}] {user} -> {score}점\")","description":"대용량 로그 파일에서 정규표현식 매칭을 수행할 때 메모리 폭증 없이 시작/끝 위치(span)까지 함께 얻습니다.","tags":["re","finditer","정규식","메모리절약"],"outputExample":"[0~11] User1 -> 100점","level":"고급"},{"id":"py-160","category":"python","title":"CPython 피프홀 최적화기(Peephole Optimizer)와 상수 폴딩","subtitle":"컴파일 시점에 계산되는 상수 표현식과 불변 튜플 캐싱 원리","code":"import dis\n\ndef compute_constants():\n    # 60 * 60 * 24 연산은 런타임에 실행되지 않고 컴파일 타임에 86400 상수로 폴딩됨\n    seconds_in_day = 60 * 60 * 24\n    return seconds_in_day\n\n# 바이트코드 확인 시 이미 86400 단일 상수로 LOAD_CONST 됨\ndis.dis(compute_constants)","description":"CPython 인터프리터가 바이트코드를 생성할 때 인라인 상수 폴딩(Constant Folding)을 적용하는 최적화 원리를 이해합니다.","tags":["Peephole","컴파일러","최적화","전문가"],"outputExample":"LOAD_CONST 1 (86400)","level":"전문가"},{"id":"git-001","category":"git","title":"git init 저장소 초기화","subtitle":"현재 디렉토리에 새로운 Git 버전 추적 시작","code":"# 현재 폴더를 새로운 깃 로컬 저장소로 초기화\ngit init\n\n# 기본 브랜치를 'main'으로 초기화\ngit init -b main","description":".git 숨김 디렉토리를 생성하여 파일 버전 관리를 시작합니다.","tags":["init","초기화","저장소"],"outputExample":"Initialized empty Git repository in /project/.git/","level":"기초"},{"id":"git-002","category":"git","title":"git clone 원격 저장소 복제","subtitle":"GitHub 리포지토리를 로컬 컴퓨터로 다운로드","code":"# 기본 폴더명으로 복제\ngit clone https://github.com/username/repository.git\n\n# 원하는 새 디렉토리 이름으로 복제\ngit clone https://github.com/username/repository.git my-app","description":"원격 저장소의 모든 브랜치, 커밋 히스토리를 로컬에 복제합니다.","tags":["clone","원격","다운로드"],"outputExample":"Cloning into 'my-app'... done.","level":"기초"},{"id":"git-003","category":"git","title":"git clone --depth 1 (Shallow Clone)","subtitle":"과거 히스토리를 제외하고 최신 커밋만 초고속 다운로드","code":"# 최근 1개의 커밋만 복제하여 다운로드 용량과 시간 극대화 절약\ngit clone --depth 1 https://github.com/username/huge-repo.git","description":"수 기가바이트의 거대한 저장소에서 최신 코드만 빠르게 빌드하거나 CI/CD 파이프라인에서 실행할 때 필수적입니다.","tags":["clone","depth","최적화","속도"],"outputExample":"Receiving objects: 100% (shallow clone completed)","level":"실무필수"},{"id":"git-004","category":"git","title":"git status 작업 디렉토리 상태 확인","subtitle":"수정, 스테이징, 트래킹되지 않은 파일 점검","code":"# 표준 상세 상태 확인\ngit status\n\n# -s: 간결한 축약형 상태 확인 (M:수정, A:추가, ?:추적안됨)\ngit status -s","description":"커밋 전 어떤 파일이 변경되었고 스테이징 영역에 올라갔는지 수시로 점검합니다.","tags":["status","상태확인","기초"],"outputExample":"On branch main\\nChanges not staged for commit:\\n  modified: app.py","level":"기초"},{"id":"git-005","category":"git","title":"git diff 코드 변경 내용 비교","subtitle":"작업 디렉토리와 최근 커밋 간의 차이 비교","code":"# 1. 아직 add하지 않은 작업 디렉토리의 변경 사항 확인\ngit diff\n\n# 2. 이미 스테이징(add)된 파일과 최신 커밋 간의 차이 확인\ngit diff --staged\n\n# 3. 특정 파일의 변경 내용만 확인\ngit diff src/App.tsx","description":"커밋하기 전에 내가 정확히 어떤 코드를 수정했는지 검토할 때 사용합니다.","tags":["diff","비교","코드검토"],"outputExample":"+ const newFeature = true;\\n- const oldCode = false;","level":"기초"},{"id":"git-006","category":"git","title":"git add 파일 스테이징","subtitle":"커밋 대상 파일들을 인덱스(Staging Area)에 등록","code":"# 특정 파일 하나만 스테이징\ngit add index.html\n\n# 변경 및 삭제된 모든 파일 일괄 스테이징\ngit add .\n\n# 특정 디렉토리 하위의 파일만 스테이징\ngit add src/","description":"수정한 파일 중 커밋에 포함할 파일들을 스테이징 영역으로 올립니다.","tags":["add","스테이징","기초"],"outputExample":"Changes to be committed: index.html","level":"기초"},{"id":"git-007","category":"git","title":"git add -p 대화형 부분 스테이징","subtitle":"한 파일 안에서 원하는 변경 덩어리(Hunk)만 골라 스테이징","code":"# 대화형 패치 모드 실행\ngit add -p\n\n# [y: 이 부분 스테이징, n: 건너뛰기, s: 더 작게 분할, q: 종료]","description":"여러 기능을 한 파일에서 작업했을 때 각각 별개의 독립적인 커밋으로 나눌 수 있습니다.","tags":["add","대화형","패치","실무필수"],"outputExample":"Stage this hunk [y,n,q,a,d,s,e,?]? y","level":"실무필수"},{"id":"git-008","category":"git","title":"git commit 커밋 생성","subtitle":"스테이징된 변경 사항을 의미 있는 메시지와 함께 영구 기록","code":"# 인라인 메시지와 함께 커밋\ngit commit -m \"feat: 카카오 소셜 로그인 기능 구현\"\n\n# 상세 설명(본문) 포함 멀티라인 커밋\ngit commit -m \"fix: 결제 요청 타임아웃 오류 수정\" -m \"- 재시도 로직 3회 추가\\n- 로깅 세분화\"","description":"feat:, fix:, docs:, refactor: 등의 일관된 커밋 컨벤션을 사용하면 협업 효율이 극대화됩니다.","tags":["commit","커밋","기록"],"outputExample":"[main 4a7c2e1] feat: 카카오 소셜 로그인 구현","level":"기초"},{"id":"git-009","category":"git","title":"git commit --amend 직전 커밋 수정","subtitle":"방금 작성한 커밋 메시지 변경 또는 누락된 파일 추가","code":"# 누락된 파일 스테이징 후 직전 커밋에 덮어쓰기\ngit add omitted_file.ts\ngit commit --amend --no-edit\n\n# 직전 커밋 메시지만 새로 변경하기\ngit commit --amend -m \"feat: 올바른 커밋 메시지\"","description":"새로운 커밋을 난잡하게 생성하지 않고 방금 만든 커밋을 깔끔하게 수정합니다.","tags":["commit","amend","수정"],"outputExample":"[main 9c4d12f] feat: 올바른 커밋 메시지 (amended)","level":"실무필수"},{"id":"git-010","category":"git","title":"git push 원격 업로드","subtitle":"로컬 브랜치의 커밋들을 GitHub 원격 저장소로 푸시","code":"# 원격 저장소 origin의 main 브랜치로 푸시\ngit push origin main\n\n# 첫 푸시 시 업스트림 설정 (-u) -> 다음부터는 'git push'만 입력 가능\ngit push -u origin feature/login","description":"-u (set-upstream) 옵션을 주면 원격 브랜치와 로컬 브랜치가 자동 연동됩니다.","tags":["push","업로드","github"],"outputExample":"To github.com/user/repo.git * [new branch] main -> main","level":"기초"},{"id":"git-011","category":"git","title":"git push --force-with-lease 안전한 강제 푸시","subtitle":"다른 사람의 작업물을 실수로 덮어쓰지 않는 안전한 Force Push","code":"# 일반 --force 대신 안전한 강제 푸시 사용\ngit push --force-with-lease origin feature/login","description":"rebase 후 원격에 반영할 때, 다른 팀원이 올린 새로운 커밋이 있다면 푸시를 거부하여 코드를 보호합니다.","tags":["push","force","안전","실무필수"],"outputExample":"Forced update with lease checked","level":"실무필수"},{"id":"git-012","category":"git","title":"git pull 원격 변경사항 가져와 병합","subtitle":"원격 저장소의 최신 코드를 로컬 브랜치에 동기화","code":"# 기본 풀 (fetch + merge)\ngit pull origin main\n\n# 깔끔한 커밋 히스토리를 유지하는 rebase 기반 풀 (실무 권장)\ngit pull --rebase origin main","description":"--rebase 옵션을 사용하면 불필요한 \"Merge branch...\" 머지 커밋 없이 직선 히스토리를 유지합니다.","tags":["pull","동기화","rebase"],"outputExample":"Fast-forward / Current branch is up to date.","level":"실무필수"},{"id":"git-013","category":"git","title":"git fetch 원격 변경사항만 내려받기","subtitle":"로컬 코드와 병합하지 않고 원격의 변경 내용만 확인","code":"# 모든 원격 저장소의 최신 커밋 정보만 다운로드\ngit fetch origin\n\n# fetch 후 원격과 내 브랜치의 차이 비교\ngit diff main origin/main","description":"내 코드와 충돌이 날지 미리 검토한 후 수동으로 merge하거나 rebase할 때 안전합니다.","tags":["fetch","동기화","안전"],"outputExample":"From github.com/user/repo\\n * [new branch] dev -> origin/dev","level":"기초"},{"id":"git-014","category":"git","title":"git branch 브랜치 목록 조회 및 생성","subtitle":"독립된 작업 흐름 분기","code":"# 로컬 브랜치 목록 확인 (* 표시가 현재 위치)\ngit branch\n\n# 원격 브랜치까지 모두 확인 (-a)\ngit branch -a\n\n# 새로운 브랜치 생성 (이동하지 않음)\ngit branch feature/payment","description":"기능 개발 시에는 메인 브랜치에서 새 브랜치를 분기하여 작업하는 것이 기본입니다.","tags":["branch","브랜치","생성"],"outputExample":"* main\\n  feature/payment\\n  remotes/origin/main","level":"기초"},{"id":"git-015","category":"git","title":"git branch -d / -D 브랜치 삭제","subtitle":"작업 완료된 로컬 브랜치 정리","code":"# 1. 머지 완료된 브랜치 안전 삭제 (-d)\ngit branch -d feature/login\n\n# 2. 머지 여부와 상관없이 강제 삭제 (-D)\ngit branch -D feature/experimental\n\n# 3. 원격 저장소의 브랜치 삭제\ngit push origin --delete feature/login","description":"작업이 끝난 브랜치는 수시로 정리하여 브랜치 목록의 난잡함을 방지합니다.","tags":["branch","삭제","정리"],"outputExample":"Deleted branch feature/login (was 4a7c2e1).","level":"기초"},{"id":"git-016","category":"git","title":"git switch 브랜치 전환 (최신 권장)","subtitle":"checkout 대신 브랜치 이동 전용 모던 명령어","code":"# 기존 브랜치로 전환\ngit switch feature/login\n\n# 새로운 브랜치를 생성하면서 즉시 이동 (-c)\ngit switch -c feature/payment\n\n# 이전 브랜치로 되돌아가기\ngit switch -","description":"Git 2.23부터 브랜치 이동은 checkout 대신 직관적인 switch 명령어를 공식 권장합니다.","tags":["switch","브랜치이동","최신"],"outputExample":"Switched to a new branch 'feature/payment'","level":"기초"},{"id":"git-017","category":"git","title":"git merge 브랜치 병합","subtitle":"다른 브랜치의 작업 내용을 현재 브랜치로 통합","code":"# main 브랜치로 이동 후 feature 브랜치 병합\ngit switch main\ngit merge feature/login\n\n# Fast-forward 방지하고 항상 머지 커밋 남기기 (--no-ff)\ngit merge --no-ff feature/login\n\n# 병합 중 충돌 발생 시 취소하고 이전 상태로 복구\ngit merge --abort","description":"--no-ff 옵션은 브랜치가 분기되어 작업되었다는 히스토리 그래프를 명확히 남깁니다.","tags":["merge","병합","충돌"],"outputExample":"Merge made by the 'ort' strategy.","level":"실무필수"},{"id":"git-018","category":"git","title":"git stash 변경 사항 임시 저장","subtitle":"커밋하지 않은 미완성 코드를 임시 보관소에 보관","code":"# 1. 작업 중인 내용 메시지와 함께 임시 저장\ngit stash save \"작업 중이던 로그인 UI\"\n\n# 2. 임시 저장 목록 확인\ngit stash list\n\n# 3. 가장 최근 저장본 꺼내어 적용하고 보관소에서 제거 (pop)\ngit stash pop\n\n# 4. 저장본 적용만 하고 stash 목록에는 유지 (apply)\ngit stash apply stash@{0}","description":"급하게 다른 브랜치로 전환해 핫픽스를 해야 할 때 미완성 작업을 안전하게 보관합니다.","tags":["stash","임시저장","pop"],"outputExample":"Saved working directory and index state WIP on main","level":"실무필수"},{"id":"git-019","category":"git","title":"git log 커밋 히스토리 및 그래프 조회","subtitle":"한 줄 요약과 터미널 아스키 그래프 시각화","code":"# 한 줄 요약 커밋 로그\ngit log --oneline\n\n# 모든 브랜치와 태그를 포함한 컬러 아스키 그래프 (실무 꿀팁!)\ngit log --oneline --graph --all --decorate\n\n# 최근 5개 커밋만 확인\ngit log -n 5","description":"복잡하게 얽힌 브랜치 머지와 분기 흐름을 터미널에서 한눈에 직관적으로 파악합니다.","tags":["log","히스토리","그래프"],"outputExample":"* 4a7c2e1 (HEAD -> main) feat: 로그인 API 연동","level":"기초"},{"id":"git-020","category":"git","title":"git reset 커밋 되돌리기 (soft / mixed / hard)","subtitle":"과거 커밋 시점으로 HEAD 이동","code":"# 1. Soft Reset: 커밋만 취소, 작성 코드는 Staged 상태 유지\ngit reset --soft HEAD~1\n\n# 2. Mixed Reset (기본값): 커밋과 스테이징 취소, 코드는 작업 디렉토리에 유지\ngit reset HEAD~1\n\n# 3. Hard Reset [주의!]: 커밋과 작성 코드 완전 삭제\ngit reset --hard HEAD~1","description":"로컬에서 방금 한 실수를 되돌릴 때 사용하며, 원격에 이미 푸시된 커밋은 revert를 권장합니다.","tags":["reset","되돌리기","주의"],"outputExample":"HEAD is now at 3b8e21a docs: README 업데이트","level":"중급"},{"id":"git-021","category":"git","title":"git revert 안전한 커밋 취소","subtitle":"협업 시 히스토리를 보존하며 취소 커밋 생성","code":"# 직전 커밋(HEAD)을 상쇄하는 새로운 취소 커밋 생성\ngit revert HEAD\n\n# 특정 커밋 해시 취소\ngit revert a1b2c3d\n\n# 충돌 해결 후 계속 진행\ngit revert --continue","description":"공용 브랜치에 이미 push된 커밋은 히스토리를 덮어쓰지 않는 revert로 취소하는 것이 원칙입니다.","tags":["revert","협업","안전","취소"],"outputExample":"[main 8e1d2c] Revert \"feat: 결제 로직 수정\"","level":"실무필수"},{"id":"git-022","category":"git","title":"git restore 파일 복원 (최신 권장)","subtitle":"수정된 파일 원복 및 언스테이징 전용 명령어","code":"# 1. 작업 디렉토리의 파일 수정을 최신 커밋 상태로 원복\ngit restore src/App.tsx\n\n# 2. 스테이징(add)된 파일을 다시 언스테이징\ngit restore --staged index.html\n\n# 3. 모든 변경 파일 일괄 원복 (주의!)\ngit restore .","description":"과거 checkout -- file 대신 파일 복구만을 명확히 담당하는 직관적인 모던 명령어입니다.","tags":["restore","복원","언스테이징"],"outputExample":"App.tsx restored to HEAD version","level":"기초"},{"id":"git-023","category":"git","title":"git clean 추적되지 않는 파일 청소","subtitle":"빌드 생성물이나 임시 파일 일괄 정리","code":"# 1. 삭제될 대상 파일 미리보기 (-n)\ngit clean -dn\n\n# 2. 추적되지 않는 파일 및 디렉토리 강제 삭제 (-fd)\ngit clean -fd\n\n# .gitignore된 파일까지 포함해서 삭제 (-x)\ngit clean -fdx","description":"빌드 캐시나 임시 로그 등 불필요한 파일을 깨끗하게 초기화할 때 사용합니다.","tags":["clean","청소","정리"],"outputExample":"Removing build/temp.log","level":"실무필수"},{"id":"git-024","category":"git","title":"git remote 원격 저장소 관리","subtitle":"GitHub 원격 저장소 주소 연결 및 확인","code":"# 등록된 원격 저장소 목록 및 URL 확인\ngit remote -v\n\n# 원격 저장소 추가 (보통 이름은 origin)\ngit remote add origin https://github.com/user/repo.git\n\n# 원격 저장소 주소 변경 (URL 이전 시)\ngit remote set-url origin https://github.com/user/new-repo.git","description":"로컬 프로젝트를 GitHub에 최초 연동하거나 주소가 변경되었을 때 관리합니다.","tags":["remote","origin","원격저장소"],"outputExample":"origin  https://github.com/user/repo.git (fetch)","level":"기초"},{"id":"git-025","category":"git","title":"git cherry-pick 특정 커밋만 선별 적용","subtitle":"다른 브랜치에서 원하는 커밋 1~2개만 내 브랜치로 복사","code":"# 특정 커밋 해시만 가져와 적용\ngit cherry-pick 7f3b2a1\n\n# 충돌 해결 후 계속 진행\ngit cherry-pick --continue\n\n# 체리픽 취소하고 원래 상태로 복구\ngit cherry-pick --abort","description":"다른 브랜치 전체를 머지하지 않고 핵심 버그 픽이나 긴급 핫픽스 커밋만 가져옵니다.","tags":["cherry-pick","커밋복사","고급"],"outputExample":"[main 9b12fe] feat: 핵심 핫픽스 반영","level":"중급"},{"id":"git-026","category":"git","title":"git rebase 브랜치 기반 재설정","subtitle":"머지 커밋 없이 직선(Linear) 커밋 히스토리 생성","code":"# feature 브랜치에서 main의 최신 내용을 밑바탕에 다시 깔기\ngit switch feature/login\ngit rebase main\n\n# 충돌 해결 후 계속 진행\ngit add .\ngit rebase --continue\n\n# 리베이스 취소\ngit rebase --abort","description":"불필요한 머지 커밋을 방지하여 깔끔한 일직선 히스토리를 유지합니다.","tags":["rebase","리베이스","히스토리"],"outputExample":"Successfully rebased and updated refs/heads/feature/login.","level":"중급"},{"id":"git-027","category":"git","title":"git rebase -i 대화형 커밋 정리 (Squash)","subtitle":"자잘한 여러 커밋들을 하나로 합치거나 메시지 수정","code":"# 최근 3개의 커밋을 대화형으로 정리\ngit rebase -i HEAD~3\n\n# 에디터에서 첫 번째 커밋은 'pick', 나머지는 'squash(s)'로 변경 후 저장!","description":"PR(Pull Request)을 올리기 전 \"오타 수정\", \"테스트 1\" 등의 임시 커밋들을 깔끔하게 하나로 압축합니다.","tags":["rebase","squash","커밋정리"],"outputExample":"3 commits squashed into 1 clean commit","level":"실무필수"},{"id":"git-028","category":"git","title":"git tag 릴리즈 버전 태그 관리","subtitle":"v1.0.0 등 특정 배포 시점에 영구 버전 라벨 부착","code":"# 1. 주석 달린(Annotated) 태그 생성 (권장)\ngit tag -a v1.0.0 -m \"Release version 1.0.0 배포\"\n\n# 2. 태그 목록 확인\ngit tag\n\n# 3. 원격 저장소에 태그 푸시\ngit push origin v1.0.0\n# 모든 로컬 태그 일괄 푸시: git push origin --tags","description":"GitHub Release 페이지와 연동되어 배포 아카이브를 자동으로 생성합니다.","tags":["tag","태그","릴리즈","배포"],"outputExample":"v1.0.0 생성 및 푸시 완료","level":"실무필수"},{"id":"git-029","category":"git","title":"git reflog 유실된 커밋과 브랜치 부활","subtitle":"HEAD의 모든 이동 기록을 추적하여 삭제된 커밋 복구","code":"# HEAD의 모든 과거 이동 기록 확인 (reset --hard 한 것도 다 남음!)\ngit reflog\n\n# 삭제 전 시점(예: HEAD@{2})으로 강제 복구\ngit reset --hard HEAD@{2}","description":"git reset --hard로 실수로 코드를 날렸을 때도 reflog를 통해 100% 되살려낼 수 있습니다.","tags":["reflog","복구","긴급구조","실무필수"],"outputExample":"9c4d12f HEAD@{0}: reset: moving to HEAD@{2}","level":"실무필수"},{"id":"git-030","category":"git","title":"git blame 코드 작성자 및 커밋 추적","subtitle":"특정 파일의 각 라인을 누가 언제 왜 수정했는지 확인","code":"# 파일 전체 작성자 확인\ngit blame src/App.tsx\n\n# 10번째 줄부터 25번째 줄까지만 확인\ngit blame -L 10,25 src/App.tsx","description":"버그가 발생한 코드가 어떤 커밋에서 왜 작성되었는지 맥락을 파악할 때 유용합니다.","tags":["blame","추적","감사"],"outputExample":"4a7c2e1 (홍길동 2026-10-15 14:00:00 +0900 12) const api = \"/users\";","level":"실무필수"},{"id":"git-031","category":"git","title":"git bisect 버그 발생 커밋 이진 탐색","subtitle":"수백 개의 커밋 중 버그가 유입된 최초 커밋 자동 색출","code":"# 이진 탐색 시작\ngit bisect start\ngit bisect bad                 # 현재 커밋은 버그 있음\ngit bisect good v1.0.0         # v1.0.0 정상 작동했음\n\n# 깃이 중간 커밋으로 이동시켜줌 -> 테스트 후 good 또는 bad 입력\n# 완료 후 원래 브랜치 복귀:\ngit bisect reset","description":"수동으로 수십 개를 확인할 필요 없이 이진 탐색(O(log N))으로 버그 원인을 정확히 찾아냅니다.","tags":["bisect","이진탐색","디버깅","고급"],"outputExample":"4a7c2e1 is the first bad commit","level":"중급"},{"id":"git-032","category":"git","title":"git worktree 다중 브랜치 동시 작업 공간","subtitle":"브랜치 전환 없이 별도 폴더에 다른 브랜치를 동시에 띄우기","code":"# ../hotfix-folder 폴더에 hotfix 브랜치 전용 작업 공간 생성\ngit worktree add ../hotfix-folder hotfix\n\n# 워크트리 목록 확인\ngit worktree list\n\n# 작업 완료 후 워크트리 제거\ngit worktree remove ../hotfix-folder","description":"npm run dev를 끄거나 stash할 필요 없이 다른 디렉토리에서 즉시 긴급 버그를 수정합니다.","tags":["worktree","멀티태스킹","고급"],"outputExample":"Preparing worktree (checking out 'hotfix')","level":"중급"},{"id":"git-033","category":"git","title":"git config 사용자 정보 및 에디터 설정","subtitle":"커밋 작성자 이름, 이메일, 기본 에디터 전역 설정","code":"# 전역 사용자 이름 및 이메일 등록\ngit config --global user.name \"홍길동\"\ngit config --global user.email \"dev@example.com\"\n\n# 기본 에디터를 VS Code로 지정\ngit config --global core.editor \"code --wait\"\n\n# 전체 설정 목록 확인\ngit config --list","description":"최초 깃 설치 시 반드시 설정해야 GitHub 프로필에 정상적으로 잔디(커밋)가 심어집니다.","tags":["config","설정","기초"],"outputExample":"user.name=홍길동\\nuser.email=dev@example.com","level":"기초"},{"id":"git-034","category":"git","title":"git config alias 단축 명령어 등록","subtitle":"자주 쓰는 복잡한 명령어를 2~3글자로 단축","code":"# st -> status\ngit config --global alias.st status\n\n# co -> checkout, br -> branch\ngit config --global alias.co checkout\ngit config --global alias.br branch\n\n# lg -> 한 줄 컬러 아스키 그래프\ngit config --global alias.lg \"log --oneline --graph --all --decorate\"","description":"터미널에서 매번 긴 명령어를 칠 필요 없이 git lg, git st 등으로 타이핑 속도를 극대화합니다.","tags":["alias","단축키","생산성"],"outputExample":"git lg 입력 시 그래프 즉시 출력","level":"실무필수"},{"id":"git-035","category":"git","title":"git log -S 코드 내용(문자열) 검색","subtitle":"특정 변수나 함수가 추가/삭제된 커밋 히스토리 추적","code":"# 코드에 'SECRET_API_KEY'가 처음 등장하거나 삭제된 커밋 탐색\ngit log -S \"SECRET_API_KEY\" -p","description":"파일 이름이 아니라 소스 코드 내용의 변화(Pickaxe 검색)를 기준으로 커밋을 색출합니다.","tags":["log","검색","Pickaxe"],"outputExample":"commit 7b1e2c: + const SECRET_API_KEY = \"...\"","level":"중급"},{"id":"git-036","category":"git","title":"git show 커밋 상세 정보 조회","subtitle":"특정 커밋의 변경 내용과 메타데이터 확인","code":"# 가장 최근 커밋(HEAD)의 상세 diff 보기\ngit show\n\n# 특정 커밋 해시의 상세 정보 확인\ngit show 4a7c2e1\n\n# 특정 커밋 시점의 특정 파일 내용만 보기\ngit show 4a7c2e1:src/App.tsx","description":"해당 커밋에서 어떤 파일이 어떻게 변경되었는지 전체 패치를 검토할 때 씁니다.","tags":["show","커밋상세","diff"],"outputExample":"commit 4a7c2e1\\nAuthor: dev\\nDate: ...","level":"기초"},{"id":"git-037","category":"git","title":"git submodule 서브모듈 추가 및 클론","subtitle":"다른 Git 저장소를 내 프로젝트의 하위 폴더로 포함","code":"# 외부 라이브러리 저장소를 lib/core 폴더로 서브모듈 추가\ngit submodule add https://github.com/lib/core.git lib/core\n\n# 서브모듈이 포함된 프로젝트를 복제할 때 하위 저장소까지 일괄 초기화\ngit clone --recurse-submodules https://github.com/user/project.git\n\n# 기존 클론에서 서브모듈 업데이트\ngit submodule update --init --recursive","description":"공통 모듈이나 디자인 시스템을 별도 저장소로 관리하면서 상위 프로젝트에 임베드합니다.","tags":["submodule","서브모듈","의존성"],"outputExample":"Submodule 'lib/core' registered and cloned","level":"중급"},{"id":"git-038","category":"git","title":"git archive 소스 코드 ZIP 압축 배포","subtitle":".git 히스토리를 제외하고 순수 소스 파일만 압축 추출","code":"# main 브랜치의 순수 소스 코드만 project-v1.0.zip으로 압축\ngit archive --format=zip --output=project-v1.0.zip main","description":"빌드 산출물이나 버전 관리 메타데이터(.git)를 제외하고 배포용 순수 소스 릴리즈를 생성합니다.","tags":["archive","zip","배포"],"outputExample":"project-v1.0.zip 아카이브 생성 완료","level":"실무필수"},{"id":"git-039","category":"git","title":".gitignore 작성 규칙과 캐시 삭제","subtitle":"node_modules, .env 등 추적 제외 파일 지정","code":"# .gitignore 파일 예시\n# node_modules/\n# *.log\n# .env\n# dist/\n\n# 이미 커밋되어 버린 .env 파일 추적만 제거 (로컬 파일은 유지)\ngit rm --cached .env\ngit commit -m \"chore: .env 파일 깃 추적 해제\"","description":"비밀 키(.env)나 무거운 의존성 폴더가 GitHub에 실수로 올라가지 않도록 방지합니다.","tags":["gitignore","보안","캐시제거"],"outputExample":"rm '.env' (untracked from git index)","level":"기초"},{"id":"git-040","category":"git","title":"SSH 키 생성 및 GitHub 등록","subtitle":"비밀번호 없이 안전한 SSH 인증 연동","code":"# 1. ed25519 알고리즘 SSH 키 생성\nssh-keygen -t ed25519 -C \"your_email@example.com\"\n\n# 2. 공개 키(Public Key) 내용 복사하여 GitHub Settings > SSH Keys에 등록\ncat ~/.ssh/id_ed25519.pub\n\n# 3. 연결 테스트\nssh -T git@github.com","description":"토큰 만료나 매번 비밀번호를 칠 필요 없이 안전하고 영구적인 SSH 키 인증을 구성합니다.","tags":["ssh","보안","인증","github"],"outputExample":"Hi username! You've successfully authenticated.","level":"실무필수"},{"id":"git-041","category":"git","title":"gh pr create (GitHub CLI PR 생성)","subtitle":"웹 브라우저를 열지 않고 터미널에서 즉시 Pull Request 생성","code":"# 대화형 모드로 타이틀과 본문 입력하며 PR 생성\ngh pr create --title \"feat: 결제 모듈 연동\" --body \"카카오페이 연동 완료\"\n\n# 웹 브라우저에서 PR 작성 화면 바로 열기 (-w)\ngh pr create -w","description":"GitHub 공식 CLI(`gh`)를 사용해 터미널을 벗어나지 않고 신속하게 PR을 오픈합니다.","tags":["gh","cli","pr","github"],"outputExample":"https://github.com/user/repo/pull/42","level":"실무필수"},{"id":"git-042","category":"git","title":"gh pr checkout (GitHub CLI 타인 PR 로컬 테스트)","subtitle":"PR 번호만으로 해당 브랜치를 로컬로 즉시 체크아웃","code":"# PR #42번의 브랜치를 로컬로 즉시 내려받아 테스트 환경 구성\ngh pr checkout 42","description":"동료가 올린 PR 코드를 로컬에서 빌드 및 테스트해보고 코드 리뷰할 때 매우 편리합니다.","tags":["gh","cli","pr","코드리뷰"],"outputExample":"Switched to branch 'pr-42-branch'","level":"실무필수"},{"id":"git-043","category":"git","title":"gh issue list & create (GitHub 이슈 제어)","subtitle":"터미널에서 이슈 목록 확인 및 새 이슈 등록","code":"# 열려있는 이슈 목록 확인\ngh issue list\n\n# 새 버그 리포트 이슈 생성\ngh issue create --title \"로그인 시 500 에러\" --body \"재현 경로: ...\"","description":"터미널 상에서 프로젝트의 태스크와 버그 트래커 이슈를 직접 조회하고 생성합니다.","tags":["gh","cli","issue","github"],"outputExample":"#12 로그인 시 500 에러 (https://github.com/...)","level":"실무필수"},{"id":"git-044","category":"git","title":"gh repo clone (GitHub CLI 간편 복제)","subtitle":"URL 대신 소유자/저장소명만으로 즉시 클론","code":"# 긴 URL 필요 없이 owner/repo 형태로 즉시 복제\ngh repo clone facebook/react","description":"GitHub CLI를 통해 HTTPS/SSH 주소 복사 없이 저장소를 복제합니다.","tags":["gh","cli","clone"],"outputExample":"Cloning into 'react'...","level":"기초"},{"id":"git-045","category":"git","title":"git prune & fetch --prune 원격 삭제 브랜치 정리","subtitle":"원격에서 이미 삭제된 브랜치 로컬 잔여 추적 참조 청소","code":"# 원격 저장소에서 이미 삭제된 브랜치 정보들을 로컬에서도 일괄 삭제\ngit fetch origin --prune\n\n# 고아 객체 정리\ngit prune","description":"GitHub에서 PR 머지 후 브랜치를 지웠을 때 로컬의 `origin/브랜치` 찌꺼기를 말끔히 청소합니다.","tags":["prune","정리","브랜치"],"outputExample":"x [deleted] (none) -> origin/feature-done","level":"실무필수"},{"id":"git-046","category":"git","title":"git gc (Garbage Collection) 저장소 압축 최적화","subtitle":"저장소 크기 축소 및 Git 실행 속도 최적화","code":"# 불필요한 객체 청소 및 팩파일 압축 최적화\ngit gc --prune=now --aggressive","description":"오래된 대형 리포지토리의 .git 폴더 용량을 압축하고 파일 접근 속도를 향상시킵니다.","tags":["gc","최적화","용량절약"],"outputExample":"Counting objects: 100%, done. Delta compression using up to 8 threads.","level":"중급"},{"id":"git-047","category":"git","title":"git branch --merged 머지 완료 브랜치 일괄 삭제","subtitle":"main에 이미 병합된 불필요한 브랜치 원클릭 제거","code":"# main에 머지 완료된 브랜치 목록 확인\ngit branch --merged main\n\n# 머지 완료된 브랜치 일괄 삭제 (Linux/Mac)\n# git branch --merged main | grep -v \"main\" | xargs -n 1 git branch -d","description":"수십 개 쌓인 완료된 피처 브랜치들을 안전하고 빠르게 일괄 정리합니다.","tags":["branch","merged","정리","일괄삭제"],"outputExample":"Deleted merged branches","level":"실무필수"},{"id":"git-048","category":"git","title":"git patch 생성 및 적용 (format-patch / am)","subtitle":"네트워크 연결 없이 이메일이나 파일로 커밋 전달","code":"# 1. 최근 1개 커밋을 .patch 파일로 추출\ngit format-patch -1 HEAD\n\n# 2. 다른 저장소에서 패치 파일 적용\ngit am < 0001-feat-login.patch","description":"오픈소스 프로젝트나 오프라인 환경에서 코드 변경점을 메일이나 파일로 전달할 때 쓰입니다.","tags":["patch","format-patch","배포"],"outputExample":"Applying: feat: login","level":"중급"},{"id":"git-049","category":"git","title":"git bundle 저장소 오프라인 단일 파일 백업","subtitle":"인터넷 없이 USB로 전체 브랜치와 커밋 전달","code":"# main 브랜치 전체를 repo.bundle 단일 파일로 묶기\ngit bundle create repo.bundle main\n\n# 번들 파일로부터 복제하기\ngit clone repo.bundle my-repo","description":"망분리 환경이나 폐쇄망 서버에 Git 저장소를 그대로 반입/반출할 때 최적의 솔루션입니다.","tags":["bundle","백업","오프라인"],"outputExample":"repo.bundle created successfully","level":"중급"},{"id":"git-050","category":"git","title":"git commit -S GPG 서명 커밋","subtitle":"GitHub에 \"Verified\" 초록 인증 뱃지 표시","code":"# GPG 키로 커밋 위변조 방지 디지털 서명 (-S)\ngit commit -S -m \"feat: 보안 인증 서명 커밋\"\n\n# 항상 모든 커밋에 자동 서명하도록 설정\ngit config --global commit.gpgsign true","description":"커밋 작성자가 본인이 맞음을 암호학적으로 증명하여 기업 보안 규정을 준수합니다.","tags":["gpg","서명","보안","verified"],"outputExample":"[Verified] badge on GitHub","level":"실무필수"},{"id":"git-051","category":"git","title":"git update-index --assume-unchanged 로컬 변경 무시","subtitle":"로컬 설정 파일 수정 내용을 Git이 감지하지 않도록 임시 차단","code":"# 특정 설정 파일의 로컬 수정을 Git 추적에서 임시 제외\ngit update-index --assume-unchanged config/local.json\n\n# 다시 추적 복원하기\ngit update-index --no-assume-unchanged config/local.json","description":".gitignore에 등록할 수 없는 공용 설정 파일에서 나만의 로컬 테스트 값을 임시 유지할 때 유용합니다.","tags":["update-index","assume-unchanged","설정"],"outputExample":"File modification ignored locally","level":"중급"},{"id":"git-052","category":"git","title":"git log --stat 파일별 변경 줄 수 통계","subtitle":"어떤 파일에서 몇 줄이 추가되고 삭제되었는지 요약","code":"# 최근 커밋의 파일별 수정 줄 수 요약 (+ / - 통계)\ngit log --stat -n 3","description":"커밋의 규모(작업량)를 파일 목록과 함께 한눈에 수치로 파악합니다.","tags":["log","stat","통계"],"outputExample":"app.py | 12 +++++++++---\\n1 file changed, 9 insertions(+)","level":"기초"},{"id":"git-053","category":"git","title":"git shortlog 작성자별 커밋 수 집계","subtitle":"프로젝트 기여자별 기여도 요약 리포트","code":"# 작성자별 총 커밋 수 내림차순 정렬 (-sn)\ngit shortlog -sn --all","description":"프로젝트 릴리즈 노트 작성이나 팀원별 기여 커밋 수를 확인할 때 편리합니다.","tags":["shortlog","통계","기여자"],"outputExample":"142 홍길동\\n 89 이순신\\n 23 김유신","level":"기초"},{"id":"git-054","category":"git","title":"git rev-parse HEAD 해시 및 루트 경로 확인","subtitle":"스크립트 자동화 시 현재 커밋 해시 추출","code":"# 현재 체크아웃된 커밋의 40자리 풀 해시값 출력\ngit rev-parse HEAD\n\n# 7자리 단축 해시값 출력\ngit rev-parse --short HEAD\n\n# Git 저장소의 최상위 루트 절대 경로 출력\ngit rev-parse --show-toplevel","description":"CI/CD 빌드 스크립트나 도커 이미지 태그에 커밋 해시를 주입할 때 사용합니다.","tags":["rev-parse","해시","자동화"],"outputExample":"4a7c2e1","level":"실무필수"},{"id":"git-055","category":"git","title":"git checkout tags/v1.0.0 특정 태그 시점으로 이동","subtitle":"과거 배포 릴리즈 버전의 코드 상태 재현","code":"# v1.0.0 태그 시점으로 소스 코드 체크아웃 (Detached HEAD 상태)\ngit checkout tags/v1.0.0\n\n# 해당 태그를 기반으로 새 수정 브랜치 분기\ngit switch -c fix/v1.0.0-patch tags/v1.0.0","description":"특정 릴리즈 버전에서 발생한 버그를 정확한 해당 시점 코드로 재현하고 디버깅합니다.","tags":["checkout","tag","릴리즈"],"outputExample":"HEAD is now at tags/v1.0.0","level":"기초"},{"id":"git-056","category":"git","title":"git push origin :branch_name 원격 브랜치 삭제","subtitle":"콜론(:) 문법을 이용한 원격 브랜치 제거","code":"# 원격 저장소 origin의 feature/old 브랜치 삭제\ngit push origin :feature/old\n# (동일 명령어: git push origin --delete feature/old)","description":"로컬의 빈(empty) 브랜치를 원격 브랜치에 푸시함으로써 원격 브랜치를 삭제하는 전통적인 Git 기법입니다.","tags":["push","삭제","원격"],"outputExample":"- [deleted] feature/old","level":"기초"},{"id":"git-057","category":"git","title":"git commit --fixup과 auto-squash","subtitle":"특정 과거 커밋을 지정하여 리베이스 시 자동 병합","code":"# 대상 커밋(4a7c2e1)을 타겟으로 fixup 커밋 생성\ngit commit --fixup 4a7c2e1\n\n# 자동 스쿼시 리베이스 실행\ngit rebase -i --autosquash 4a7c2e1~1","description":"코드 리뷰 피드백 반영 시 대상 커밋에 자동으로 병합되도록 세팅하여 커밋 정리를 자동화합니다.","tags":["fixup","autosquash","rebase"],"outputExample":"Automatically reordered and squashed into 4a7c2e1","level":"중급"},{"id":"git-058","category":"git","title":"git rm --cached 실수로 올린 파일 인덱스에서만 삭제","subtitle":"로컬 파일은 그대로 두고 Git 버전 추적만 해제","code":"# 파일은 하드디스크에 그대로 유지하고 Git 추적 목록에서만 제거\ngit rm --cached credentials.json\ngit commit -m \"chore: credentials.json 추적 해제\"","description":"git rm은 파일까지 지워버리지만 --cached 옵션을 주면 디스크의 원본 파일은 안전하게 보존됩니다.","tags":["rm","cached","보안"],"outputExample":"rm 'credentials.json'","level":"기초"},{"id":"git-059","category":"git","title":"git merge-base 공통 조상 커밋 찾기","subtitle":"두 브랜치가 갈라져 나온 최초의 분기점 커밋 확인","code":"# main과 feature 브랜치의 공통 조상 커밋 해시 확인\ngit merge-base main feature/login","description":"브랜치 병합 충돌이나 변경 범위를 계산할 때 Git 내부 알고리즘이 기준점으로 삼는 커밋입니다.","tags":["merge-base","조상","충돌분석"],"outputExample":"3b8e21a4f...","level":"중급"},{"id":"git-060","category":"git","title":"git cherry-pick -n (no-commit)","subtitle":"커밋을 생성하지 않고 코드 변경점만 스테이징에 반영","code":"# 커밋 생성 없이 코드 수정사항만 가져와서 스테이징에 올리기\ngit cherry-pick -n 7f3b2a1","description":"가져온 코드에 내 추가 수정을 더해서 하나의 단일 커밋으로 묶고 싶을 때 사용합니다.","tags":["cherry-pick","no-commit"],"outputExample":"Changes staged for commit without creating a commit","level":"중급"},{"id":"git-061","category":"git","title":"GitHub Actions 워크플로우 기본 구조 (.github/workflows)","subtitle":"CI/CD 자동 빌드 및 테스트 자동화 스크립트","code":"# .github/workflows/ci.yml 예시\nname: CI\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n      - run: npm install\n      - run: npm test","description":"main 브랜치에 푸시되거나 PR이 생성될 때 자동으로 테스트와 빌드를 실행합니다.","tags":["github-actions","ci-cd","자동화"],"outputExample":"All checks have passed","level":"실무필수"},{"id":"git-062","category":"git","title":"gh auth login (GitHub CLI 인증)","subtitle":"터미널에서 웹 브라우저 기반 One-click 로그인","code":"# 터미널에서 대화형으로 GitHub 계정 로그인\ngh auth login","description":"퍼스널 액세스 토큰(PAT)을 직접 복사할 필요 없이 브라우저 인증으로 손쉽게 CLI를 연동합니다.","tags":["gh","cli","인증"],"outputExample":"Logged in to github.com as username","level":"기초"},{"id":"git-063","category":"git","title":"git log --author 특정 작성자의 커밋만 필터링","subtitle":"내가 작성한 커밋만 모아서 보고서 작성","code":"# 작성자 이름이나 이메일로 필터링\ngit log --author=\"홍길동\" --oneline","description":"주간 업무 보고서나 본인의 기여 내역을 확인할 때 내 커밋만 쏙 골라냅니다.","tags":["log","author","필터링"],"outputExample":"4a7c2e1 feat: 로그인 구현\\n9c4d12f fix: 버그 수정","level":"기초"},{"id":"git-064","category":"git","title":"git log --since / --until 기간별 커밋 조회","subtitle":"특정 날짜 범위의 변경 히스토리 추출","code":"# 최근 2주간의 커밋만 보기\ngit log --since=\"2 weeks ago\" --oneline\n\n# 2026-10-01부터 2026-10-20 사이의 커밋 보기\ngit log --since=\"2026-10-01\" --until=\"2026-10-20\"","description":"릴리즈 기간이나 스프린트 기간 동안의 전체 작업 내역을 추출합니다.","tags":["log","since","기간검색"],"outputExample":"Filtered commits within date range","level":"기초"},{"id":"git-065","category":"git","title":"git describe 커밋의 버전 태그 상대 거리 표시","subtitle":"가장 최근 태그 + 이후 커밋 수 + 단축 해시값 조합","code":"# 현재 커밋의 가장 가까운 태그 기반 버전 문자열 출력\ngit describe --tags","description":"소프트웨어 빌드 번호(예: v1.0.0-4-g4a7c2e1)를 자동 생성할 때 사용되는 핵심 명령어입니다.","tags":["describe","버전","태그"],"outputExample":"v1.0.0-4-g4a7c2e1","level":"실무필수"},{"id":"git-066","category":"git","title":"git filter-repo 비밀번호 및 대용량 파일 히스토리 영구 제거","subtitle":"커밋 히스토리 전체에서 유출된 민감 정보나 100MB+ 파일 완전 삭제","code":"# 1. 비밀번호나 API 키가 포함된 특정 파일 전체 커밋에서 영구 삭제\ngit filter-repo --path secret_keys.env --invert-paths\n\n# 2. 50MB 이상의 모든 대용량 파일 히스토리에서 일괄 제거\ngit filter-repo --strip-blobs-bigger-than 50M\n\n# 3. 변경 후 원격 저장소에 강제 푸시 (모든 팀원 공지 필수)\ngit push origin --force --all","description":"구형 filter-branch나 BFG Repo-Cleaner보다 수십 배 빠르고 공식 권장되는 최신 저장소 정제 도구입니다.","tags":["filter-repo","보안","대용량파일","히스토리삭제"],"outputExample":"Filtered 150 commits in 1.2 seconds","level":"고급"},{"id":"git-067","category":"git","title":"git rerere (Reuse Recorded Resolution) 동일 충돌 자동 해결","subtitle":"반복되는 장기 브랜치 머지 충돌 해결 방법을 기억하여 자동 적용","code":"# 1. rerere 전역 활성화 (필수 권장)\ngit config --global rerere.enabled true\n\n# 2. 머지/리베이스 중 충돌 발생 시 최초 1회 수동 해결 후 커밋\n# -> Git이 충돌 전후 형상을 .git/rr-cache에 자동 기록\n\n# 3. 이후 동일한 충돌이 다시 발생하면 자동으로 사전 기록된 해결책 적용\n# \"Resolved 'src/App.tsx' using previous resolution.\"","description":"여러 번 rebase하거나 여러 브랜치를 유지보수할 때 동일한 충돌을 두 번 다시 수동으로 풀지 않도록 해주는 강력한 기능입니다.","tags":["rerere","충돌해결","rebase","자동화"],"outputExample":"Resolved 'src/App.tsx' using previous resolution.","level":"고급"},{"id":"git-068","category":"git","title":"git sparse-checkout 모노레포 부분 디렉토리만 체크아웃","subtitle":"수십 GB 규모의 거대 모노레포에서 내가 작업할 특정 폴더만 로컬에 복제","code":"# 1. 블롭 없는 부분 클론 (다운로드 용량 최소화)\ngit clone --filter=blob:none --no-checkout https://github.com/org/huge-monorepo.git\ncd huge-monorepo\n\n# 2. sparse-checkout 활성화\ngit sparse-checkout init --cone\n\n# 3. 내가 작업할 폴더만 지정하여 체크아웃\ngit sparse-checkout set services/payment-api shared/types\ngit checkout main","description":"엔터프라이즈 모노레포 환경에서 디스크 공간을 기가바이트 단위로 절약하고 git status 속도를 10배 이상 향상시킵니다.","tags":["sparse-checkout","모노레포","대용량저장소","성능"],"outputExample":"sparse-checkout: 2 directories updated","level":"고급"},{"id":"git-069","category":"git","title":"git subtree 독립 저장소 양방향 동기화 및 분할","subtitle":"서브모듈의 복잡한 포인터 분리 없이 일반 폴더처럼 다루며 양방향 동기화","code":"# 1. 외부 라이브러리 저장소를 특정 폴더(lib/shared)로 추가\ngit subtree add --prefix=lib/shared https://github.com/org/shared-utils.git main --squash\n\n# 2. 로컬에서 수정한 내용을 원격 서브트리 저장소로 역푸시\ngit subtree push --prefix=lib/shared https://github.com/org/shared-utils.git main\n\n# 3. 원격 서브트리의 최신 변경 사항 로컬로 당겨오기\ngit subtree pull --prefix=lib/shared https://github.com/org/shared-utils.git main --squash","description":"submodule과 달리 다른 팀원이 git clone할 때 별도의 submodule init/update 없이 즉시 코드를 사용할 수 있습니다.","tags":["subtree","서브트리","모듈화","모노레포"],"outputExample":"git subtree pull successful","level":"고급"},{"id":"git-070","category":"git","title":"git 커스텀 훅: pre-commit 린트 및 코드 포맷팅 강제","subtitle":"커밋 직전 ESLint, Ruff, Black 검사를 실행하여 오류 시 커밋 차단","code":"#!/bin/sh\n# 파일 위치: .git/hooks/pre-commit (실행 권한: chmod +x .git/hooks/pre-commit)\n\necho \"🔍 커밋 전 자동 린트 및 포맷 검사 실행 중...\"\nnpm run lint --silent\nif [ $? -ne 0 ]; then\n    echo \"❌ 린트 에러가 발생했습니다! 코드를 수정한 뒤 다시 커밋하세요.\"\n    exit 1\nfi\necho \"✅ 린트 검사 통과!\"\nexit 0","description":"팀 내 코드 스타일 불일치나 문법 에러가 깃 저장소에 들어가는 것을 원천 봉쇄하는 개발 문화의 필수 자동화 스크립트입니다.","tags":["hook","pre-commit","린트","자동화","전문가"],"outputExample":"🔍 커밋 전 자동 린트 검사 통과!","level":"전문가"},{"id":"git-071","category":"git","title":"git 커스텀 훅: commit-msg Conventional Commits 검증","subtitle":"feat:, fix:, docs:, refactor: 등 팀 커밋 컨벤션 정규식 검증","code":"#!/bin/sh\n# 파일 위치: .git/hooks/commit-msg (chmod +x .git/hooks/commit-msg)\n\nCOMMIT_MSG_FILE=$1\nCOMMIT_MSG=$(head -n 1 \"$COMMIT_MSG_FILE\")\n\n# Conventional Commit 패턴 검사\nPATTERN=\"^(feat|fix|docs|style|refactor|test|chore)(\\(.+\\))?: .+\"\n\nif ! echo \"$COMMIT_MSG\" | grep -Eq \"$PATTERN\"; then\n    echo \"❌ 올바르지 않은 커밋 메시지 형식입니다!\"\n    echo \"형식 예시: feat: 검색 필터 추가 / fix(ui): 버튼 깨짐 수정\"\n    exit 1\nfi","description":"팀원들의 커밋 메시지 형식을 일관되게 강제하여 시맨틱 릴리즈(semantic-release)나 자동 변경 로그 생성을 가능하게 합니다.","tags":["hook","commit-msg","컨벤션","전문가"],"outputExample":"❌ 올바르지 않은 커밋 메시지 형식입니다!","level":"전문가"},{"id":"git-072","category":"git","title":"git 커스텀 훅: prepare-commit-msg JIRA 이슈 키 자동 주입","subtitle":"브랜치명(feature/PROJ-1234-login)에서 티켓 번호를 추출하여 커밋 메시지에 자동 삽입","code":"#!/bin/sh\n# 파일 위치: .git/hooks/prepare-commit-msg (chmod +x)\nCOMMIT_MSG_FILE=$1\nBRANCH_NAME=$(git branch --show-current)\n\n# 브랜치명에서 PROJ-1234 형태의 티켓 번호 추출\nTICKET=$(echo \"$BRANCH_NAME\" | grep -Eo '[A-Z]+-[0-9]+')\n\nif [ -n \"$TICKET\" ]; then\n    CURRENT_MSG=$(cat \"$COMMIT_MSG_FILE\")\n    # 이미 티켓 번호가 없는 경우 접두어로 자동 추가\n    if ! echo \"$CURRENT_MSG\" | grep -q \"$TICKET\"; then\n        echo \"[$TICKET] $CURRENT_MSG\" > \"$COMMIT_MSG_FILE\"\n    fi\nfi","description":"매번 커밋 메시지에 수동으로 [PROJ-123]을 타이핑할 필요 없이 브랜치 이름에 기반해 자동으로 접두어를 채워줍니다.","tags":["hook","prepare-commit-msg","JIRA","자동화","전문가"],"outputExample":"[PROJ-1234] feat: 결제 모듈 추가","level":"전문가"},{"id":"git-073","category":"git","title":"git 커스텀 훅: pre-push 메인 브랜치 직접 푸시 원천 차단","subtitle":"main 또는 master 브랜치로의 실수에 의한 직접 푸시 방지","code":"#!/bin/sh\n# 파일 위치: .git/hooks/pre-push (chmod +x)\n\nPROTECTED_BRANCH=\"main\"\nCURRENT_BRANCH=$(git branch --show-current)\n\nif [ \"$CURRENT_BRANCH\" = \"$PROTECTED_BRANCH\" ]; then\n    echo \"🚫 [푸시 차단] $PROTECTED_BRANCH 브랜치로의 직접 푸시는 금지되어 있습니다!\"\n    echo \"👉 별도 작업 브랜치를 만들어 Pull Request(PR)를 생성하세요.\"\n    exit 1\nfi\nexit 0","description":"CI/CD 배포가 물려 있는 프로덕션 메인 브랜치로 주니어 개발자나 본인의 부주의한 git push origin main을 클라이언트 단에서 방어합니다.","tags":["hook","pre-push","브랜치보호","보안","전문가"],"outputExample":"🚫 [푸시 차단] main 브랜치 직접 푸시 금지!","level":"전문가"},{"id":"git-074","category":"git","title":"git 배관(Plumbing): git hash-object 저수준 블롭 생성","subtitle":"문자열이나 파일로부터 Git 내부 SHA-1 해시 계산 및 객체 저장","code":"# 1. 텍스트의 SHA-1 해시값만 계산 (-stdin)\necho \"Hello Git World\" | git hash-object --stdin\n# 출력: e9...\n\n# 2. 실제로 .git/objects/ 디렉토리에 블롭 객체로 영구 저장 (-w)\necho \"중요 데이터\" | git hash-object -w --stdin","description":"Git의 내부 저장소는 순수한 콘텐츠 주소 지정 파일 시스템(Content-Addressable Storage)임을 보여주는 핵심 저수준 배관 명령어입니다.","tags":["plumbing","hash-object","내부구조","전문가"],"outputExample":"e965047ad7c57865823c7d992b1d046ea66edf78","level":"전문가"},{"id":"git-075","category":"git","title":"git 배관: git cat-file -p / -t 객체 원시 데이터 검사","subtitle":"해시값만으로 커밋, 트리, 블롭, 태그의 압축 해제 내용과 타입 확인","code":"# 1. 객체의 타입 확인 (-t -> commit, tree, blob, tag)\ngit cat-file -t HEAD\n\n# 2. 객체의 원시 내용 포맷팅 출력 (-p)\ngit cat-file -p HEAD\n\n# 3. 커밋이 가리키는 트리(Tree) 구조 확인 (디렉토리 목록)\ngit cat-file -p HEAD^{tree}","description":"커밋 객체가 어떻게 트리 객체의 해시를 가리키고, 트리가 다시 파일 블롭(Blob) 해시들을 매핑하는지 시각적으로 검증합니다.","tags":["plumbing","cat-file","객체분석","전문가"],"outputExample":"tree 4b825dc642... author Alex ... committer Alex","level":"전문가"},{"id":"git-076","category":"git","title":"git 배관: git write-tree 인덱스 트리 객체 생성","subtitle":"현재 스테이징 영역(Index) 상태를 트리 해시 객체로 스냅샷","code":"# 현재 git add 된 스테이징 상태를 바탕으로 디렉토리 트리 객체 기록\nTREE_HASH=$(git write-tree)\necho \"생성된 트리 해시: $TREE_HASH\"","description":"git commit 명령어가 내부적으로 실행하는 첫 번째 저수준 단계로, 스테이징된 파일들의 스냅샷 트리를 만듭니다.","tags":["plumbing","write-tree","스냅샷","전문가"],"outputExample":"생성된 트리 해시: 3f5d6a...","level":"전문가"},{"id":"git-077","category":"git","title":"git 배관: git commit-tree 저수준 커밋 생성","subtitle":"트리 해시와 부모 커밋 해시를 결합하여 스크립트로 커밋 제작","code":"# 트리 해시와 이전 부모 커밋(-p)을 연결하여 커밋 객체 생성\nNEW_COMMIT=$(git commit-tree $TREE_HASH -p HEAD -m \"저수준 스크립트 커밋\")\necho \"새 커밋 해시: $NEW_COMMIT\"\n\n# 브랜치 HEAD를 방금 만든 커밋으로 수동 전진\ngit update-ref refs/heads/main $NEW_COMMIT","description":"작업 디렉토리(Working Directory)를 건드리지 않고 백그라운드 데몬이나 스크립트에서 순수하게 커밋을 생성하고 갱신할 수 있습니다.","tags":["plumbing","commit-tree","스크립트","전문가"],"outputExample":"새 커밋 해시: 7a8b9c...","level":"전문가"},{"id":"git-078","category":"git","title":"git rebase --onto 다른 베이스 브랜치로 특정 범위만 이식","subtitle":"잘못된 브랜치에서 파생된 커밋들만 떼어내어 올바른 브랜치 위로 접붙이기","code":"# 상황: feature-B가 master가 아닌 feature-A에서 실수로 브랜칭됨\n# feature-B의 커밋들만 떼어서 master 브랜치 바로 위로 이식\n# 문법: git rebase --onto [새부모] [기존기준] [이동할브랜치]\ngit rebase --onto master feature-A feature-B","description":"브랜치 계층 구조가 꼬였을 때 중간 커밋들을 배제하고 특정 자식 커밋 묶음만 안전하게 새 기저 브랜치로 옮깁니다.","tags":["rebase","--onto","브랜치이식","고급"],"outputExample":"Successfully rebased and updated refs/heads/feature-B","level":"고급"},{"id":"git-079","category":"git","title":"git bisect run <script> 100% 무인 버그 이진 탐색","subtitle":"테스트 스크립트를 지정하여 수백 개 커밋 중 버그 유발 커밋 자동 검거","code":"# 1. 이진 탐색 시작\ngit bisect start\n\n# 2. 현재 상태는 버그 발생(bad), 정상이었던 과거 태그 지정(good)\ngit bisect bad HEAD\ngit bisect good v1.0.0\n\n# 3. 테스트 스크립트 무인 실행 (테스트 실패 시 종료코드 1 -> bad 판정)\ngit bisect run npm test\n# -> Git이 자동으로 절반씩 체크아웃하며 테스트를 돌려 최초 범인 커밋 출력!\n\n# 4. 탐색 종료 후 원래 브랜치 복귀\ngit bisect reset","description":"수동으로 일일이 실행해볼 필요 없이 10초 만에 어느 커밋, 누구의 변경에서 버그가 시작되었는지 무인으로 찾아냅니다.","tags":["bisect","무인테스트","버그추적","전문가"],"outputExample":"42b10f is the first bad commit","level":"전문가"},{"id":"git-080","category":"git","title":"git blame -L 및 -C, -M 코드 이동 및 복사 원본 추적","subtitle":"파일 리팩토링이나 줄 이동에도 굴하지 않고 실제 최초 작성자 추적","code":"# 1. 10번째 줄부터 25번째 줄까지만 조사 (-L 10,25)\ngit blame -L 10,25 src/utils/filter.ts\n\n# 2. 같은 파일 내에서 줄 이동/복사된 경우 원본 추적 (-M)\ngit blame -M src/utils/filter.ts\n\n# 3. 다른 파일에서 코드가 잘라내기/복사되어 온 경우 원본 파일 추적 (-C)\ngit blame -C -C src/utils/filter.ts","description":"단순 blame은 최근 코드 포맷팅이나 파일 분할한 사람의 이름만 나오지만, -C -M 옵션을 주면 진짜 원본 로직 작성자를 찾아줍니다.","tags":["blame","코드추적","리팩토링","히스토리"],"outputExample":"src/old_utils.ts -> src/utils/filter.ts 추적 성공","level":"고급"},{"id":"git-081","category":"git","title":"git maintenance 백그라운드 자동 저장소 최적화 데몬","subtitle":"commit-graph 갱신 및 백그라운드 프리페치로 초대형 저장소 가속","code":"# 1. 현재 저장소에 대한 백그라운드 유지보수 스케줄 등록\ngit maintenance start\n\n# 2. 등록된 백그라운드 작업 즉시 1회 실행\ngit maintenance run --task=commit-graph --task=prefetch\n\n# 3. 상태 확인\ngit maintenance status","description":"Git 2.29+에 추가된 공식 기능으로, OS cron 또는 systemd에 자동 등록되어 대규모 레포의 fetch 및 log 조회를 항시 초고속으로 유지합니다.","tags":["maintenance","성능최적화","데몬","전문가"],"outputExample":"git maintenance start: registered in crontab","level":"전문가"},{"id":"git-082","category":"git","title":"git worktree lock / prune / remove 다중 작업 트리 완전 제어","subtitle":"이동식 디스크나 네트워크 드라이브의 작업 트리 보호 및 삭제 정리","code":"# 1. 특정 워크트리가 자동 삭제되지 않도록 잠금\ngit worktree lock ../hotfix-worktree --reason \"USB 외장 드라이브 보관\"\n\n# 2. 잠금 해제\ngit worktree unlock ../hotfix-worktree\n\n# 3. 디렉토리가 수동 삭제되어 깨진 워크트리 메타데이터 정리\ngit worktree prune\n\n# 4. 안전하게 워크트리 및 디렉토리 삭제\ngit worktree remove ../hotfix-worktree","description":"worktree를 다량으로 운용할 때 유실이나 고아 메타데이터가 쌓이지 않도록 깔끔하게 관리합니다.","tags":["worktree","prune","lock","고급"],"outputExample":"Pruning worktrees: 1 cleaned up","level":"고급"},{"id":"git-083","category":"git","title":"git credential-cache 메모리 임시 자격 증명 캐싱","subtitle":"하드디스크에 비밀번호를 평문 저장하지 않고 1시간 동안만 RAM에 캐싱","code":"# 1. 3600초(1시간) 동안 메모리에 자격 증명 캐시\ngit config --global credential.helper 'cache --timeout=3600'\n\n# 2. 현재 캐시된 비밀번호 즉시 메모리에서 날리기 (로그아웃 효과)\ngit credential-cache exit","description":"공용 PC나 보안이 중요한 워크스테이션에서 디스크 노출 없이 안전하고 편리하게 HTTPS 인증을 유지합니다.","tags":["credential","cache","보안","인증"],"outputExample":"Credential cache set to 3600s","level":"고급"},{"id":"git-084","category":"git","title":"SSH 키 기반 커밋 서명 (GPG 대체 현대적 서명)","subtitle":"복잡한 GPG 툴 설치 없이 기존 SSH 공개키로 GitHub Verified 뱃지 획득","code":"# 1. 서명 포맷을 SSH로 변경\ngit config --global gpg.format ssh\n\n# 2. 나의 SSH 공개키 등록\ngit config --global user.signingkey ~/.ssh/id_ed25519.pub\n\n# 3. 모든 커밋에 자동 서명 활성화\ngit config --global commit.gpgsign true","description":"Git 2.34+ 및 GitHub 공식 지원으로, 번거로운 GPG 키체인 관리 없이 ed25519 SSH 키 하나로 완벽한 위조 방지 서명을 남깁니다.","tags":["SSH","커밋서명","Verified","보안"],"outputExample":"[main 4a1b] commit signed with SSH key","level":"고급"},{"id":"git-085","category":"git","title":"git merge -s ours vs -X ours 차이점과 주의사항","subtitle":"상대 변경사항을 완전히 무시하는 전략(-s) vs 충돌 시에만 우리 코드를 택하는 옵션(-X)","code":"# 1. [-s ours] (전략 자체가 ours):\n# 상대 브랜치의 코드를 완전히 버리고 우리 브랜치 코드만 그대로 유지하면서 머지 커밋 생성\ngit merge -s ours feature-legacy\n\n# 2. [-X ours] (기본 recursive/ort 전략에 옵션 부여):\n# 양쪽 변경사항을 정상 병합하되, 같은 줄 충돌이 났을 때만 우리 코드 우선 채택\ngit merge -X ours feature-new","description":"소문자 -s와 대문자 -X를 혼동하면 상대방의 모든 작업 코드가 통째로 증발할 수 있으므로 반드시 명확히 구분해야 합니다.","tags":["merge","전략","충돌해결","주의사항"],"outputExample":"Merge made by the recursive strategy.","level":"고급"},{"id":"git-086","category":"git","title":"git replace 객체 교체로 히스토리 위조 없이 레거시 연결","subtitle":"오래된 저장소 분할 커밋을 가상으로 이어 붙여 온전한 log 복원","code":"# 커밋 A를 커밋 B로 투명하게 대체\ngit replace <target-commit-sha> <replacement-commit-sha>\n\n# 깃 로그 확인 시 마치 원래 하나였던 히스토리처럼 연속 조회됨\ngit log --oneline\n\n# 영구 반영하여 완전히 합치고 싶을 때\n# git filter-repo --analyze","description":"Git 2.0+의 기능으로, 저장소를 중간에 쪼갰거나 아카이빙된 레거시 히스토리를 깃 해시 불일치 없이 투명하게 연결합니다.","tags":["replace","히스토리연결","고급기능","전문가"],"outputExample":"Replaced commit 1a2b... with 3c4d...","level":"전문가"},{"id":"git-087","category":"git","title":"git log -L 특정 함수의 탄생부터 현재까지 변경 히스토리","subtitle":"특정 함수가 과거에 어떻게 수정되고 발전했는지 함수 단위 추적","code":"# 문법: git log -L :<함수/정규식>:<파일명>\ngit log -L :filterAndSortItems:src/utils/filter.ts\n\n# 또는 특정 줄 번호 범위(15행부터 40행까지)의 변경 역사 추적\ngit log -L 15,40:src/utils/filter.ts","description":"파일 전체 히스토리를 뒤질 필요 없이, 해당 함수 블록만의 코드 diff와 커밋 내역만 집중적으로 보여줍니다.","tags":["log","-L","함수추적","코드분석"],"outputExample":"commit ... diff: -function +function","level":"고급"},{"id":"git-088","category":"git","title":"git notes 커밋 해시 변경 없이 메타데이터/리뷰 메모 부착","subtitle":"이미 푸시된 커밋의 해시를 깨뜨리지 않고 부가 정보 첨부","code":"# 1. 특정 커밋에 메모 추가\ngit notes add -m \"배포 완료: v2.1.0 승인자 홍길동\" HEAD\n\n# 2. 커밋 로그 조회 시 노트 내용 함께 표시\ngit log -1\n\n# 3. 원격 저장소로 노트 푸시\ngit push origin refs/notes/*","description":"CI/CD 빌드 번호, 코드 리뷰 결과, 보안 검수 승인 태그 등을 커밋 변경 없이 안전하게 부착합니다.","tags":["notes","메타데이터","코드리뷰"],"outputExample":"Notes: 배포 완료: v2.1.0 승인자 홍길동","level":"고급"},{"id":"git-089","category":"git","title":"git fsck --lost-found 유실된 댕글링(dangling) 커밋 완전 복구","subtitle":"브랜치를 삭제하고 reflog에서도 만료되어 증발한 커밋 구출","code":"# 1. 도달 불가능한 고아 커밋 및 블롭 탐색\ngit fsck --lost-found\n\n# 2. 발견된 dangling commit의 실제 내용 확인\ngit show <dangling-commit-hash>\n\n# 3. 해당 커밋을 새로운 복구 브랜치로 즉시 부활\ngit branch recovered-branch <dangling-commit-hash>","description":"Git의 최종 방어선입니다. Git은 어떤 실수로 브랜치를 날려도 가비지 컬렉션(GC) 전까지는 객체를 디스크에 보존합니다.","tags":["fsck","lost-found","커밋복구","전문가"],"outputExample":"dangling commit 9a8b7c...","level":"전문가"},{"id":"git-090","category":"git","title":"git diff --word-diff 단어 단위 인라인 변경 사항 비교","subtitle":"줄 전체가 바뀌는 대신 수정된 특정 단어만 [-삭제-]{+추가+} 강조","code":"# 1. 텍스트 단어 단위 비교\ngit diff --word-diff\n\n# 2. 색상 강조 단어 비교\ngit diff --word-diff=color","description":"긴 문장이나 긴 코드 줄에서 오타 하나 고쳤을 때 줄 전체가 빨강/초록으로 뒤덮이는 문제를 해결해
